# minimal ci: typecheck the convex backend and workbench, run the portal
# unit test, run the pow-cli rust tests, and validate shipped area summaries.
# pages deployment is branch-based and unaffected by this workflow.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: typecheck convex
        run: |
          npm install --no-audit --no-fund
          npx tsc --noEmit
      - name: check committed fixtures are current
        run: |
          node scripts/canonical_json_fixtures.mjs --check
          node scripts/evidence_version_fixtures.mjs --check
          node scripts/export_bundle_fixture.mjs --check
          node scripts/build_definition_guide.mjs --check
          node scripts/osm_confidence_judgments.mjs --check
          node scripts/stamp_csp.mjs --check
      - name: test evidence submission contract
        run: node --test convex/lib/*.node-test.mjs convex/*.node-test.mjs scripts/osm_confidence_judgments.node-test.mjs scripts/stamp_csp.node-test.mjs
      - name: typecheck workbench
        working-directory: apps/workbench
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm run test:concept
      - name: portal unit tests
        shell: bash
        run: |
          shopt -s nullglob
          status=0
          count=0
          for test_dir in apps/regions/nz/js apps/regions/_shared apps/shared; do
            test_files=("$test_dir"/*.test.cjs)
            if (( ${#test_files[@]} == 0 )); then
              echo "::error::No *.test.cjs files found in $test_dir"
              status=1
            fi
            for test_file in "${test_files[@]}"; do
              echo "Running $test_file"
              if ! node "$test_file"; then
                echo "::error file=$test_file::Test failed"
                status=1
              fi
              count=$((count + 1))
            done
          done
          echo "Ran $count browser-side test files"
          exit "$status"
      - name: dated-places builder tests
        run: python3 -m unittest scripts/test_build_occupancy_dated_places.py
      - name: woodberry import builder tests
        run: python3 -m unittest scripts/test_build_vu_woodberry_import.py
      - name: country registry tests
        run: python3 -m unittest scripts/test_build_country_registry.py
      - name: region catalogue builder tests
        run: python3 -m unittest scripts/test_build_region_catalog.py
      - name: timezone home-camera table tests
        run: python3 -m unittest scripts/test_build_tz_home.py
      - name: export materialiser tests
        run: python3 -m unittest scripts/test_materialise_convex_export.py
      - uses: astral-sh/setup-uv@v5
      - name: tiles builder tests (v2, grid and census; jsonschema runs the manifest schema test)
        run: uv run --with jsonschema==4.26.0 python -m unittest discover -s tools/tiles-r2 -p "test_*.py"
      - name: agent research pilot tests
        run: python3 -m unittest discover -s scripts/agent_research -p "test_*.py"
      - name: indicator schema tests
        run: uv run scripts/test_indicator_schema.py
      - name: validate area summaries
        run: bash scripts/validate_area_summaries.sh
      - name: columnar area-summary transport round trip
        run: |
          python3 -m unittest scripts/test_area_summary_columns.py
          python3 scripts/build_area_summary_columns.py --check

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test
        run: cargo test --workspace
