# minimal ci: typecheck the convex backend and workbench, run the portal
# unit test, run the pow-cli rust tests, and validate shipped area summaries.
# pages deployment is branch-based and unaffected by this workflow.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: typecheck convex
        run: |
          npm install --no-audit --no-fund
          npx tsc --noEmit
      - name: test evidence submission contract
        run: node --test convex/lib/*.node-test.mjs
      - name: typecheck workbench
        working-directory: apps/workbench
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
      - name: portal unit tests
        run: |
          node apps/regions/nz/js/claude-review-panel.test.cjs
          node apps/regions/nz/js/historical-claim-contract.test.cjs
          node apps/regions/nz/js/location-assertion-contract.test.cjs
          node apps/regions/nz/js/rapid-entry-contract.test.cjs
          node apps/regions/nz/js/occupancy-contract.test.cjs
          node apps/regions/nz/js/assigned-periods-dom.test.cjs
          node apps/regions/nz/js/portal-walkthrough-dom.test.cjs
          node apps/regions/nz/js/occupancy-review.test.cjs
          node apps/regions/nz/js/osm-history.test.cjs
          node apps/regions/nz/js/deep-link-context.test.cjs
          node apps/regions/nz/js/country-config.test.cjs
      - name: dated-places builder tests
        run: python3 -m unittest scripts/test_build_occupancy_dated_places.py
      - name: woodberry import builder tests
        run: python3 -m unittest scripts/test_build_vu_woodberry_import.py
      - name: country registry tests
        run: python3 -m unittest scripts/test_build_country_registry.py
      - uses: astral-sh/setup-uv@v5
      - name: validate area summaries
        run: bash scripts/validate_area_summaries.sh

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test
        run: cargo test --workspace
