<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Places of Worship | Austria Research Map</title>
  <link href="https://unpkg.com/maplibre-gl@3.6.1/dist/maplibre-gl.css" rel="stylesheet">
  <link href="../../shared/map-shell.css" rel="stylesheet">
  <link href="../../global/styles/maplibre-flat.css?v=20260717c" rel="stylesheet">
  <link href="../_shared/region-map.css?v=20260716h" rel="stylesheet">
</head>
<body>
  <div id="region-root"></div>
  <script src="../../global/config.public.js"></script>
  <script src="../../global/config.js"></script>
  <script src="https://unpkg.com/maplibre-gl@3.6.1/dist/maplibre-gl.js"></script>
  <script>
    // country-specific config only; shared behaviour lives in the runtime.
    // Austria's religious-affiliation series covers the nine Bundesländer
    // across seven waves, 1951–2021. The 1951–2001 waves are full-count
    // population-census self-declarations; the 2021 wave is not a census
    // count — the register-based 2021 census did not collect religion; the
    // 2021 figure therefore combines a voluntary sample survey, imputation for
    // children, and an estimate for the institutional population. That
    // mixed basis rides the flag note. The change metric is enabled: the
    // runtime shows change since the previous wave in the series, honest
    // here because each wave is labelled and the uneven, roughly decennial
    // spacing (with a 20-year gap from 2001 to 2021) is stated in the note.
    window.REGION_CONFIG = {
      countryCode: "AT",
      title: "Places of Worship | Austria Research Map",
      center: [13.9, 47.6],
      initialZoom: 6.4,
      censusLevels: {
        bundesland: {
          label: "Bundesland",
          boundaries: "data/at_bundesland_2017.geojson",
          summary: "data/area_summary_bundesland.json",
          codeProp: "area_code",
          nameProp: "area_name",
          credit: "Statistik Austria religious-affiliation counts by Bundesland, censuses 1951–2001 and 2021 combined estimate · Boundaries from geoBoundaries Austria ADM1 (2017)"
        }
      },
      defaultLevel: "bundesland",
      defaultMetric: "religious_affiliation_percent",
      defaultYear: 2021,
      metricsAvailable: [
        "religious_affiliation_percent",
        "no_religion_percent",
        "religious_change"
      ],
      metricLabels: {
        religious_change: {
          label: "Change since previous wave (pp)",
          note: "percentage-point change in the religious-affiliation share since the previous wave in the series; waves are roughly decennial from 1951 to 2001 with a 20-year gap to 2021. A wave-to-wave difference is therefore not an annual rate. The 2021 wave is a mixed register-plus-survey estimate rather than a census count"
        }
      },
      popupDenominatorNote: "Percentages use the source population denominator for the wave: for 1951–2001 the full-enumeration census total population, with not-stated responses left in the denominator and outside both headline categories. The 2021 figures are not a census count — the register-based 2021 census did not collect religion; they therefore combine a voluntary sample survey, imputation for children, and an estimate for the institutional population, and may be non-integer.",
      cityPresets: [
        { label: "Vienna", coords: [16.3738, 48.2082], zoom: 10 },
        { label: "Graz", coords: [15.4395, 47.0707], zoom: 10 },
        { label: "Linz", coords: [14.2858, 48.3069], zoom: 10 },
        { label: "Salzburg", coords: [13.0550, 47.8095], zoom: 10 },
        { label: "Innsbruck", coords: [11.4041, 47.2692], zoom: 10 },
        { label: "Klagenfurt", coords: [14.3053, 46.6247], zoom: 10 },
        { label: "Villach", coords: [13.8558, 46.6111], zoom: 10 },
        { label: "Wels", coords: [14.0231, 48.1575], zoom: 10 },
        { label: "Bregenz", coords: [9.7471, 47.5031], zoom: 10 },
        { label: "Eisenstadt", coords: [16.5231, 47.8457], zoom: 10 }
      ],
      geocode: { country: "at", biasLngLat: [13.9, 47.6] },
      onboarding: {
        title: "Austria research map",
        intro: "Religious-affiliation overlays for Austria's nine Bundesländer, across seven waves 1951–2021. The 1951–2001 waves are full-count population-census self-declarations; the 2021 wave is a mixed register-plus-survey estimate, because the register-based 2021 census did not collect religion.",
        bullets: [
          "Bundesländer are shaded by the share of the source population reporting a religious affiliation, or the share reporting none.",
          "Six waves, 1951–2001, are full-enumeration census self-declarations; not-stated responses stay in the denominator and outside both headline categories.",
          "The 2021 wave is not a census count. The register-based 2021 census did not collect religion; its figures therefore combine a voluntary sample survey, imputation for children, and an estimate for the institutional population, and may be non-integer.",
          "A change metric reports the percentage-point change since the previous wave. Waves are roughly decennial to 2001 with a 20-year gap to 2021; a wave-to-wave difference is therefore not an annual rate.",
          "Open <strong>Show Census Data</strong> (top centre) for the metric and year controls."
        ],
        links: [
          { label: "About this map", href: "overview.html" },
          { label: "Global map", href: "../../global/" }
        ]
      },
      wordmarkLinks: [
        { id: "wordmark-global", label: "Global map", href: "../../global/", title: "Open the global map" }
      ],
      censusSourceAttribution: 'Religious-affiliation counts from <a href="https://www.statistik.at/" target="_blank" rel="noopener">Statistik Austria</a>, population censuses 1951&ndash;2001 and the 2021 combined estimate &middot; Boundaries from <a href="https://www.geoboundaries.org/" target="_blank" rel="noopener">geoBoundaries</a> Austria ADM1 (2017)',
      censusFlagNote: "* The 1951–2001 waves are full-enumeration census self-declarations, with not-stated responses left in the denominator and outside both headline categories. The 2021 wave is not a census count: the register-based 2021 census did not collect religion; the 2021 figures therefore combine a voluntary sample survey, imputation for children, and an estimate for the institutional population, may be non-integer, and carry survey uncertainty rather than full-count precision. The change metric therefore compares a mixed 2021 estimate with the 2001 census across a 20-year gap and should be interpreted as a wave-to-wave difference. It is not an annual rate."
    };
  </script>
  <script src="../../shared/region-resolve.js?v=20260716f"></script>
  <script src="../_shared/region-map.js?v=20260717c"></script>
  <script src="../../shared/datamaps-switcher.js?v=20260717c"></script>
</body>
</html>
