<head>

<body>
  <div id="region-root"></div>
  <script src="../../global/config.public.js"></script>
  <script src="../../global/config.js"></script>
  <script src="https://unpkg.com/maplibre-gl@3.6.1/dist/maplibre-gl.js"></script>
  <script>
    // the country page stays declarative; shared behaviour lives in
    // ../_shared/region-map.js and keys on this config plus the data files
    window.REGION_CONFIG = {
      countryCode: "BD",
      title: "Places of Worship | Bangladesh Research Map",
      center: [90.35, 23.7],
      initialZoom: 6.3,
      censusLevels: {
        district_2022: {
          label: "District (2022)",
          boundaries: "data/bd_district_2022.geojson",
          summary: "data/area_summary_district_2022.json",
          codeProp: "area_code",
          nameProp: "area_name",
          credit: "Boundaries &copy; geoBoundaries; Bangladesh Bureau of Statistics; OCHA ROAP (CC BY 3.0 IGO)"
        }
      },
      defaultLevel: "district_2022",
      defaultMetric: "religious_affiliation_percent",
      defaultYear: 2022,
      // minority-share design: the flat five-category frame sums to 100 by
      // construction; the two legacy slots therefore carry declared constructs. The
      // affiliation slot is the reference-group (Muslim) share; the no-religion
      // slot is its exact complement, the minority share. Both are exposed.
      metricsAvailable: [
        "religious_affiliation_percent",
        "no_religion_percent"
      ],
      metricLabels: {
        religious_affiliation_percent: {
          label: "Muslim (%)",
          note: "share of the district's classified population reporting Muslim, Bangladesh's largest published census category, held constant as the reference group across every district. This is the reference group's share of the census frame, not a measure of affiliation versus non-affiliation. The popup shows this share and the minority share; the full composition (Muslim, Hindu, Christian, Buddhist, Others) rides each row of the downloadable area summary verbatim."
        },
        no_religion_percent: {
          label: "Minority share (%)",
          note: "share outside Bangladesh's largest published category, Muslim: the summed share of Hindu, Christian, Buddhist and Others, the exact complement of the Muslim share. This is arithmetic on the published affiliation categories; it is not a measure of no religion, belief, practice, or secularity."
        }
      },
      popupDenominatorNote: "Percentages use the sum of the five BBS census religion categories (Muslim, Hindu, Christian, Buddhist, Others) as the denominator. The Muslim (%) metric is the reference-group share; the Minority share (%) metric is its exact complement, the share outside the reference group (Hindu + Christian + Buddhist + Others). Table P08 is the sex-classified basis and excludes the 8,124 hijra (third gender) persons nationally, who are religion-classified only at division level. There is no no-religion and no not-stated category.",
      cityPresets: [
        { label: "Dhaka", coords: [90.4125, 23.8103], zoom: 10 },
        { label: "Chattogram", aliases: ["Chittagong"], coords: [91.8123, 22.3569], zoom: 10 },
        { label: "Khulna", coords: [89.5644, 22.8456], zoom: 10 },
        { label: "Rajshahi", coords: [88.6042, 24.3745], zoom: 10 },
        { label: "Sylhet", coords: [91.8687, 24.8949], zoom: 10 },
        { label: "Barishal", aliases: ["Barisal"], coords: [90.3535, 22.7010], zoom: 10 },
        { label: "Rangpur", coords: [89.2500, 25.7439], zoom: 10 },
        { label: "Mymensingh", coords: [90.4074, 24.7471], zoom: 10 }
      ],
      geocode: { country: "bd", biasLngLat: [90.35, 23.7] },
      onboarding: {
        title: "Bangladesh research map",
        intro: "Population and Housing Census 2022 religious-affiliation overlay by district (zila), from Bangladesh Bureau of Statistics Table P08.",
        bullets: [
          "Districts carry the census composition in five recognised categories: Muslim, Hindu, Christian, Buddhist and Others.",
          "Two metrics are shown: the Muslim (%) share, the reference group and Bangladesh's largest published category, and the Minority share (%), its exact complement (Hindu + Christian + Buddhist + Others). The minority share is highest in districts such as Rangamati and Bandarban.",
          "The minority share is arithmetic on the published affiliation categories; it is not a measure of no religion, belief, practice, or secularity. The census has no no-religion and no not-stated category. Tap a district for its Muslim share and minority share; the verbatim five-category counts ride every row of the downloadable area summary (see About this map).",
          "The district table is the sex-classified basis and excludes the 8,124 hijra (third gender) persons, who are religion-classified only at division level.",
          "Open <strong>Show Census Data</strong> (top centre) for the geography and metric controls."
        ],
        links: [
          { label: "About this map", href: "overview.html" },
          { label: "Global map", href: "../../global/" }
        ]
      },
      wordmarkLinks: [
        { id: "datamaps-link", label: "Data maps", href: "../", title: "All country data maps" },
        { id: "wordmark-global", label: "Global map", href: "../../global/", title: "Open the global map" }
      ],
      censusSourceAttribution: 'Census religion &copy; <a href="https://bbs.gov.bd/" target="_blank" rel="noopener">Bangladesh Bureau of Statistics</a>, Population and Housing Census 2022, National Report (Volume I), Table P08 &middot; Reuse terms unresolved (staging) &middot; Boundaries &copy; <a href="https://www.geoboundaries.org/" target="_blank" rel="noopener">geoBoundaries</a>; BBS; OCHA ROAP (CC BY 3.0 IGO)',
      censusFlagNote: "* The BBS census religion frame is Muslim, Hindu, Christian, Buddhist and Others, with no no-religion and no not-stated category; the frame therefore sums to 100% by construction. The map shades the reference-group (Muslim) share and its exact complement, the minority share; the no-religion slot label carries the minority share and no no-religion meaning. Table P08 is the sex-classified basis and excludes the 8,124 hijra (third gender) persons nationally. This product is held in staging until BBS census reuse terms are established."
    };
  </script>
  <script src="../_shared/region-map.js?v=20260712d"></script>
</body>
