    window.OVERVIEW_CONFIG = {
      countryCode: "BD",
      countryName: "Bangladesh",
      mapHref: "./",
      intro: "Census religious-affiliation composition for Bangladesh's 64 districts (zila) across two waves, 2011 and 2022, from the Bangladesh Bureau of Statistics (BBS): the 2011 Community Report series (Table C-13) and the 2022 National Report (Volume I), Table P08. The construct is census affiliation over a flat five-category frame shared by both waves; the map shades the reference-group (Muslim) share, its exact complement the minority share, and the change in the Muslim share between the two censuses on the stable 64-zila frame. It does not measure belief, practice, or attendance.",
      facts: {
        waves: "Two censuses: 2011 and 2022",
        geographies: "District / zila (ADM2): 64 districts in 8 divisions",
        metrics: "Muslim (%), Minority share (%), Muslim-share change"
      },
      reading: [
        "Districts are shaded by the reference-group (Muslim) share, Bangladesh's largest published census category, held constant as the reference group across every district and both waves, or by the Minority share, the summed share of Hindu, Christian, Buddhist and Others outside that reference group. Nationally in 2022 the Muslim share is 91.08% (150,415,066 of 165,150,492 on the Table P08 sex-classified basis, reproducing the published figure at two-decimal rounding); the reference-group value is that group's share of the census frame, never a measure of affiliation versus non-affiliation. The two metrics are exact complements and sum to 100 in every district. A change metric reports the percentage-point change in the Muslim share between 2011 and 2022 on the stable 64-zila frame; the minority-share change is the same magnitude with the opposite sign.",
        "The minority share is arithmetic on the published affiliation categories, the share outside Bangladesh's largest published category. It is not a measure of no religion, belief, practice, minority status in law, or self-understood identity. The BBS census religion frame is Muslim, Hindu, Christian, Buddhist and Others, with no no-religion category and no not-stated category; the frame sums to 100 percent by construction, and the legacy no-religion metric slot carries the minority share and no no-religion meaning.",
        "Percentages use the sum of the five BBS census religion categories (Muslim, Hindu, Christian, Buddhist, Others) as the denominator in each wave. The two waves carry a disclosed universe difference immaterial to the district minority shares. The 2011 wave (Table C-13 zila total) is the full enumerated population: the 2011 census carried no third-gender enumeration and the table has no not-stated category. The 2022 wave (Table P08) is the sex-classified basis and excludes the 8,124 hijra (third gender) persons nationally, who are religion-classified only at division level (Table 3.2.15); the 2022 district table therefore sums to 165,150,492 rather than the full 165,158,616 population. The 8,124-person exclusion (of 165 million) does not move any district share. Tap a district for its Muslim, Hindu, Christian, Buddhist and Others counts by census year, carried verbatim in every row.",
        "The 2022 record reconciles exactly. Table P08 parses to one national, eight division and 64 district rows; every Male + Female cell equals its printed Total; every district sums to its division and every division to the national row across all fifteen count columns; and the national category totals match the verified anchor (Muslim 150,415,066; Hindu 13,143,749; Christian 488,555; Buddhist 1,001,927; Others 101,195). The census-boundary join is exactly 64:64 after a nine-name anglicised-spelling concordance (Barishal to Barisal, Chattogram to Chittagong, and seven more).",
        "The 2011 wave is an assembly of all 64 Community Reports, every URL and file checksum pinned. Sixty-two zilas extract from Table C-13 with every zila's five categories summing to its printed total; Lalmonirhat is recovered from the Zila Series report (below), giving 63 zila totals from text layers that sum to 142,266,902; adding Bhola's independently published enumerated total (1,776,795) closes the national frame to the enumerated anchor 144,043,697, deviation zero. The 63-zila national composition (Muslim 90.32%, Hindu 8.60%, Christian 0.31%, Buddhist 0.63%, Others 0.14%) tracks the Volume-2 national infographic within the one-withheld-zila band.",
        "Two source-PDF defects were confirmed on re-download and handled without repair. Lalmonirhat's Community Report copy is a scanned image with no text layer for its C-13 religion pages, so its 2011 row was recovered under the conductor's authorized source swap (2026-07-12) from the Zila Series report, Table P05 zila-total line: an identical five-category frame and column order, a zila total (1,256,099) equal to the Volume-2 enumerated total exactly, cross-checked against the same report's Table PT14; its Buddhist count of 5 fires the fewer-than-ten marker, and the defective copy stays cached as documentation. Bhola's 2011 religion composition is withheld: its Community Report omits printed pages 229-240 (the C-13 zila-total religion line, byte-identical on re-download and on the alternate BBS host) and the authorized Zila-Series recovery also failed because that copy is image-only (a text layer is required, never optical character recognition). Bhola's 2011 row is never substituted, estimated, or interpolated; its published enumerated total is used only for national frame closure, and the row reads no-data, never zero. The recorded unblocks are a text-based mirror of the Bhola report, a re-issued BBS copy, or a project ruling on optical character recognition; all ride the manifest's deferred sources.",
        "Both waves share the identical five-category frame and the stable 64-zila boundary, and the only universe difference (the 8,124 hijra excluded from the 2022 sex-classified table) is immaterial to the shares, so a change metric is supported (the Peru 2007-2017 two-wave precedent): the map differences the reported Muslim share across 2011-2022 per district. Change is the difference of the reported shares; population growth is never treated as religion change, and a wave-to-wave difference is not an annual rate. Change renders on the 2022 wave; Bhola carries no change because its 2011 composition is withheld, and it reads no-data. National figures exist for 2001, 1991 and 1981, but a consolidated subnational product for those deeper waves is deferred pending further table extraction.",
        "The display frame is the geoBoundaries gbOpen BGD ADM2 layer (boundary ID BGD-ADM2-16705992, 64 features, represented year 2020), simplified at a 250 m tolerance; the 64-district set is stable across the 2011 and 2022 census waves and shared by both. No governed Bangladesh place-of-worship snapshot ships with this product; place counts and density metrics are null, and OSM coverage of mosques, temples, churches and Buddhist sites was not assessed in this build.",
        "This product is held in staging until BBS census reuse terms are established. BBS asserts copyright (ISBN 978-984-475-201-6) and no open-reuse licence was located. The project ships the derived district summaries with attribution while a BBS reuse ask is outgoing; if BBS objects the page comes down in a single-commit revert (project-lead middle-path ruling, 2026-07-11, task 6). The geoBoundaries boundary geometry is separately licensed CC BY 3.0 IGO. Religion figures in Bangladesh are politically salient for minority populations; the product renders the BBS record exactly and names the recognised categories neutrally, with no editorial framing."
      ],
      sources: [
        {
          name: "BBS Population and Housing Census 2011, Community Report series, Table C-13: Distribution of population by religion, residence and community (per-zila total line)",
          href: "http://nsds.bbs.gov.bd/en/topic/68/PHC%20Report%20(Community%20Series)",
          construct: "Census religion by person, exact counts in five categories (Muslim, Hindu, Christian, Buddhist, Others) by district; full enumerated population (no third-gender enumeration, no not-stated category). Lalmonirhat recovered from the Zila Series report (Table P05) under an authorized source swap; Bhola withheld on a source-PDF defect",
          years: "2011",

        },

          href: "https://bbs.gov.bd/site/page/47856ad0-7e1c-4aab-bd78-892733bc06eb/Population-and-Housing-Census",
          construct: "Census religion by person, exact counts in five categories (Muslim, Hindu, Christian, Buddhist, Others) by district; sex-classified basis excluding the 8,124 hijra classified only at division level",
          years: "2022",
          licence: "BBS asserts copyright (ISBN 978-984-475-201-6); no open-reuse licence located, reuse terms unresolved. The derived district summaries ship with BBS attribution while a reuse ask is outgoing; the product is held in staging and reverts in a single commit if BBS objects (project-lead ruling, 2026-07-11, task 6)"
        },
        {
          name: "geoBoundaries gbOpen BGD ADM2 (district) boundaries",
          href: "https://www.geoboundaries.org/api/current/gbOpen/BGD/ADM2/",
          construct: "Boundary geometry (64 district features), sources Bangladesh Bureau of Statistics and OCHA ROAP; joined to the census districts via the anglicised-spelling concordance",
          years: "2020 (represented year)",

        }

      accessData: {
        note: "This product is held in staging: BBS asserts copyright with no open-reuse licence located, and a reuse ask is outgoing. The committed products are the derived two-wave area summary and a simplified district boundary only; the raw census PDFs (64 Community Reports plus the 2022 National Report) and boundary GeoJSON are not committed.",
        sourceOfRecord: "Bangladesh Bureau of Statistics, <a href=\"http://nsds.bbs.gov.bd/en/topic/68/PHC%20Report%20(Community%20Series)\" target=\"_blank\" rel=\"noopener\">Population and Housing Census 2011, Community Report series, Table C-13</a> and <a href=\"https://bbs.gov.bd/site/page/47856ad0-7e1c-4aab-bd78-892733bc06eb/Population-and-Housing-Census\" target=\"_blank\" rel=\"noopener\">Census 2022, National Report (Volume I), Table P08</a>; boundaries from <a href=\"https://www.geoboundaries.org/api/current/gbOpen/BGD/ADM2/\" target=\"_blank\" rel=\"noopener\">geoBoundaries BGD ADM2</a>.",
        tables: "Two waves are the source of record on the stable 64-zila frame. For 2011, Table C-13 (Distribution of population by religion, residence and community) supplies each zila's total-line counts in the five categories: 62 zilas from the Community Reports plus Lalmonirhat from the Zila Series report (Table P05, authorized source swap) give 63 zila totals summing to 142,266,902; adding Bhola's published enumerated total (1,776,795, its religion composition withheld) closes the national frame to the enumerated anchor 144,043,697, deviation zero. For 2022, Table P08 (Population by Religion, Sex and District) parses to one national, eight division and 64 district rows; the five national category totals (Muslim 150,415,066; Hindu 13,143,749; Christian 488,555; Buddhist 1,001,927; Others 101,195) sum to 165,150,492 and reconcile through the eight divisions to every district; the sex-classified table excludes the 8,124 hijra classified only in Table 3.2.15, and the reference-group Muslim share is 91.0776%, reproducing the published national 91.08% at two-decimal rounding.",
        licence: "BBS asserts copyright (ISBN 978-984-475-201-6); no open-reuse licence was located and reuse terms are unresolved. The derived category summaries ship with BBS attribution while a reuse ask is outgoing; the product is held in staging and reverts in a single commit if BBS objects (project-lead middle-path ruling, 2026-07-11, task 6). The geoBoundaries BGD ADM2 geometry is CC BY 3.0 IGO per the release metadata.",
        script: "scripts/build_bd_area_summary.R",
        manifests: [
          { label: "bd-census-religion-2011-2022", href: "docs/manifests/bd-census-religion-2011-2022.json" }
