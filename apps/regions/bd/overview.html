    // public record for the Bangladesh research map; every string traces to

    window.OVERVIEW_CONFIG = {
      countryCode: "BD",
      countryName: "Bangladesh",
      mapHref: "./",
      intro: "Census religious-affiliation composition for Bangladesh's 64 districts (zila), a single 2022 snapshot from the Bangladesh Bureau of Statistics (BBS) Population and Housing Census 2022, National Report (Volume I), Table P08. The construct is census affiliation over a flat five-category frame; the map shades the reference-group (Muslim) share and its exact complement, the minority share. It does not measure belief, practice, or attendance.",
      facts: {
        waves: "One census: 2022",
        geographies: "District / zila (ADM2): 64 districts in 8 divisions",
        metrics: "Muslim (%), Minority share (%)"
      },
      reading: [
        "Districts are shaded by the reference-group (Muslim) share, Bangladesh's largest published census category, held constant as the reference group across every district, or by the Minority share, the summed share of Hindu, Christian, Buddhist and Others outside that reference group. Nationally the Muslim share is 91.08% (150,415,066 of 165,150,492 on the Table P08 sex-classified basis, reproducing the published figure at two-decimal rounding); the reference-group value is that group's share of the census frame, never a measure of affiliation versus non-affiliation. The two metrics are exact complements and sum to 100 in every district.",
        "The minority share is arithmetic on the published affiliation categories, the share outside Bangladesh's largest published category. It is not a measure of no religion, belief, practice, minority status in law, or self-understood identity. The BBS census religion frame is Muslim, Hindu, Christian, Buddhist and Others, with no no-religion category and no not-stated category; the frame sums to 100 percent by construction, and the legacy no-religion metric slot carries the minority share and no no-religion meaning.",
        "Percentages use the sum of the five BBS census religion categories (Muslim, Hindu, Christian, Buddhist, Others) as the denominator. Table P08 is the sex-classified basis and excludes the 8,124 hijra (third gender) persons nationally, who are religion-classified only at division level (Table 3.2.15); the district table therefore sums to 165,150,492 rather than the full 165,158,616 population. Tap a district for its Muslim, Hindu, Christian, Buddhist and Others counts, carried verbatim in every row.",
        "The record reconciles exactly. Table P08 parses to one national, eight division and 64 district rows; every Male + Female cell equals its printed Total; every district sums to its division and every division to the national row across all fifteen count columns; and the national category totals match the verified anchor (Muslim 150,415,066; Hindu 13,143,749; Christian 488,555; Buddhist 1,001,927; Others 101,195). The census-boundary join is exactly 64:64 after a nine-name anglicised-spelling concordance (Barishal to Barisal, Chattogram to Chittagong, and seven more).",
        "Only the 2022 wave is mapped, and no change metric is offered. The 2011 census published religion to community (union) level in the same five-category frame, and national figures exist for 2001, 1991 and 1981, but a consolidated subnational product for those waves is deferred pending further table extraction; subnational religion is pinned only for 2022 (district) and 2011 (one cached zila as a frame witness).",
        "The display frame is the geoBoundaries gbOpen BGD ADM2 layer (boundary ID BGD-ADM2-16705992, 64 features, represented year 2020), simplified at a 250 m tolerance; the 64-district set is stable across the 2011 and 2022 census waves. No governed Bangladesh place-of-worship snapshot ships with this product; place counts and density metrics are null, and OSM coverage of mosques, temples, churches and Buddhist sites was not assessed in this build.",
        "This product is held in staging until BBS census reuse terms are established. BBS asserts copyright (ISBN 978-984-475-201-6) and no open-reuse licence was located. The project ships the derived district summaries with attribution while a BBS reuse ask is outgoing; if BBS objects the page comes down in a single-commit revert (project-lead middle-path ruling, 2026-07-11, task 6). The geoBoundaries boundary geometry is separately licensed CC BY 3.0 IGO. Religion figures in Bangladesh are politically salient for minority populations; the product renders the BBS record exactly and names the recognised categories neutrally, with no editorial framing."
      ],
      sources: [
        {
          name: "BBS Population and Housing Census 2022, National Report (Volume I), Table P08: Population by Religion, Sex and District",
          href: "https://bbs.gov.bd/site/page/47856ad0-7e1c-4aab-bd78-892733bc06eb/Population-and-Housing-Census",
          construct: "Census religion by person, exact counts in five categories (Muslim, Hindu, Christian, Buddhist, Others) by district; sex-classified basis excluding the 8,124 hijra classified only at division level",
          years: "2022",
          licence: "BBS asserts copyright (ISBN 978-984-475-201-6); no open-reuse licence located, reuse terms unresolved. The derived district summaries ship with BBS attribution while a reuse ask is outgoing; the product is held in staging and reverts in a single commit if BBS objects (project-lead ruling, 2026-07-11, task 6)"
        },
        {
          name: "geoBoundaries gbOpen BGD ADM2 (district) boundaries",
          href: "https://www.geoboundaries.org/api/current/gbOpen/BGD/ADM2/",
          construct: "Boundary geometry (64 district features), sources Bangladesh Bureau of Statistics and OCHA ROAP; joined to the census districts via the anglicised-spelling concordance",
          years: "2020 (represented year)",
          licence: "Creative Commons Attribution 3.0 Intergovernmental Organisations (CC BY 3.0 IGO), per the release metadata"
        }
      ],
      accessData: {
        note: "This product is held in staging: BBS asserts copyright with no open-reuse licence located, and a reuse ask is outgoing. The committed products are the derived area summary and a simplified district boundary only; the raw census PDF and boundary GeoJSON are not committed.",
        sourceOfRecord: "Bangladesh Bureau of Statistics, <a href=\"https://bbs.gov.bd/site/page/47856ad0-7e1c-4aab-bd78-892733bc06eb/Population-and-Housing-Census\" target=\"_blank\" rel=\"noopener\">Population and Housing Census 2022, National Report (Volume I), Table P08</a>; boundaries from <a href=\"https://www.geoboundaries.org/api/current/gbOpen/BGD/ADM2/\" target=\"_blank\" rel=\"noopener\">geoBoundaries BGD ADM2</a>.",
        tables: "Table P08 (Population by Religion, Sex and District, 2022) is the source of record: one national, eight division and 64 district rows, each reporting Muslim, Hindu, Christian, Buddhist and Others by Total, Male and Female. The five national category totals (Muslim 150,415,066; Hindu 13,143,749; Christian 488,555; Buddhist 1,001,927; Others 101,195) sum to 165,150,492 and reconcile through the eight divisions to every district; the sex-classified table excludes the 8,124 hijra classified only in Table 3.2.15. The reference-group Muslim share is 91.0776%, reproducing the published national 91.08% (Table 3.2.15) at two-decimal rounding.",
        licence: "BBS asserts copyright (ISBN 978-984-475-201-6); no open-reuse licence was located and reuse terms are unresolved. The derived category summaries ship with BBS attribution while a reuse ask is outgoing; the product is held in staging and reverts in a single commit if BBS objects (project-lead middle-path ruling, 2026-07-11, task 6). The geoBoundaries BGD ADM2 geometry is CC BY 3.0 IGO per the release metadata.",
        script: "scripts/build_bd_area_summary.R",
        manifests: [
          { label: "bd-census-religion-2022", href: "docs/manifests/bd-census-religion-2022.json" }
        ]

      contribute: {

      }
