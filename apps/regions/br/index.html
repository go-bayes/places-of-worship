    // the whole country-specific surface; every behaviour lives in the

    window.REGION_CONFIG = {
      countryCode: "BR",

      censusLevels: {
        municipality: {
          label: "Municipality",
          boundaries: "data/br_municipality_2022.geojson",
          summary: "data/area_summary_municipality.json",

          boundaries: "data/br_uf_2022.geojson",
