    // country-specific config only; shared behaviour lives in the runtime.
    // bhutan's product is a locally defined administrative register of
    // religious institutions; it measures buildings rather than people.
    window.REGION_CONFIG = {
      countryCode: "BT",
      title: "Places of Worship | Bhutan Research Map",
      dataNoun: "Register",
      center: [90.43684, 27.50842],
      initialZoom: 6.7,
      censusLevels: {
        dzongkhag: {
          label: "Dzongkhag (20 units)",
          boundaries: "data/bt_dzongkhag.geojson",
          summary: "data/area_summary_dzongkhag.json",
          codeProp: "area_code",
          nameProp: "area_name",
          credit: "Register counts © National Statistics Bureau of Bhutan; no reuse terms stated, used with attribution pending confirmation · Boundaries © geoBoundaries, CC BY 3.0"
        }
      },
      defaultLevel: "dzongkhag",
      defaultMetric: "place_count",
      defaultYear: 2022,
      metricsAvailable: ["place_count"],
      metricLabels: {
        place_count: {
          label: "Religious institutions (count)",
          note: "administrative register count of religious institutions compiled by each Dzongkhag Administration and published in the National Statistics Bureau's Dzongkhag at a Glance series. The count describes buildings, never people. Bhutan collects no census or survey data on personal religious affiliation; the 2017 Population and Housing Census publishes no religion table at any grain. Each office and edition defines religious institution locally. Counts are therefore not comparable across dzongkhags or necessarily across years. Darker shading means a higher level in that dzongkhag's own register. It does not mean more religious infrastructure or greater population religiosity."
        }
      },
      popupDenominatorNote: "The National Statistics Bureau publishes these administrative register counts from each Dzongkhag Administration. They count religious-institution buildings, never people, and use no population denominator. Bhutan collects no census or survey data on personal religious affiliation; the 2017 Population and Housing Census publishes no religion table at any grain. Each dzongkhag office and edition defines religious institution locally. Counts are therefore not comparable across dzongkhags or necessarily across years, and the map makes no population-religiosity claim.",
      pendingAreaNote: "No register observation is carried for this dzongkhag in any edition; the source publishes none. No data is never zero.",
      cityPresets: [
        { label: "Thimphu", coords: [89.6339, 27.4728], zoom: 10 },
        { label: "Paro", coords: [89.4122, 27.4305], zoom: 10 },
        { label: "Trashigang", coords: [91.5542, 27.3331], zoom: 9 }

      geocode: { country: "bt", biasLngLat: [90.43684, 27.50842] },
