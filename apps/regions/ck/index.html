  <script>
    // country-specific config only; shared behaviour lives in the runtime.
    // The Cook Islands product is census religious affiliation by island from
    // the Cook Islands Statistics Office (CISO), three waves (2011, 2016, 2021)
    // across the twelve census island units: Rarotonga, the five Southern Group
    // islands (Aitutaki, Mangaia, Atiu, Mauke, Mitiaro), and the six Northern
    // Group islands (Palmerston, Pukapuka, Nassau, Manihiki, Rakahanga,
    // Penrhyn). The construct is census affiliation; it records each resident's
    // reported religious denomination and does not measure belief, practice,
    // attendance, or registered membership. The universe is the resident
    // population, all ages, in every wave; the religion question was not
    // compulsory, and roughly two percent did not respond in each wave. The
    // island denominators are comparable across 2011, 2016 and 2021, and the
    // national totals fall gently across the span (14,974; 14,802; 14,987).
    //
    // Religious affiliation is the sum of the named religion categories (Cook
    // Islands Christian Church, Roman Catholic, Seventh Day Adventist, Church of
    // Latter Day Saints, Assemblies of God, Apostolic Church, Other Religion,
    // with Jehovah's Witness inside affiliation). Jehovah's Witness is folded
    // into Other Religion in the 2011 and 2016 island tables and printed as a
    // separate column in 2021; folded back into affiliation, the named spine is
    // comparable across the three waves. The substantive cross-wave story is
    // denominational: the Cook Islands Christian Church share fell from 48.8
    // percent nationally in 2016 to 43.1 percent in 2021 (49.1 percent in 2011),
    // the sharpest decline on Rarotonga. That denominational composition lives
    // in the source religion tables and the build manifest's per-wave category
    // frames, not in the area-summary rows; the popup shows the affiliation and
    // no-religion shares by census year only.
    //
    // The no-religion line differs by frame across the waves, and this seam is
    // declared in the metric note and the popup note. In 2011 the source table
    // prints No Religion (national 841) and Objected to the Question or Not
    // Stated (national 323) as two separate columns; the No religion metric
    // carries the No Religion column only, and the separate Objected/Not Stated
    // column stays in the denominator and outside both headline numerators;
    // the affiliation and no-religion shares therefore do not add to 100 in
    // 2011. In 2016
    // and 2021 the source prints one combined No Religion/Not Stated line
    // (national 1,097 and 2,338), rendered as printed and including not-stated;
    // the affiliation and combined no-religion shares together exhaust the
    // population in those two waves. The national no-religion share therefore
    // reads 5.6 percent (2011), 7.4 percent (2016) and 15.6 percent (2021), and
    // the 2011-to-2016 rise partly reflects the line combine rather than a pure
    // rise in the no-religion population.
    //
    // All Cook Islands territory sits between roughly 157 and 166 degrees West,
    // far east of the antimeridian, and no dateline handling is needed. The
    // north-south spread is large (Penrhyn near 9 degrees South to Mangaia near
    // 22 degrees South); the camera frames Rarotonga in the south together with
    // the northern atolls (Penrhyn, Pukapuka, Manihiki) beside the panels. Place
    // and density metrics are null because no governed Cook Islands
    // place-of-worship snapshot ships.
    //
    // The boundary is a twelve-feature composite with a mixed licence disclosed
    // per feature. Seven islands (Rarotonga, Aitutaki, Mangaia, Atiu, Mauke,
    // Mitiaro, Penrhyn) are clustered from the geoBoundaries COK ADM0 Sentinel-2
    // land-cover parts (CC BY 4.0), with uninhabited Manuae/Takutea dropped as
    // decoys; five northern atolls (Palmerston, Pukapuka, Nassau, Manihiki,
    // Rakahanga) are assembled from OpenStreetMap coastline motu (ODbL 1.0). The
    // census-report tables carry an explicit Standards-clause grant permitting
    // reproduction with acknowledgement; the derived island summaries ship under
    // that grant with attribution to the Cook Islands Statistics Office. The
    // 2006 wave is published at island-group level only (2016 report Table 6)
    // and is held out of the island product as recoverable context.
    window.REGION_CONFIG = {
      countryCode: "CK",
      title: "Places of Worship | Cook Islands Research Map",
      // boundary extent lon -165.85..-157.34, lat -21.96..-8.99; all territory
      // 157-166 W, far east of the antimeridian (no dateline handling). centre
      // between the southern islands and the northern atolls; zoom fits
      // Rarotonga in the south together with Penrhyn and Pukapuka in the north
      // beside the panels.
      center: [-161.5, -15.5],
      initialZoom: 4.6,
      censusLevels: {
        island: {
          label: "Island (12 units)",
          boundaries: "data/ck_island_2021.geojson",
          summary: "data/area_summary_island.json",
          codeProp: "area_code",
          nameProp: "area_name",
          credit: "Census religion by island from the Cook Islands Statistics Office (CISO), Table 2.4 / 2.04 Resident Population by Religious Affiliation and Usual Residence, three waves 2011-2021, reproduced with acknowledgement under the report Standards clause · Boundaries: seven islands © geoBoundaries COK ADM0 (CC BY 4.0), Sentinel-2 10m land cover; five northern atolls © OpenStreetMap contributors (ODbL 1.0)"
        }
      },
      defaultLevel: "island",
      defaultMetric: "religious_affiliation_percent",
      defaultYear: 2021,
      metricsAvailable: [
        "religious_affiliation_percent",
        "no_religion_percent",
        "religious_change"
      ],
      metricLabels: {
        religious_affiliation_percent: {
          label: "Religious affiliation %",
          note: "share of the island's all-ages resident population reporting a named religion, on the island's own printed census Total. Religious affiliation sums the named religion categories (Jehovah's Witness folded into affiliation), and it is comparable across 2011, 2016 and 2021. The substantive cross-wave movement is denominational: the Cook Islands Christian Church share fell from 48.8 percent nationally in 2016 to 43.1 percent in 2021, the sharpest decline on Rarotonga; that composition lives in the source religion tables and the build manifest, not in these rows"
        },
        no_religion_percent: {
          label: "No religion %",
          note: "share in the census no-religion line, on the same all-ages census Total. The no-religion line differs by frame across the waves. In 2011 it is the No Religion column only (national 841); the separate Objected/Not Stated column (national 323) stays in the denominator and outside both numerators, and the two shares do not add to 100 that wave. In 2016 and 2021 it is the combined No Religion/Not Stated line (national 1,097 and 2,338), rendered as printed and including not-stated. The 2011-to-2016 rise in the no-religion share therefore partly reflects this line combine, not a pure rise in the no-religion population"
        },
        religious_change: {
          label: "Change since previous census (pp)",
          note: "percentage-point change in the affiliation share since the previous census (2011 to 2016, and 2016 to 2021); the spacing is roughly five-yearly and a wave-to-wave difference is not an annual rate. The affiliation share fell most sharply on Rarotonga between 2016 and 2021. The substantive cross-wave structure is denominational (the Cook Islands Christian Church decline) and lives in the source tables; the broad-affiliation headline does not carry it"
        }
      },
      popupDenominatorNote: "Percentages use each island's printed census Total (Table 2.4 for 2011; Table 2.04 for 2016 and 2021; all-ages resident population). Every wave counts the resident population of all ages, and the island denominators are comparable across 2011, 2016 and 2021. Religious affiliation is the sum of the named religion categories (Jehovah's Witness folded into Other Religion in the 2011 and 2016 island tables and printed separately in 2021, folded back into affiliation here). The no-religion line differs by frame: in 2011 it is the No Religion column only (national 841), with the separate Objected/Not Stated column (national 323) retained in the denominator and outside both numerators; the two shares therefore do not add to 100 that wave; in 2016 and 2021 it is the combined No Religion/Not Stated line (national 1,097 and 2,338), rendered as printed and including not-stated. The 2011-to-2016 rise in the no-religion share partly reflects this line combine rather than a pure rise in the no-religion population. The construct is census affiliation; it does not measure belief, practice, attendance, or registered membership. The substantive subnational structure is denominational (the Cook Islands Christian Church share fell from 48.8 percent nationally in 2016 to 43.1 percent in 2021, sharpest on Rarotonga); that composition lives in the source religion tables and the build manifest's per-wave category frames, not in these rows, and the popup shows the affiliation and no-religion shares by census year only. The 2006 wave is published at island-group level only and is held out of the island product as recoverable context.",
      cityPresets: [
        { label: "Avarua", aliases: ["Rarotonga"], coords: [-159.775, -21.207], zoom: 11 },
        { label: "Aitutaki", coords: [-159.79, -18.87], zoom: 11 },
        { label: "Mangaia", coords: [-157.92, -21.92], zoom: 11 },
        { label: "Penrhyn", aliases: ["Tongareva"], coords: [-158.05, -9.00], zoom: 10 },
        { label: "Pukapuka", coords: [-165.85, -10.88], zoom: 11 },
        { label: "Manihiki", coords: [-161.00, -10.40], zoom: 11 }
      ],
      geocode: { country: "ck", biasLngLat: [-161.5, -15.5] },
      onboarding: {
        title: "Cook Islands research map",
        intro: "Census religious-affiliation overlays for the twelve census islands of the Cook Islands across three censuses, 2011, 2016 and 2021, from the Cook Islands Statistics Office (CISO). The construct is census affiliation; it does not measure belief, practice, attendance, or registered membership.",
        bullets: [
          "Islands are shaded by the share reporting a named religion, or by the share in the census <code>No religion</code> line, shown as No religion %.",
          "Percentages use each island's printed census Total for its own wave. Every wave counts the resident population of all ages; the island denominators are comparable across 2011, 2016 and 2021.",
          "Religious affiliation sums the named religion categories. The substantive cross-wave movement is denominational: the Cook Islands Christian Church share fell from 48.8 percent nationally in 2016 to 43.1 percent in 2021 (49.1 percent in 2011), the sharpest decline on Rarotonga. That composition lives in the source religion tables and the build manifest's per-wave category frames; the broad-affiliation headline does not carry it.",
          "The no-religion line differs by frame. In 2011 it is the No Religion column only (national 841); the separate Objected/Not Stated column (national 323) stays in the denominator, and the two shares do not add to 100 that wave. In 2016 and 2021 it is the combined No Religion/Not Stated line (national 1,097 and 2,338), including not-stated. The national no-religion share reads 5.6 percent, 7.4 percent and 15.6 percent; the 2011-to-2016 rise partly reflects the line combine.",
          "A change metric reports the percentage-point change in the affiliation share since the previous census (2011 to 2016, 2016 to 2021); the roughly five-yearly spacing means a wave-to-wave difference is not an annual rate.",
          "The 2006 census published religion at island-group level only (Rarotonga / Southern / Northern) and is held as recoverable context; no 2006 island wave ships. Place and density metrics are null because no governed place-of-worship snapshot ships.",
          "The Cook Islands sit far east of the antimeridian; the camera frames Rarotonga in the south together with the northern atolls (Penrhyn, Pukapuka, Manihiki).",
          "Open <strong>Show Census Data</strong> (top centre) for the metric and year controls."
        ],
        links: [
          { label: "About this map", href: "overview.html" },
          { label: "Global map", href: "../../global/" }
        ]
      },
      wordmarkLinks: [
        { id: "datamaps-link", label: "Data maps", href: "../", title: "All country data maps" },
        { id: "wordmark-global", label: "Global map", href: "../../global/", title: "Open the global map" }
      ],
      censusSourceAttribution: 'Census religion by island from the <a href="https://stats.gov.ck" target="_blank" rel="noopener">Cook Islands Statistics Office</a> (CISO), Table 2.4 (2011) and Table 2.04 (2016, 2021) Resident Population by Religious Affiliation and Usual Residence, three waves 2011-2021. The reports&rsquo; Standards clause grants reproduction with acknowledgement (&ldquo;Any table or material may be reproduced and published provided acknowledgement is made of the source&rdquo;); the derived island summaries are reproduced with attribution to the Cook Islands Statistics Office &middot; Boundaries: seven islands from <a href="https://www.geoboundaries.org/api/current/gbOpen/COK/ADM0/" target="_blank" rel="noopener">geoBoundaries</a> COK ADM0, Creative Commons Attribution 4.0 International (CC BY 4.0), Sentinel-2 10m land cover; five northern atolls (Palmerston, Pukapuka, Nassau, Manihiki, Rakahanga) from &copy; OpenStreetMap contributors, Open Data Commons Open Database License 1.0 (ODbL 1.0). The mixed boundary licence is disclosed per feature.',
      censusFlagNote: "* Percentages use each island's printed census Total (Table 2.4 for 2011; Table 2.04 for 2016 and 2021; all-ages resident population, comparable across the three waves). Religious affiliation is the sum of the named religion categories (Cook Islands Christian Church, Roman Catholic, Seventh Day Adventist, Church of Latter Day Saints, Assemblies of God, Apostolic Church, Other Religion), with Jehovah's Witness folded into Other Religion in the 2011 and 2016 island tables and printed separately in 2021 (national 330), folded back into affiliation here. The no-religion line differs by frame: 2011 is the No Religion column only (national 841), with the separate Objected/Not Stated column (national 323) retained in the denominator and outside both numerators; the affiliation and no-religion shares therefore do not add to 100 that wave; 2016 and 2021 combine No Religion with Not Stated in one line (national 1,097 and 2,338), rendered as printed and including not-stated. The 2011-to-2016 rise in the no-religion share partly reflects this line combine rather than a pure rise in the no-religion population. The substantive subnational structure is denominational (the Cook Islands Christian Church share fell from 48.8 percent nationally in 2016 to 43.1 percent in 2021, sharpest on Rarotonga), documented in the source religion tables and the build manifest's per-wave category frames and not carried by these headline metrics. The 2006 wave is published at island-group level only (2016 report Table 6, Rarotonga / Southern / Northern) and is held out of the island product as recoverable context. Every island wave reconciles exactly against the printed island, group, national and category margins (national totals 14,974; 14,802; 14,987). The census content is reproduced with acknowledgement under the CISO report Standards clause. The boundary is a mixed-licence composite: seven islands from geoBoundaries COK ADM0 (CC BY 4.0, Sentinel-2 land cover) and five northern atolls from OpenStreetMap contributors (ODbL 1.0), disclosed per feature."
    };
  </script>
