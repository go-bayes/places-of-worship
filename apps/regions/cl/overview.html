    window.OVERVIEW_CONFIG = {
      countryCode: "CL",
      countryName: "Chile",
      mapHref: "./",
      intro: "Census religious affiliation across Chile's 346 communes over two waves, 2002 and 2024, from the Instituto Nacional de Estadísticas (INE), disseminated by the Biblioteca del Congreso Nacional (BCN Estadísticas Territoriales, tema 101 'Religión Declarada'). Both waves count the population aged 15 and over on the current 346-commune frame. The construct is census affiliation. It does not measure belief, practice, attendance, or membership.",
      facts: {
        waves: "Two censuses: 2002 and 2024",
        geographies: "Commune (346 units, current INE DPA frame)",
        metrics: "Religious affiliation %, no religion %, religious affiliation change"
      },
      reading: [
        "Communes are shaded by the share reporting a named religion, or by the share in the census 'Ninguna religión, ateo o agnóstico' line, shown as No religion %. Chile has a real no-religion line; the ordinary two-slot design therefore applies. Religious affiliation % is each commune's religion base minus the Ninguna line minus the 2024 No declara (non-response) line, and no religion % is the Ninguna share. Both use each commune's printed census religion base (total_r, 'Población total en encuesta Religión') as the denominator.",
        "The two shares need not sum to 100. The 2024 No declara non-response (national 87,515) sits in the denominator and in neither share. Defining affiliation as the base minus none minus non-response also folds in the INE-derived 'Otros cristianos y tradiciones relacionadas con Cristo' group (national residual 26,051 in 2024) that the BCN ten-category commune frame does not column. The product denominator is the full religion base; INE's headline percentages use the responder base (that base minus No declara), which places the product's 2024 no-religion share about 0.58 percentage points below the INE headline and leaves 2002 identical.",
        "The 2002 wave reconciles exactly internally: every commune's ten categories sum to its printed religion base, and the national base is 11,128,104 (Católica 7,784,616; Evangélica o Protestante 1,689,483; Ninguna 923,038; affiliation 10,205,066). The 2002 commune series runs about 0.87% below the INE regional and national base (roughly 11,226,309), uniform across every category; the shortfall is a commune-level re-tabulation base difference, recorded as a documented discrepancy and never redistributed.",
        "The 2024 wave closes to a national religion base of 15,205,784 (Católica 8,168,945; Evangélica o Protestante 2,466,441; Ninguna 3,903,128; No declara 87,515). The shipped affiliation slot (base minus none minus non-response) is 11,215,141, which matches the INE presentation within 180 persons; the small differences trace to the commune extract versus the headline release, not to any allocation.",
        "No religion rises sharply between the waves. The national share climbs from 8.3% in 2002 to 25.7% in 2024 on the full religion base (25.8% on INE's responder base), while the Roman Catholic share falls from 70.0% to 54.0% and Evangélica o Protestante rises from 15.1% to 16.3%. The pattern splits by region: the evangelical and secular south (Biobío, La Araucanía, Los Ríos, Ñuble) contrasts with strongly Catholic Coquimbo and the secular Metropolitana. The per-category composition rides verbatim on each row's quality flag as source context; it is not a shipped map metric.",
        "Both waves ride the current 346-commune INE DPA frame. The 2024 census joins the boundary one-to-one by CUT. The 2002 census is re-coded to the current frame by CUT for 304 communes and by unique name for 37 (the communes re-coded when the Los Ríos, Arica y Parinacota, and Ñuble regions were created), with none unmatched. Five communes are null in 2002: Alto Hospicio, Hualpén, Alto Biobío, and Cholchol were created in 2004, and their 2002 population sits inside their parent communes (Iquique, Talcahuano, Santa Bárbara, and Nueva Imperial); Puchuncaví is a genuine gap in the BCN 2002 series. Null 2002 cells render as no-data, never as zero, and no count is backcast or split.",
        "A change metric reports the percentage-point change in the affiliation share between 2002 and 2024 on the current 346-commune frame, a 22-year interval; a wave-to-wave difference is not an annual rate. The four 2004-parent communes carry a combined 2002 count that includes their later-created children, against a 2024 count that excludes them; differencing those shares would compare non-comparable populations, and those rows are flagged in the data and render no change, as do the five 2002-null communes. Religion was asked in the 2002 and 2024 censuses only: the 2012 census was annulled for methodological failure, the 2017 abbreviated census dropped the religion question, and the 1992 wave (population aged 5+) is a held universe break, documented as deeper history and not shipped.",
        "The boundary frame is the official INE DPA Censal commune layer (Comunas_Simp16R, 346 communes, CUT-coded), which joins the 2024 census one-to-one with no gaps or extras. Its extent includes Isla de Pascua (Easter Island, CUT 5201) and the Comuna Antártica (CUT 12202, reaching -89 lat, the Chilean Antarctic claim), rendered as the official INE record; the map opens on a continental camera that fits mainland Chile from Arica to Punta Arenas. No governed Chile place-of-worship snapshot ships with this product; place counts and density metrics are null."
      ],

        },

          construct: "Boundary geometry (346 communes with CUT codes); joins the 2024 census one-to-one. Extent includes Isla de Pascua (CUT 5201) and the Comuna Antártica (CUT 12202, -89 lat, Chilean Antarctic claim), rendered as the official record",
          years: "2017 (DPA Censal vintage), current frame",
          licence: "Instituto Nacional de Estadísticas (INE) open-data licence (CC BY-SA 4.0); the item's own licence field is blank and the governing licence is INE's site-wide open-data licence for INE content. The alternative geoBoundaries CHL ADM3 (CC BY 3.0 IGO, 345 units, name-only) is recorded in the probe as the explicit-licence swap-in"
        }
      ],
      accessData: {
        note: "The census reuse is accepted under the INE open-data licence (CC BY-SA 4.0, Reconocimiento-CompartirIgual 4.0); the product ships with attribution to INE and carries the share-alike notice, and states that the mapped shares are the project's derivation, not INE's own analysis (a courtesy note is recorded for the project lead). The committed products are the derived 346-commune area summary (692 rows across 2002 and 2024) and the simplified INE DPA commune boundary GeoJSON; the raw BCN census JSON and the source INE GeoJSON are not committed.",
        sourceOfRecord: "Instituto Nacional de Estadísticas (INE), <a href=\"https://www.bcn.cl/siit/estadisticasterritoriales/tema?id=101\" target=\"_blank\" rel=\"noopener\">Censo 2002 y Censo 2024, Religión Declarada por comuna</a> (via BCN Estadísticas Territoriales, tema 101), population aged 15 and over; boundaries from the <a href=\"https://services5.arcgis.com/hUyD8u3TeZLKPe4T/arcgis/rest/services/Limites_DPA_Censal_2017_AGOL/FeatureServer/3\" target=\"_blank\" rel=\"noopener\">INE DPA Censal commune layer</a> (Comunas_Simp16R, 346 communes).",
        tables: "The BCN theme 101 commune table is the source of record: 346 communes by two waves, on the identical harmonised ten-category frame (Católica, Evangélica o Protestante, Testigos de Jehová, Judaica, Mormón, Musulmana, Ortodoxa, Otro religión o credo, Ninguna religión/ateo/agnóstico, No declara religión). The area-summary religious_affiliation_percent field is the religion base minus Ninguna minus No declara, and no_religion_percent carries the Ninguna share; each row's quality_flag carries the verbatim per-category composition. The 2002 wave reconciles exactly (national base 11,128,104), and the 2024 wave closes to 15,205,784 with a 26,051 'Otros cristianos' residual folded into affiliation, matching the INE presentation within 180 persons.",
        licence: "INE publishes its content, including the census statistics and the geodata, under Creative Commons Reconocimiento-CompartirIgual 4.0 Internacional (CC BY-SA 4.0), quoted verbatim from ine.gob.cl/terminos-de-uso-y-licencia-de-datos-abiertos (retrieved 2026-07-12): free reuse including commercial, with attribution and share-alike, and a requirement to state that any derivation is not INE's own analysis. The derived commune summaries ship with attribution to INE, carry the share-alike notice, and state that the mapped shares are the project's derivation. The INE DPA Censal commune boundary carries the same INE open-data licence.",
