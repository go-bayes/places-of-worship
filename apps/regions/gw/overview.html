        "The nine units are shaded by the share reporting a religious affiliation (Animista, Muçulmana, Cristão, or Outra Religião), or by the share in the source's Sem religião category, shown as No religion %. The six source categories are mutually exclusive and partition each region's Guinean-nationality resident population.",
        "Percentages are the source's published one-decimal column shares. The source publishes no counts. Population and every count field are null, and no count is derived from a percentage. National religion counts exist in the same report (Quadro 3 and Quadro 5, total 1,442,227) but are never multiplied into the shares; no derived-count layer is built.",
        "A large Não declarado (Not declared) non-response category, 15.9% nationally and 10.5-25.7% across regions, sits inside the denominator and outside both shipped shares. The report warns that a relatively important percentage of respondents did not answer the religion question and that the results should be used with some care. The affiliation and no-religion shares do not add to 100; the Not-declared share is the remainder.",

        "The substantive contrast is religious composition, which the source records in Quadro 4 but the map does not shade: a Muslim-majority east (Gabú Muslim 86.5%, Bafatá 77.1%) against an animist and Christian west and islands (Biombo animist 40.1%, Bolama/Bijagós Christian 30.7%, Bissau Christian 40.2%). That per-category split is source context in Quadro 4; it is not a shipped map metric and is not in the popup.",

      accessData: {
        sourceOfRecord: "Instituto Nacional de Estatística, <a href=\"https://www.stat-guinebissau.com/\" target=\"_blank\" rel=\"noopener\">INE Guiné-Bissau</a>: the RGPH-2009 Características socioculturais report, Quadro 4, religion by region and Autonomous Sector; boundaries from <a href=\"https://www.geoboundaries.org/api/current/gbOpen/GNB/ADM1/\" target=\"_blank\" rel=\"noopener\">geoBoundaries GNB ADM1</a>.",
        tables: "Quadro 4 is the source of record for the shipped shares. It prints one-decimal column percentages for the six categories across the eight regions and the Sector Autónomo de Bissau, plus a national Guiné-Bissau column. The national counts in Quadro 3 and Quadro 5 sum exactly to 1,442,227 (Animista 215,130; Muçulmana 650,402; Cristão 318,021; Outra religião 414; Sem religião 29,542; ND 228,718), and each count as a share of that total reproduces the Quadro 4 Guiné-Bissau column within 0.1 percentage points. The area-summary religious_affiliation_percent field sums Animista, Muçulmana, Cristão, and Outra Religião; the no_religion_percent field carries the Sem religião share. No count is derived from any percentage.",
        licence: "Census reuse is under review (needs_review). The INE Guiné-Bissau website carries an all-rights-reserved footer, “Instituto Nacional de Estatistica da Guiné-Bissau 1991-2020 © Todos os direitos reservados”, and no open-data licence was located on the site. Under the project's build-then-ask posture the derived product ships to staging with attribution while a reuse ask goes to the project lead; the recorded ask asks whether the transcribed one-decimal regional percentages may be published as a derived map product given the all-rights-reserved footer and the absence of a located open-data licence. The geoBoundaries GNB ADM1 boundary is ODbL 1.0 per the release metadata, OpenStreetMap-derived.",
