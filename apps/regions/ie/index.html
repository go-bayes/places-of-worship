  <script>
    // the whole country-specific surface; every behaviour lives in the
    // shared module (../_shared/region-map.js) and keys on this config
    // and the data products, never on country identity
    window.REGION_CONFIG = {
      countryCode: "IE",
      title: "Places of Worship | Ireland Research Map",
      // republic of ireland extent, centred west of dublin so the island
      // fits comfortably behind the census panel
      center: [-8.1, 53.35],
      initialZoom: 6,
      // each level is a governed area-summary product plus its boundary
      // file; paths resolve from this page's directory

        county_city: {
          label: "County and city",
          boundaries: "data/county_city_2019.geojson",
          summary: "data/area_summary_county_city.json",
          codeProp: "area_code",
          nameProp: "area_name",
          credit: "Boundaries © Tailte Éireann (CC BY 4.0) · 2019 administrative areas, Cork dissolved to match CSO F5051"
        }
      },
      defaultLevel: "county_city",
      defaultMetric: "religious_affiliation_percent",
      defaultYear: 2022,
      // no governed ireland places-of-worship snapshot is included yet,
      // so the place-rate metrics are hidden until that layer exists
      metricsAvailable: [
        "religious_affiliation_percent",
        "no_religion_percent",
        "religious_change"
      ],
      popupDenominatorNote: "Percentages use people usually resident and present in the State with a stated religion response: CSO F5051 All religions minus Not stated.",
      cityPresets: [
        { label: "Dublin", coords: [-6.2603, 53.3498], zoom: 11 },

        { label: "Waterford", coords: [-7.1101, 52.2593], zoom: 11 }

      geocode: { country: "ie", biasLngLat: [-8.1, 53.35] },
      onboarding: {
        title: "Ireland research map",
        intro: "County-and-city census religious-affiliation overlays for Ireland, 2011 to 2022.",
        bullets: [
          "The census overlay is on: areas are shaded by religious affiliation among people with a stated religion response.",
          "Open <strong>Show Census Data</strong> (top centre) for the metric and year slider.",
          "Tap an area for its census detail."
        ],
        links: [
          { label: "About this map", href: "overview.html" },
          { label: "Global map", href: "../../global/" }

      datedPlaces: "data/dated_places.geojson",

      censusFlagNote: "* Cork City and Cork County are dissolved from two Tailte administrative-area features because CSO F5051 publishes them as one reporting unit."
