<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kenya verification tasks | Places of Worship</title>
    <script>
        (function () {
            var target = new URL("../nz/verification.html", window.location.href);
            var params = new URLSearchParams(window.location.search);
            params.set("country", "ke");
            target.search = params.toString();
            window.location.replace(target.toString());
        })();
    </script>
</head>
<body>
    <p>
        Opening the Kenya verification tasks portal.
        <a href="../nz/verification.html?country=ke">Continue if it does not open automatically.</a>
    </p>
</body>
</html>
