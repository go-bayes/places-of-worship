<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Places of Worship | Saint Lucia Research Map</title>
  <link href="https://unpkg.com/maplibre-gl@3.6.1/dist/maplibre-gl.css" rel="stylesheet">
  <link href="../../shared/map-shell.css" rel="stylesheet">
  <link href="../../global/styles/maplibre-flat.css?v=20260717c" rel="stylesheet">
  <link href="../_shared/region-map.css?v=20260717f" rel="stylesheet">
</head>
<body>
  <div id="region-root"></div>
  <script src="../../global/config.public.js"></script>
  <script src="../../global/config.js"></script>
  <script src="https://unpkg.com/maplibre-gl@3.6.1/dist/maplibre-gl.js"></script>
  <script>
    // country-specific config only; shared behaviour lives in the runtime.
    // Saint Lucia's product is CSO census religious affiliation by ten
    // districts for 2001, 2010, and 2022. The source publishes integer
    // category cells that do not always sum to its own printed totals; the
    // product ships the published values unchanged and discloses each
    // overrun. Cross-wave change is withheld because the category frames
    // differ across the three waves (most sharply in the 2022 split of
    // Atheist from None). The 2022 figures are Provisional Results, Release 1.
    window.REGION_CONFIG = {
      countryCode: "LC",
      title: "Places of Worship | Saint Lucia Research Map",
      // saint lucia is a single small island; centre on the ten districts
      // with margin above the northernmost district (Gros Islet) so the
      // top-centre census control stays clear of the land
      center: [-60.98, 13.9],
      initialZoom: 9.8,
      censusLevels: {
        district: {
          label: "District",
          boundaries: "data/lc_district_2015.geojson",
          summary: "data/area_summary_district.json",
          codeProp: "area_code",
          nameProp: "area_name",
          credit: "Census religion © Central Statistical Office of Saint Lucia, adapted under the CSO Open Licence Agreement · Boundaries © geoBoundaries (CC0 1.0)"
        }
      },
      defaultLevel: "district",
      defaultMetric: "religious_affiliation_percent",
      defaultYear: 2022,
      // the two census-question shares; place and change metrics are omitted
      // because no place layer is built and cross-wave change is withheld
      metricsAvailable: [
        "religious_affiliation_percent",
        "no_religion_percent"
      ],
      cityPresets: [
        { label: "Castries", coords: [-60.9875, 14.0101], zoom: 12 },
        { label: "Vieux Fort", coords: [-60.9553, 13.7246], zoom: 12 },
        { label: "Soufrière", coords: [-61.0564, 13.8566], zoom: 12 },
        { label: "Gros Islet", coords: [-60.9526, 14.0817], zoom: 12 },
        { label: "Micoud", coords: [-60.9002, 13.8207], zoom: 12 },
        { label: "Dennery", coords: [-60.8886, 13.9142], zoom: 12 }
      ],
      geocode: { country: "lc", biasLngLat: [-60.98, 13.9] },
      onboarding: {
        title: "Saint Lucia research map",
        intro: "Census religious affiliation across Saint Lucia's ten districts, at the 2001, 2010, and 2022 Population and Housing Censuses.",
        bullets: [
          "The census overlay is on: districts are shaded by the share reporting a religious affiliation, or the share reporting no religion, against the stated-response denominator for each wave.",
          "Open <strong>Show Census Data</strong> (top centre) to choose the metric, geography, and census year (2001, 2010, 2022).",
          "In nine of the 2022 printed district columns and several 2001 and 2010 printed rows, the source's own category counts sum to between one and three people away from the printed totals; the map ships the published census values unchanged and does not adjust them.",
          "The 2022 figures are Provisional Results, Release 1; the Central Statistical Office lists no superseding final report. Cross-wave change is withheld because the category frames differ across the three waves.",
          "Tap a district for its per-census detail."
        ],
        links: [
          { label: "About this map", href: "overview.html" },
          { label: "Global map", href: "../../global/" }
        ]
      },
      wordmarkLinks: [
        { id: "wordmark-global", label: "Global map", href: "../../global/", title: "Open the global map" }
      ],
      // the CSO Open Licence Agreement requires this acknowledgement verbatim
      // for value-added products; it is a licence obligation, not decoration
      censusSourceAttribution: 'This product was adapted from the information of The Central Statistical Office of Saint Lucia, which is licensed under the Open Licence Agreement of The Central Statistical Office of Saint Lucia. Census religion © <a href="https://stats.gov.lc/" target="_blank" rel="noopener">Central Statistical Office of Saint Lucia</a> &middot; Boundaries © <a href="https://www.geoboundaries.org/" target="_blank" rel="noopener">geoBoundaries</a> (CC0 1.0, source Wikimedia Commons)',
      popupDenominatorNote: "Percentages are shares of the stated-response denominator: the printed district total less the source's non-response category (Not stated in 2001 and 2010, Not reported in 2022). The source publishes integer category cells that do not always sum to its own printed totals; in nine of the 2022 printed district columns and several 2001 and 2010 printed rows the category counts differ from the printed totals by one to three people, and the map ships the published values unchanged. The 2022 figures are Provisional Results, Release 1, and cover the household population, leaving 1,114 residents in institutions outside their basis. Cross-wave change is withheld because the category frames differ across the three waves.",
      censusFlagNote: "* the source publishes integer category cells that do not always sum to its own printed district totals: in nine of the 2022 printed district columns and several 2001 and 2010 printed rows the category counts differ from the printed totals by one to three people. The map ships the published census values unchanged and does not adjust them. The 2022 figures are Provisional Results, Release 1."
    };
  </script>
  <script src="../../shared/region-resolve.js?v=20260716f"></script>
  <script src="../_shared/region-map.js?v=20260903a"></script>
  <script src="../../shared/datamaps-switcher.js?v=20260717d"></script>
</body>
</html>
