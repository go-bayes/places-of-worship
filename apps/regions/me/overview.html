        "Municipalities are shaded by the share of the total census population in the published named-religion categories, or the share in the source's no-religion categories. Non-response (undeclared and unknown) stays in the denominator and outside both headline categories.",
        "The product ships one stable frame: the 21-municipality administrative division in force for the 2003 and 2011 censuses. The 2023 census reports 25 municipalities; the four units created after 2011 are summed back into their historical parents as complete partitions: Petnjica into Berane (created 2013), Gusinje into Plav (2014), and Tuzi (2018) and Zeta (2024) into Podgorica. Because each new unit was carved wholly from one parent, the 25 units aggregate to the historical 21 as an exact complete partition; no allocation or splitting is performed, and the aggregated totals reconcile to the national total exactly.",
        "Municipality population totals are published in full and reconcile exactly to the national total for every wave (620,145 in 2003; 620,029 in 2011; 623,633 in 2023); the population-denominator surface is therefore exact everywhere. Category counts reconcile exactly for 2003 and 2011.",
        "For 2023, MONSTAT applies statistical-confidentiality suppression, marked \"z\", to small municipal category cells. After aggregation to the 21-municipality frame, 17 of the 21 municipalities carry at least one suppressed cell, and the total suppressed mass is 247 persons. The 2023 affiliation and no-religion shares are therefore computed from the published (unsuppressed) cells and are published-cell lower bounds where suppression applies; the suppressed mass is disclosed and never redistributed or estimated. The affected shares are understated by at most about one percentage point in the smallest municipality (Šavnik, gap 20 of 1,569) and far less elsewhere. Because the population denominator is exact, these rows are surfaced through the popup asterisk and the flag note rather than washed out of the choropleth.",
