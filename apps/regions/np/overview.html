    // public record for the Nepal research map; every string traces to
    // docs/manifests/np-census-religion-2021.json (parameters, construct_notes,
    // validation, source_datasets), research/countries/np/route-probe.md, the
    // data product apps/regions/np/data/area_summary_district.json (indicator
    // declarations and quality flags), or the live REGION_CONFIG in
    // apps/regions/np/index.html. the minority-share design declarations and the
    // staging position carry the manifest text, no more and no less. authors
    // nothing.
    window.OVERVIEW_CONFIG = {
      countryCode: "NP",
      countryName: "Nepal",
      mapHref: "./",
      intro: "District census religion for Nepal, a single 2021 snapshot from the National Statistics Office of Nepal (NSO), National Population and Housing Census 2021, Table 5 (Population by Religion and Sex). The construct is census affiliation over the ten-category official frame, rendered exactly as the NSO prints it; the map shades the reference-group (Hindu) share and its exact complement, the minority share. It does not measure belief, practice, or attendance.",
      facts: {
        waves: "One census: 2021",
        geographies: "District (OCHA COD-AB admin2): 77 districts in 7 provinces",
        metrics: "Hindu (%), Minority share (%)"
      },
      reading: [
        "Districts are shaded by the reference-group (Hindu) share, Nepal's largest published national category, held constant as the reference group across every district, or by the Minority share, the summed share of Bouddha, Islam, Kirat, Christian, Prakriti, Bon, Jain, Bahai and Sikha outside that reference group. Nationally the Hindu share is 81.19% (23,677,744 of 29,164,578); the reference-group value is that group's share of the census frame, never a measure of affiliation versus non-affiliation. The two metrics are exact complements and sum to 100 in every district.",
        "The minority share is arithmetic on the published census categories, the share outside Nepal's largest published category. It is not a measure of no religion, belief, practice, minority status in law, or self-understood identity. The 2021 census religion frame has no no-religion category and no not-stated category; the frame sums to 100 by construction, and the legacy no-religion metric slot carries the minority share and no no-religion meaning. The minority share is highest in the northern and eastern hill and mountain districts: Rasuwa carries Nepal's highest minority share (Hindu 25.61, minority 74.39), with Panchthar next (minority 70.79) and Taplejung third (minority 69.55); Baitadi in the far-western hills is the lowest (minority 0.04).",
        "Percentages use each district's total census population (the sum of the ten published religion categories) as the denominator. Religion is asked of the whole resident population of all ages; each district's denominator is therefore its full total population, and the district shares are directly comparable within the wave. Tap a district for its Hindu, Bouddha, Islam, Kirat, Christian, Prakriti, Bon, Jain, Bahai and Sikha counts, carried verbatim in every row.",
        "The record reconciles exactly. Every district's ten religion cells sum to its printed total population, and the 77 district totals sum exactly to the national 29,164,578; both margins close integer-exact with zero deviations, and there is no cell suppression. The national category totals match the verified anchor (Hindu 23,677,744; Bouddha 2,393,549; Islam 1,483,066; Kirat 924,204; Christian 512,313; Prakriti 102,048; Bon 67,223; Jain 2,398; Bahai 537; Sikha 1,496). The census-boundary join is exactly 77:77 after normalising four parenthesis labels (Nawalparasi East and West, Rukum East and West), with the remaining 73 matched on a trimmed exact string.",
        "The composition, carried verbatim in every row, is sharply regional and is the reason to map Nepal. Rasuwa is 70.8 percent Bouddha, Panchthar 55.7 percent Kirat, and Rautahat 22.5 percent Islam. Buddhism concentrates in the high mountains (Manang, Mustang, Solukhumbu) and the Kathmandu Valley, Kirat in the eastern hills of Koshi province, Islam in the Madhesh Terai (Rautahat, Kapilbastu, Banke, Bara), and Christianity in parts of the eastern hills and the west. Only the 2021 wave is mapped and no change metric is offered: the full 75-district 2011 religion table (Table 22) is not yet in a reachable open product and is held pending recovery, and the 2015 district split (75 to 77) and the 2011 'Undefined' residual bar cross-wave change in any case.",
        "The display frame is the OCHA COD-AB Nepal admin2 district layer (77 features, cod_version V_02, valid 2024-03-14, Survey Department of Nepal / UN Resident Coordinator's Office via OCHA Field Information Services), simplified with mapshaper weighted keep-shapes; the 77-district set is the correct per-vintage boundary for the 2021 census. No governed Nepal place-of-worship snapshot ships with this product; place counts and density metrics are null. This product is held in staging until National Statistics Office census reuse terms are confirmed: the NSO census-results portal asserts all rights reserved with no open-reuse licence located, and the project ships the derived district summaries with NSO attribution while a reuse ask is outgoing; if the NSO objects the page comes down in a single-commit revert (build-then-ask ruling). The OCHA COD-AB boundary geometry is separately licensed CC BY-IGO. Religion figures in Nepal are politically salient for minority communities; the product renders the NSO record exactly and names the recognised categories neutrally, with no editorial framing."
      ],
      sources: [
        {
          name: "NSO National Population and Housing Census 2021, Table 5: Population by Religion and Sex (district table)",
          href: "https://censusresults.nsonepal.gov.np/",
          construct: "Census religion by person, exact counts in ten categories (Hindu, Bouddha, Islam, Kirat, Christian, Prakriti, Bon, Jain, Bahai, Sikha) by district; integer full-count, all persons of all ages, nothing combined and no small-cell suppression",
          years: "2021",
          licence: "No open-data licence is stated on the NSO census tables; the National Statistics Office census-results portal asserts 'Copyright © National Statistics Office 2023. All rights reserved'. The derived district summaries ship with NSO attribution under the build-then-ask ruling while a reuse-confirmation ask is outgoing; the product is held in staging and reverts in a single commit if the NSO objects"
        },
        {
          name: "OCHA COD-AB Nepal admin2 (district) boundaries",
          href: "https://data.humdata.org/dataset/cod-ab-npl",
          construct: "Boundary geometry (77 district features, cod_version V_02, valid 2024-03-14), sources Survey Department of Nepal and the UN Resident Coordinator's Office via OCHA Field Information Services; joined to the census districts one-to-one after a four-name parenthesis concordance",
          years: "2024 (valid_on 2024-03-14)",
          licence: "Creative Commons Attribution for Intergovernmental Organisations (CC BY-IGO), OCHA Field Information Services / Survey Department of Nepal, per the HDX release metadata"
        }
      ],
      accessData: {
        note: "This product is held in staging: the National Statistics Office asserts all rights reserved with no open-reuse licence located, and a reuse ask is outgoing. The committed products are the derived area summary and a simplified district boundary only; the raw census workbook and boundary bundle are not committed.",
        sourceOfRecord: "National Statistics Office of Nepal, <a href=\"https://censusresults.nsonepal.gov.np/\" target=\"_blank\" rel=\"noopener\">National Population and Housing Census 2021, Table 5</a> (Population by Religion and Sex); boundaries from <a href=\"https://data.humdata.org/dataset/cod-ab-npl\" target=\"_blank\" rel=\"noopener\">OCHA COD-AB Nepal admin2</a> (Survey Department of Nepal / OCHA FISS).",
        tables: "Table 5 (Population by Religion and Sex, 2021), Prov_District_local level sheet, is the source of record: 77 district rows, each reporting Hindu, Bouddha, Islam, Kirat, Christian, Prakriti, Bon, Jain, Bahai and Sikha as exact counts. Every district's ten category counts sum to its printed total population, and the 77 district totals sum exactly to the national 29,164,578; the ten national category totals close to the person against the 2021 National Report on Caste/Ethnicity, Language and Religion (Table 14) and the 2024 Population Composition report (Table 3.22). The reference-group Hindu share is 81.19% nationally. The area-summary religious_affiliation_percent field carries the Hindu reference-group share and no_religion_percent carries its exact complement, the minority share; each row's quality_flag carries the verbatim ten-category composition (source_categories_verbatim).",
        licence: "No open-data licence is stated on the NSO census tables; the census-results portal footer asserts 'Copyright © National Statistics Office 2023. All rights reserved', and the linked Copyright Policy and Terms of Use pages are client-rendered and expose no reuse grant. The derived category summaries ship with NSO attribution under the build-then-ask ruling while a reuse-confirmation ask is outgoing; the product is held in staging and reverts in a single commit if the NSO objects. The OCHA COD-AB Nepal admin2 boundary geometry is CC BY-IGO with attribution to OCHA / Survey Department of Nepal.",
        script: "scripts/build_np_area_summary.R",
        manifests: [
          { label: "np-census-religion-2021", href: "docs/manifests/np-census-religion-2021.json" }
        ]
      },
      contribute: {
        pendingNote: "The Nepal map is a census-derived product with no evidence-submission portal yet. Place-of-worship geometry can still be corrected on OpenStreetMap.",
        osm: "https://github.com/go-bayes/places-of-worship?tab=readme-ov-file#how-can-i-add-or-correct-a-place-of-worship-on-the-map"
      }
    };
