<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NZ OSM Verification Tasks</title>
    <link rel="icon" href="data:,">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            color: #17202a;
            background: #f4f6f7;
            font-size: 15px;
            line-height: 1.45;
        }

        .app-shell {
            display: grid;
            grid-template-columns: minmax(320px, 390px) 1fr;
            height: 100vh;
            min-height: 680px;
        }

        .sidebar {
            background: #ffffff;
            border-right: 1px solid #d8dee4;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid #d8dee4;
        }

        .sidebar-header h1 {
            margin: 0 0 6px 0;
            font-size: 22px;
            line-height: 1.2;
            color: #1f2d3d;
        }

        .sidebar-header p {
            margin: 0;
            color: #5d6d7e;
            font-size: 14px;
            line-height: 1.45;
        }

        .nav-links {
            display: flex;
            gap: 12px;
            margin-top: 12px;
        }

        .nav-links a {
            color: #1f618d;
            font-size: 14px;
            text-decoration: none;
            font-weight: 700;
        }

        .filters {
            display: grid;
            gap: 10px;
            padding: 14px 16px;
            border-bottom: 1px solid #d8dee4;
        }

        label {
            display: grid;
            gap: 6px;
            color: #34495e;
            font-size: 13px;
            font-weight: 700;
        }

        input,
        select,
        textarea,
        button {
            width: 100%;
            border: 1px solid #ccd3da;
            border-radius: 5px;
            font: inherit;
            font-size: 15px;
            padding: 10px 12px;
            background: #ffffff;
        }

        button {
            border-color: #1f618d;
            background: #1f618d;
            color: #ffffff;
            cursor: pointer;
            font-weight: 700;
            min-height: 44px;
        }

        button.secondary {
            background: #ffffff;
            color: #1f618d;
        }

        button.tertiary {
            background: #ffffff;
            color: #1f618d;
            border: 1px solid #1f618d;
            font-weight: 700;
            font-size: 13px;
            padding: 6px 10px;
            min-height: 32px;
            width: auto;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            padding: 12px 16px;
            border-bottom: 1px solid #d8dee4;
        }

        .stat {
            padding: 8px;
            border: 1px solid #e2e8f0;
            border-radius: 4px;
            background: #f8fafc;
        }

        .stat strong {
            display: block;
            font-size: 18px;
            color: #17202a;
        }

        .stat span {
            display: block;
            margin-top: 2px;
            color: #566573;
            font-size: 12px;
        }

        .task-list {
            overflow: auto;
            padding: 8px;
            border-bottom: 1px solid #d8dee4;
            min-height: 150px;
            max-height: 34vh;
        }

        .task-row {
            display: grid;
            gap: 4px;
            width: 100%;
            text-align: left;
            border: 1px solid #e2e8f0;
            background: #ffffff;
            color: #17202a;
            border-radius: 4px;
            padding: 8px;
            margin-bottom: 6px;
            cursor: pointer;
        }

        .task-row:hover,
        .task-row.active {
            border-color: #1f618d;
            background: #f2f8fc;
        }

        .task-row-title {
            font-weight: 700;
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        .task-row-meta {
            color: #566573;
            font-size: 13px;
        }

        .priority-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 5px;
        }

        .priority-high {
            background: #c0392b;
        }

        .priority-medium {
            background: #d68910;
        }

        .priority-low {
            background: #1e8449;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            width: fit-content;
            border-radius: 999px;
            padding: 2px 7px;
            font-size: 11px;
            font-weight: 700;
            color: #17202a;
            background: #eef2f7;
        }

        .status-present {
            background: #d7f1df;
            color: #145a32;
        }

        .status-absent {
            background: #e5e7eb;
            color: #374151;
        }

        .status-uncertain {
            background: #fff3cd;
            color: #6b4e00;
        }

        .status-not-assessed {
            background: #e8f1fb;
            color: #1f4e79;
        }

        .temporal-note {
            margin-top: 0;
        }

        .temporal-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 8px;
        }

        .detail-panel {
            overflow: auto;
            padding: 14px 16px;
            flex: 1;
        }

        .detail-panel:focus {
            outline: 2px solid #1f618d;
            outline-offset: -2px;
        }

        .detail-panel h2 {
            margin: 0 0 8px 0;
            font-size: 22px;
            color: #17202a;
        }

        .detail-section {
            margin-top: 16px;
        }

        .detail-section h3 {
            margin: 0 0 8px 0;
            font-size: 14px;
            color: #34495e;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .kv {
            display: grid;
            grid-template-columns: 132px 1fr;
            gap: 6px 12px;
            font-size: 14px;
            line-height: 1.4;
        }

        .kv dt {
            color: #5d6d7e;
            font-weight: 700;
        }

        .kv dd {
            margin: 0;
            overflow-wrap: anywhere;
        }

        .link-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        .link-grid a {
            border: 1px solid #d8dee4;
            border-radius: 5px;
            padding: 10px 8px;
            color: #1f618d;
            text-align: center;
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            background: #ffffff;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .link-grid a:hover {
            background: #f2f8fc;
        }

        .check-list {
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .check-list li {
            border: 1px solid #e2e8f0;
            border-radius: 4px;
            padding: 9px 10px;
            margin-bottom: 6px;
            font-size: 13px;
            line-height: 1.45;
            background: #f8fafc;
        }

        .task-brief {
            display: grid;
            gap: 8px;
            border: 1px solid #cfe1ef;
            border-left: 4px solid #1f618d;
            border-radius: 5px;
            background: #f2f8fc;
            padding: 10px 12px;
            font-size: 13px;
            line-height: 1.5;
        }

        .task-brief-header {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
        }

        .task-focus {
            font-weight: 700;
            color: #1f4e79;
        }

        .task-brief p,
        .task-brief ol {
            margin: 0;
        }

        .task-brief ol {
            padding-left: 20px;
            display: grid;
            gap: 4px;
        }

        .task-brief-footer {
            color: #566573;
            font-size: 12px;
            font-weight: 700;
        }

        .temporal-summary {
            display: grid;
            gap: 8px;
            border: 1px solid #d8dee4;
            border-radius: 5px;
            background: #f8fafc;
            padding: 10px 12px;
            font-size: 13px;
            line-height: 1.5;
        }

        .temporal-summary strong {
            color: #17202a;
        }

        .review-form {
            display: grid;
            gap: 8px;
        }

        .field-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .button-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .button-row button {
            min-height: 48px;
            font-size: 15px;
        }

        .wide-output {
            min-height: 72px;
        }

        .pilot-note,
        .disabled-panel,
        .demo-warning {
            border: 1px solid #d8dee4;
            border-radius: 5px;
            background: #f8fafc;
            color: #34495e;
            font-size: 13px;
            line-height: 1.5;
            padding: 10px 12px;
        }

        .demo-warning {
            border-color: #d68910;
            background: #fff7e6;
            color: #5f4200;
            font-weight: 700;
        }

        .pilot-note {
            margin-top: 12px;
        }

        .pilot-note a,
        .disabled-panel a {
            color: #1f618d;
            font-weight: 700;
        }

        .nomination-panel {
            padding: 14px 16px;
            border-bottom: 1px solid #d8dee4;
        }

        .nomination-panel summary {
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            color: #34495e;
        }

        .nomination-form {
            display: grid;
            gap: 8px;
            margin-top: 10px;
        }

        .copy-status {
            min-height: 22px;
            font-size: 14px;
            font-weight: 700;
            color: #1e8449;
            line-height: 1.45;
        }

        .copy-help {
            font-size: 13px;
            color: #34495e;
            line-height: 1.5;
            background: #f2f8fc;
            border: 1px solid #cfe1ef;
            border-radius: 5px;
            padding: 8px 10px;
            margin-top: -4px;
        }

        .copy-help kbd {
            background: #ffffff;
            border: 1px solid #b6c2cf;
            border-radius: 3px;
            padding: 1px 6px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 12px;
        }

        .json-output {
            min-height: 92px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 13px;
            resize: vertical;
            line-height: 1.4;
        }

        .quickstart {
            margin: 14px 16px 0 16px;
            padding: 12px 14px;
            border: 1px solid #cfe1ef;
            border-left: 4px solid #1f618d;
            background: #f2f8fc;
            border-radius: 5px;
            font-size: 13px;
            line-height: 1.5;
            color: #1f2d3d;
        }

        .quickstart strong {
            display: block;
            margin-bottom: 6px;
            color: #1f4e79;
            font-size: 14px;
        }

        .quickstart ol {
            margin: 0;
            padding-left: 20px;
            display: grid;
            gap: 4px;
        }

        .quickstart-dismiss {
            margin-top: 8px;
            background: transparent;
            color: #1f618d;
            border: none;
            padding: 0;
            min-height: 0;
            width: auto;
            font-size: 12px;
            text-decoration: underline;
            cursor: pointer;
        }

        .workflow-steps {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin: 0 0 14px 0;
        }

        .workflow-step {
            border: 1px solid #d8dee4;
            border-radius: 5px;
            padding: 8px 6px;
            text-align: center;
            background: #ffffff;
            font-size: 12px;
            line-height: 1.3;
            color: #5d6d7e;
        }

        .workflow-step strong {
            display: block;
            font-size: 14px;
            color: #1f2d3d;
            margin-bottom: 2px;
        }

        .workflow-step.active {
            border-color: #1f618d;
            background: #e8f1fb;
            color: #1f4e79;
        }

        .workflow-step.active strong {
            color: #1f4e79;
        }

        .workflow-step.done {
            border-color: #1e8449;
            background: #d7f1df;
            color: #145a32;
        }

        .workflow-step.done strong {
            color: #145a32;
        }

        .source-url-row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 6px;
            align-items: end;
        }

        .source-url-row label {
            min-width: 0;
        }

        .ra-initials {
            display: inline-block;
            margin-left: 8px;
            padding: 2px 8px;
            border-radius: 999px;
            background: #e8f1fb;
            color: #1f4e79;
            font-size: 12px;
            font-weight: 700;
            vertical-align: middle;
        }

        .ra-initials button {
            background: none;
            border: none;
            color: #1f4e79;
            font-size: 12px;
            font-weight: 700;
            padding: 0 0 0 6px;
            min-height: 0;
            width: auto;
            text-decoration: underline;
            cursor: pointer;
        }

        .session-panel {
            padding: 12px 16px 16px 16px;
            border-bottom: 1px solid #d8dee4;
            font-size: 13px;
        }

        .backend-panel {
            padding: 14px 16px;
            border-bottom: 1px solid #d8dee4;
            font-size: 14px;
        }

        .backend-card {
            display: grid;
            gap: 10px;
            border: 1px solid #b8d3e8;
            border-radius: 6px;
            background: #eef6fc;
            padding: 14px;
            line-height: 1.45;
            color: #1f2d3d;
        }

        .backend-card strong {
            display: block;
            color: #1f4e79;
            font-size: 18px;
            line-height: 1.25;
        }

        .backend-card.auth-required {
            border-color: #1f618d;
            background: #e8f1fb;
            box-shadow: 0 1px 4px rgba(31, 97, 141, 0.18);
        }

        .backend-card.signed-in {
            border-color: #1e8449;
            background: #eef9f1;
        }

        .google-sign-in-host {
            min-height: 44px;
            display: flex;
            align-items: center;
        }

        .backend-help {
            color: #34495e;
            font-size: 13px;
            line-height: 1.45;
        }

        .backend-card.disabled {
            border-color: #d8dee4;
            background: #f8fafc;
            color: #5d6d7e;
        }

        .backend-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .backend-actions button {
            min-height: 42px;
            font-size: 14px;
        }

        .backend-actions button.tertiary {
            background: #ffffff;
            color: #34495e;
            border-color: #b6c2cf;
        }

        .backend-badge {
            display: inline-block;
            margin-left: 6px;
            padding: 1px 6px;
            border-radius: 3px;
            background: #e8f1fb;
            color: #1f4e79;
            border: 1px solid #8db9dc;
            font-size: 11px;
            font-weight: 700;
        }

        .session-panel summary {
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            color: #1f2d3d;
            padding: 4px 0;
        }

        .session-empty {
            color: #5d6d7e;
            font-style: italic;
            margin-top: 6px;
        }

        .session-entries {
            display: grid;
            gap: 8px;
            margin-top: 10px;
            max-height: 32vh;
            overflow: auto;
        }

        .session-entry {
            border: 1px solid #e2e8f0;
            border-radius: 5px;
            padding: 8px 10px;
            background: #ffffff;
            display: grid;
            gap: 4px;
            line-height: 1.4;
        }

        .session-entry.skipped {
            background: #f8fafc;
            border-style: dashed;
        }

        .session-entry .entry-title {
            font-weight: 700;
            color: #17202a;
        }

        .session-entry .entry-meta {
            color: #5d6d7e;
            font-size: 12px;
        }

        .session-entry .entry-actions {
            display: flex;
            gap: 6px;
            margin-top: 4px;
        }

        .session-entry button {
            width: auto;
            min-height: 32px;
            padding: 4px 10px;
            font-size: 12px;
            font-weight: 700;
        }

        .session-buttons {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .session-buttons button {
            flex: 1;
            min-height: 36px;
            padding: 6px 10px;
            font-size: 13px;
            font-weight: 700;
            background: #ffffff;
            color: #1f618d;
            border: 1px solid #1f618d;
        }

        .session-buttons button.danger {
            color: #b03a2e;
            border-color: #b03a2e;
        }

        .skip-form {
            margin-top: 14px;
            padding: 10px 12px;
            border: 1px dashed #b6c2cf;
            border-radius: 5px;
            background: #f8fafc;
            display: grid;
            gap: 6px;
        }

        .skip-form label {
            font-size: 13px;
        }

        .skip-form button.skip-confirm {
            background: #d68910;
            border-color: #d68910;
        }

        .skip-badge {
            display: inline-block;
            margin-left: 6px;
            padding: 1px 6px;
            border-radius: 3px;
            background: #fff7e6;
            color: #5f4200;
            border: 1px solid #d68910;
            font-size: 11px;
            font-weight: 700;
        }

        .closed-badge {
            display: inline-block;
            margin-left: 6px;
            padding: 1px 6px;
            border-radius: 3px;
            background: #d7f1df;
            color: #145a32;
            border: 1px solid #1e8449;
            font-size: 11px;
            font-weight: 700;
        }

        #map {
            height: 100vh;
            min-height: 680px;
        }

        .verification-marker {
            border: 2px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.45);
        }

        @media (max-width: 900px) {
            .app-shell {
                grid-template-columns: 1fr;
                grid-template-rows: 48vh 52vh;
                min-height: 100vh;
            }

            .sidebar {
                grid-row: 2;
                border-right: 0;
                border-top: 1px solid #d8dee4;
            }

            #map {
                grid-row: 1;
                height: 48vh;
                min-height: 0;
            }

            .field-grid,
            .button-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <main class="app-shell">
        <aside class="sidebar">
            <header class="sidebar-header">
                <h1>NZ OSM Verification</h1>
                <p><span id="snapshotId">Loading snapshot</span></p>
                <div class="nav-links">
                    <a href="./">NZ map</a>
                    <a href="../../global/">Global map</a>
                </div>
                <div id="modeNotice" class="pilot-note"></div>
            </header>

            <section id="backendPanel" class="backend-panel"></section>

            <div id="quickstartBanner"></div>

            <section class="filters">
                <label>
                    Search
                    <input id="searchInput" type="search" placeholder="Name, address, OSM id">
                </label>
                <label>
                    Priority
                    <select id="priorityFilter">
                        <option value="all">All priorities</option>
                        <option value="high">High</option>
                        <option value="medium">Medium</option>
                        <option value="low">Low</option>
                    </select>
                </label>
                <label>
                    Suggested action
                    <select id="actionFilter">
                        <option value="all">All actions</option>
                        <option value="needs_human_review">Needs human review</option>
                        <option value="review_when_sampling">Spot-check in sample</option>
                        <option value="candidate_no_action">Candidate no action</option>
                    </select>
                </label>
                <label>
                    Target year
                    <select id="targetYearSelect">
                        <option value="2023">2023</option>
                        <option value="2018">2018</option>
                        <option value="2013">2013</option>
                    </select>
                </label>
                <label>
                    Target-year status
                    <select id="statusFilter">
                        <option value="all">All statuses</option>
                        <option value="present">Present</option>
                        <option value="absent">Absent</option>
                        <option value="uncertain">Uncertain</option>
                        <option value="not_assessed">Not assessed</option>
                    </select>
                </label>
                <div class="pilot-note temporal-note">
                    Target-year colours are provisional. OSM date tags are evidence to check, not final historical truth.
                    <div class="temporal-legend" aria-label="Target-year colour legend">
                        <span class="status-pill status-present">Present</span>
                        <span class="status-pill status-absent">Absent</span>
                        <span class="status-pill status-uncertain">Uncertain</span>
                        <span class="status-pill status-not-assessed">Not assessed</span>
                    </div>
                </div>
            </section>

            <section class="stats" aria-live="polite">
                <div class="stat"><strong id="shownCount">0</strong><span>shown</span></div>
                <div class="stat"><strong id="highCount">0</strong><span>high</span></div>
                <div class="stat"><strong id="presentCount">0</strong><span>present</span></div>
                <div class="stat"><strong id="lifecycleNeededCount">0</strong><span>needs dates</span></div>
            </section>

            <section id="taskList" class="task-list" aria-label="Verification tasks"></section>
            <section id="sessionPanel" class="session-panel"></section>
            <section id="nominationPanel" class="nomination-panel"></section>
            <section id="detailPanel" class="detail-panel" tabindex="-1"></section>
        </aside>

        <div id="map"></div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>
    <script src="js/convex-config.js?v=20260514-default-assignment"></script>
    <script src="js/convex-task-client.js?v=20260514-default-assignment"></script>
    <script src="js/verification-map.js?v=20260514-default-assignment"></script>
</body>
</html>
