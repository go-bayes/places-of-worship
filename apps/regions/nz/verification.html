<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NZ OSM Verification Tasks</title>
    <link rel="icon" href="data:,">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>

    <!-- shared tokens, type stack, and hidden-attribute guard; this page
         stays a light workspace and keeps its own colours below -->
    <link rel="stylesheet" href="../../shared/map-shell.css">

    <style>
        :root {
            /* colour meanings fixed by docs/ui-style-guide.md (Colour
               Meanings): the table and these variables change together;
               never reuse one for an unrelated meaning */
            --action: #1f618d;            /* primary action, active focus, link emphasis */
            --action-active-bg: #e8f1fb;  /* active workflow-step surface */
            --present: #1e8449;
            --present-ink: #145a32;
            --present-bg: #d7f1df;
            --absent-ink: #374151;
            --absent-bg: #e5e7eb;
            --uncertain: #d68910;
            --uncertain-ink: #6b4e00;
            --uncertain-bg: #fff3cd;
            --warning-ink: #5f4200;       /* demo/warning and skip share the soft amber pair */
            --warning-bg: #fff7e6;
            --not-assessed-ink: #1f4e79;
            --not-assessed-bg: #e8f1fb;
            --priority-high: #c0392b;
            --priority-medium: #d68910;
            --priority-low: #1e8449;
            --danger: #b03a2e;            /* destructive or clearing actions */
        }

        body {
            margin: 0;
            color: #17202a;
            background: #f4f6f7;
            font-size: 15px;
            line-height: 1.45;
        }

        .app-shell {
            display: grid;
            grid-template-columns: minmax(320px, 390px) 1fr;
            height: 100vh;
            min-height: 680px;
        }

        .sidebar {
            background: #ffffff;
            border-right: 1px solid #d8dee4;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid #d8dee4;
        }

        .sidebar-header h1 {
            margin: 0 0 6px 0;
            font-size: 22px;
            line-height: 1.2;
            color: #1f2d3d;
        }

        .sidebar-header p {
            margin: 0;
            color: #5d6d7e;
            font-size: 14px;
            line-height: 1.45;
        }

        .nav-links {
            display: flex;
            gap: 12px;
            margin-top: 12px;
        }

        .nav-links a {
            color: var(--action);
            font-size: 14px;
            text-decoration: none;
            font-weight: 700;
        }

        /* the one dominant action in the sidebar: adding a missing place.
           shown only in assignment mode (the demo/full map keeps its own
           JSON nomination form lower down) */
        .sidebar-actions {
            display: none;
            margin-top: 14px;
        }

        body.assignment-mode .sidebar-actions {
            display: block;
        }

        .primary-action {
            width: 100%;
            border: 1px solid var(--action);
            background: var(--action);
            color: #ffffff;
            font-weight: 700;
            font-size: 15px;
            min-height: 48px;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 1px 2px rgba(15, 23, 42, 0.12);
        }

        .primary-action:hover {
            background: #17527a;
            border-color: #17527a;
        }

        .primary-action:focus-visible {
            outline: 3px solid #9ecbe8;
            outline-offset: 2px;
        }

        .primary-action:disabled {
            opacity: 0.6;
            cursor: default;
            box-shadow: none;
        }

        .filters {
            display: grid;
            gap: 8px;
            padding: 10px 16px;
            border-bottom: 1px solid #e7ebef;
        }

        /* secondary filters fold away so Search and Target year lead */
        .more-filters {
            font-size: 12px;
        }

        .more-filters > summary {
            cursor: pointer;
            color: #5d6d7e;
            font-size: 12px;
            font-weight: 700;
            padding: 2px 0;
            list-style-position: inside;
        }

        .more-filters-body {
            display: grid;
            gap: 8px;
            margin-top: 8px;
        }

        label {
            display: grid;
            gap: 6px;
            color: #34495e;
            font-size: 13px;
            font-weight: 700;
        }

        input,
        select,
        textarea,
        button {
            width: 100%;
            border: 1px solid #ccd3da;
            border-radius: 5px;
            font: inherit;
            font-size: 15px;
            padding: 10px 12px;
            background: #ffffff;
        }

        button {
            border-color: var(--action);
            background: var(--action);
            color: #ffffff;
            cursor: pointer;
            font-weight: 700;
            min-height: 44px;
        }

        button.secondary {
            background: #ffffff;
            color: var(--action);
        }

        button.tertiary {
            background: #ffffff;
            color: var(--action);
            border: 1px solid var(--action);
            font-weight: 700;
            font-size: 13px;
            padding: 6px 10px;
            min-height: 32px;
            width: auto;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            padding: 8px 16px;
            border-bottom: 1px solid #e7ebef;
        }

        .stat {
            padding: 6px;
            border: 1px solid #eef1f4;
            border-radius: 4px;
            background: #fafbfc;
        }

        .stat strong {
            display: block;
            font-size: 15px;
            color: #34495e;
        }

        .stat span {
            display: block;
            margin-top: 1px;
            color: #7b8794;
            font-size: 11px;
        }

        /* the task list is the primary working surface: give it the room
           and the solid divider the quieter panels above no longer carry */
        .task-list {
            overflow: auto;
            padding: 8px;
            border-bottom: 1px solid #d8dee4;
            min-height: 180px;
            max-height: 40vh;
        }

        .task-row {
            display: grid;
            gap: 4px;
            width: 100%;
            text-align: left;
            border: 1px solid #e2e8f0;
            background: #ffffff;
            color: #17202a;
            border-radius: 4px;
            padding: 8px;
            margin-bottom: 6px;
            cursor: pointer;
        }

        .task-row:hover,
        .task-row.active {
            border-color: var(--action);
            background: #f2f8fc;
        }

        .task-row-title {
            font-weight: 700;
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        .task-row-meta {
            color: #566573;
            font-size: 13px;
        }

        .priority-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 5px;
        }

        .priority-high {
            background: var(--priority-high);
        }

        .priority-medium {
            background: var(--priority-medium);
        }

        .priority-low {
            background: var(--priority-low);
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            width: fit-content;
            border-radius: 999px;
            padding: 2px 7px;
            font-size: 11px;
            font-weight: 700;
            color: #17202a;
            background: #eef2f7;
        }

        .status-present {
            background: var(--present-bg);
            color: var(--present-ink);
        }

        .status-absent {
            background: var(--absent-bg);
            color: var(--absent-ink);
        }

        .status-uncertain {
            background: var(--uncertain-bg);
            color: var(--uncertain-ink);
        }

        .status-not-assessed {
            background: var(--not-assessed-bg);
            color: var(--not-assessed-ink);
        }

        .temporal-note {
            margin-top: 0;
        }

        .temporal-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 8px;
        }

        .detail-panel {
            overflow: auto;
            padding: 14px 16px;
            flex: 1;
        }

        .detail-panel:focus {
            outline: 2px solid var(--action);
            outline-offset: -2px;
        }

        .detail-panel h2 {
            margin: 0 0 8px 0;
            font-size: 22px;
            color: #17202a;
        }

        .detail-section {
            margin-top: 16px;
        }

        .detail-section h3 {
            margin: 0 0 8px 0;
            font-size: 14px;
            color: #34495e;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .kv {
            display: grid;
            grid-template-columns: 132px 1fr;
            gap: 6px 12px;
            font-size: 14px;
            line-height: 1.4;
        }

        .kv dt {
            color: #5d6d7e;
            font-weight: 700;
        }

        .kv dd {
            margin: 0;
            overflow-wrap: anywhere;
        }

        .link-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        .link-grid a,
        .link-grid button.coord-copy {
            border: 1px solid #d8dee4;
            border-radius: 5px;
            padding: 10px 8px;
            color: var(--action);
            text-align: center;
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            background: #ffffff;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .link-grid a:hover,
        .link-grid button.coord-copy:hover {
            background: #f2f8fc;
        }

        .link-grid a.source-link-primary {
            border-color: var(--action);
            background: #eaf4fb;
            color: #174d72;
        }

        .popup-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-top: 8px;
        }

        .popup-actions .popup-open-task,
        .popup-actions .popup-link {
            min-height: 36px;
        }

        .popup-actions .popup-link {
            border: 1px solid var(--action);
            border-radius: 5px;
            padding: 8px 10px;
            color: var(--action);
            text-align: center;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            font-family: inherit;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .popup-actions button.popup-link {
            cursor: pointer;
        }

        /* low-prominence issue entry: quiet text button under the pair */
        .popup-actions .popup-report-issue {
            grid-column: 1 / -1;
            min-height: 28px;
            background: transparent;
            border: none;
            color: #64748b;
            font-size: 12px;
            font-weight: 400;
            text-decoration: underline;
            cursor: pointer;
        }

        .skip-reason-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .skip-reason-chips .skip-chip {
            min-height: 28px;
            font-size: 12px;
            font-weight: 400;
            padding: 4px 8px;
        }

        .issue-form textarea {
            width: 100%;
            box-sizing: border-box;
            font: inherit;
        }

        .check-list {
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .check-list li {
            border: 1px solid #e2e8f0;
            border-radius: 4px;
            padding: 9px 10px;
            margin-bottom: 6px;
            font-size: 13px;
            line-height: 1.45;
            background: #f8fafc;
        }

        .task-brief {
            display: grid;
            gap: 8px;
            border: 1px solid #cfe1ef;
            border-left: 4px solid var(--action);
            border-radius: 5px;
            background: #f2f8fc;
            padding: 10px 12px;
            font-size: 13px;
            line-height: 1.5;
        }

        .task-brief-header {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
        }

        .task-focus {
            font-weight: 700;
            color: #1f4e79;
        }

        .task-brief p,
        .task-brief ol {
            margin: 0;
        }

        .task-brief ol {
            padding-left: 20px;
            display: grid;
            gap: 4px;
        }

        .task-brief-footer {
            color: #566573;
            font-size: 12px;
            font-weight: 700;
        }

        .temporal-summary {
            display: grid;
            gap: 8px;
            border: 1px solid #d8dee4;
            border-radius: 5px;
            background: #f8fafc;
            padding: 10px 12px;
            font-size: 13px;
            line-height: 1.5;
        }

        .temporal-summary strong {
            color: #17202a;
        }

        .review-form {
            display: grid;
            gap: 8px;
        }

        .field-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .button-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .button-row button {
            min-height: 48px;
            font-size: 15px;
        }

        .wide-output {
            min-height: 72px;
        }

        .pilot-note,
        .disabled-panel,
        .demo-warning {
            border: 1px solid #d8dee4;
            border-radius: 5px;
            background: #f8fafc;
            color: #34495e;
            font-size: 13px;
            line-height: 1.5;
            padding: 10px 12px;
        }

        .demo-warning {
            border-color: var(--uncertain);
            background: var(--warning-bg);
            color: var(--warning-ink);
            font-weight: 700;
        }

        .pilot-note {
            margin-top: 12px;
        }

        .pilot-note a,
        .disabled-panel a {
            color: var(--action);
            font-weight: 700;
        }

        .nomination-panel {
            padding: 14px 16px;
            border-bottom: 1px solid #d8dee4;
        }

        /* transient pin-drop cards render here, at the top of the working
           column next to the map, while pin mode is active */
        .pin-card-host {
            padding: 12px 16px;
            border-bottom: 1px solid #d8dee4;
            background: #f2f8fc;
            display: grid;
            gap: 8px;
        }

        .pin-card-host[hidden] {
            display: none;
        }

        .pin-host-title {
            margin: 0;
            font-size: 14px;
            font-weight: 700;
            color: #1f4e79;
        }

        .nomination-panel summary {
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            color: #34495e;
        }

        .nomination-form {
            display: grid;
            gap: 8px;
            margin-top: 10px;
        }

        /* pin-drop nomination: placement cursor, live marker, confirm card */
        .leaflet-container.pin-placement {
            cursor: crosshair;
        }

        .pin-drop-marker {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #c0392b;
            border: 2px solid #ffffff;
            box-shadow: 0 1px 4px rgba(15, 23, 42, 0.45);
        }

        .pin-card {
            border: 1px dashed #b6c2cf;
            border-radius: 5px;
            background: #f8fafc;
            padding: 10px 12px;
            display: grid;
            gap: 8px;
        }

        .pin-coords {
            font-size: 13px;
            font-weight: 700;
            color: #34495e;
        }

        .pin-zoom-gate {
            font-size: 12px;
            color: #a15c07;
        }

        .pin-nearby-row {
            display: grid;
            gap: 4px;
            font-size: 13px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 6px;
        }

        .pin-card textarea {
            width: 100%;
            box-sizing: border-box;
            font: inherit;
        }

        .copy-status {
            min-height: 22px;
            font-size: 14px;
            font-weight: 700;
            color: #1e8449;
            line-height: 1.45;
        }

        .copy-help {
            font-size: 13px;
            color: #34495e;
            line-height: 1.5;
            background: #f2f8fc;
            border: 1px solid #cfe1ef;
            border-radius: 5px;
            padding: 8px 10px;
            margin-top: -4px;
        }

        .copy-help kbd {
            background: #ffffff;
            border: 1px solid #b6c2cf;
            border-radius: 3px;
            padding: 1px 6px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 12px;
        }

        .json-output {
            min-height: 92px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 13px;
            resize: vertical;
            line-height: 1.4;
        }

        .quickstart {
            margin: 10px 16px 0 16px;
            padding: 8px 12px;
            border: 1px solid #e2e8f0;
            background: #fafbfc;
            border-radius: 5px;
            font-size: 12px;
            line-height: 1.5;
            color: #5d6d7e;
        }

        .quickstart strong {
            display: inline;
            margin-bottom: 4px;
            color: #5d6d7e;
            font-size: 12px;
        }

        .quickstart > summary {
            cursor: pointer;
            color: #5d6d7e;
            font-size: 12px;
            font-weight: 700;
            list-style-position: inside;
            padding: 2px 0;
        }

        .quickstart a {
            color: var(--action);
            font-weight: 700;
        }

        .quickstart[open] > summary {
            margin-bottom: 6px;
        }

        .quickstart ol {
            margin: 0;
            padding-left: 20px;
            display: grid;
            gap: 4px;
        }

        .quickstart-dismiss {
            margin-top: 8px;
            background: transparent;
            color: var(--action);
            border: none;
            padding: 0;
            min-height: 0;
            width: auto;
            font-size: 12px;
            text-decoration: underline;
            cursor: pointer;
        }

        .workflow-steps {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin: 0 0 14px 0;
        }

        .workflow-step {
            border: 1px solid #d8dee4;
            border-radius: 5px;
            padding: 8px 6px;
            text-align: center;
            background: #ffffff;
            font-size: 12px;
            line-height: 1.3;
            color: #5d6d7e;
        }

        .workflow-step strong {
            display: block;
            font-size: 14px;
            color: #1f2d3d;
            margin-bottom: 2px;
        }

        .workflow-step.active {
            border-color: var(--action);
            background: var(--action-active-bg);
            color: var(--not-assessed-ink);
        }

        .workflow-step.active strong {
            color: var(--not-assessed-ink);
        }

        .workflow-step.done {
            border-color: var(--present);
            background: var(--present-bg);
            color: var(--present-ink);
        }

        .workflow-step.done strong {
            color: var(--present-ink);
        }

        .source-url-row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 6px;
            align-items: end;
        }

        .source-url-row label {
            min-width: 0;
        }

        .source-url-actions {
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: flex-start;
        }

        .ra-initials {
            display: inline-block;
            margin-left: 8px;
            padding: 2px 8px;
            border-radius: 999px;
            background: #e8f1fb;
            color: #1f4e79;
            font-size: 12px;
            font-weight: 700;
            vertical-align: middle;
        }

        .ra-initials button {
            background: none;
            border: none;
            color: #1f4e79;
            font-size: 12px;
            font-weight: 700;
            padding: 0 0 0 6px;
            min-height: 0;
            width: auto;
            text-decoration: underline;
            cursor: pointer;
        }

        .session-panel {
            padding: 12px 16px 16px 16px;
            border-bottom: 1px solid #d8dee4;
            font-size: 13px;
        }

        .backend-panel {
            padding: 14px 16px;
            border-bottom: 1px solid #d8dee4;
            font-size: 14px;
        }

        .backend-card {
            display: grid;
            gap: 10px;
            border: 1px solid #b8d3e8;
            border-radius: 6px;
            background: #eef6fc;
            padding: 14px;
            line-height: 1.45;
            color: #1f2d3d;
        }

        .backend-card strong {
            display: block;
            color: #1f4e79;
            font-size: 18px;
            line-height: 1.25;
        }

        .backend-card.auth-required {
            border-color: var(--action);
            background: #e8f1fb;
            box-shadow: 0 1px 4px rgba(31, 97, 141, 0.18);
        }

        .backend-card.signed-in {
            border-color: var(--present);
            background: #eef9f1;
        }

        .google-sign-in-host {
            min-height: 44px;
            display: flex;
            align-items: center;
        }

        .backend-help {
            color: #34495e;
            font-size: 13px;
            line-height: 1.45;
        }

        .backend-card.disabled {
            border-color: #d8dee4;
            background: #f8fafc;
            color: #5d6d7e;
        }

        .backend-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .backend-actions button {
            min-height: 42px;
            font-size: 14px;
        }

        .backend-actions button.tertiary {
            background: #ffffff;
            color: #34495e;
            border-color: #b6c2cf;
        }

        .backend-badge {
            display: inline-block;
            margin-left: 6px;
            padding: 1px 6px;
            border-radius: 3px;
            background: #e8f1fb;
            color: #1f4e79;
            border: 1px solid #8db9dc;
            font-size: 11px;
            font-weight: 700;
        }

        .session-panel summary {
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            color: #1f2d3d;
            padding: 4px 0;
        }

        .session-empty {
            color: #5d6d7e;
            font-style: italic;
            margin-top: 6px;
        }

        .session-entries {
            display: grid;
            gap: 8px;
            margin-top: 10px;
            max-height: 32vh;
            overflow: auto;
        }

        .session-entry {
            border: 1px solid #e2e8f0;
            border-radius: 5px;
            padding: 8px 10px;
            background: #ffffff;
            display: grid;
            gap: 4px;
            line-height: 1.4;
        }

        .session-entry.skipped {
            background: #f8fafc;
            border-style: dashed;
        }

        .session-entry .entry-title {
            font-weight: 700;
            color: #17202a;
        }

        .session-entry .entry-meta {
            color: #5d6d7e;
            font-size: 12px;
        }

        .session-entry .entry-actions {
            display: flex;
            gap: 6px;
            margin-top: 4px;
        }

        .session-entry button {
            width: auto;
            min-height: 32px;
            padding: 4px 10px;
            font-size: 12px;
            font-weight: 700;
        }

        .changes-panel {
            margin-bottom: 12px;
            padding: 10px 12px;
            border: 1px solid var(--uncertain);
            border-left-width: 4px;
            border-radius: 5px;
            background: var(--warning-bg);
            color: var(--warning-ink);
        }

        .changes-panel-head {
            font-weight: 700;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .changes-entries {
            display: grid;
            gap: 8px;
        }

        .changes-entry {
            border: 1px solid var(--uncertain);
            border-radius: 5px;
            padding: 8px 10px;
            background: #ffffff;
            display: grid;
            gap: 4px;
            line-height: 1.4;
        }

        .changes-entry .entry-title {
            font-weight: 700;
            color: #17202a;
        }

        .changes-entry .entry-meta {
            color: #5d6d7e;
            font-size: 12px;
        }

        .changes-note {
            font-size: 13px;
            color: #17202a;
            white-space: pre-wrap;
        }

        .changes-label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            color: var(--uncertain-ink);
        }

        .changes-error {
            color: var(--danger);
            font-size: 12px;
        }

        .changes-error:empty {
            display: none;
        }

        .changes-entry .entry-actions {
            display: flex;
            gap: 6px;
            margin-top: 4px;
        }

        .changes-entry button.revise-now {
            width: auto;
            min-height: 44px;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 700;
            background: var(--uncertain);
            border-color: var(--uncertain);
            color: #ffffff;
        }

        .changes-badge {
            display: inline-block;
            margin-left: 8px;
            padding: 2px 8px;
            border-radius: 999px;
            background: var(--warning-bg);
            color: var(--warning-ink);
            border: 1px solid var(--uncertain);
            font-size: 12px;
            font-weight: 700;
            vertical-align: middle;
        }

        .session-buttons {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .session-buttons button {
            flex: 1;
            min-height: 36px;
            padding: 6px 10px;
            font-size: 13px;
            font-weight: 700;
            background: #ffffff;
            color: var(--action);
            border: 1px solid var(--action);
        }

        .session-buttons button.danger {
            color: var(--danger);
            border-color: var(--danger);
        }

        .skip-form {
            margin-top: 14px;
            padding: 10px 12px;
            border: 1px dashed #b6c2cf;
            border-radius: 5px;
            background: #f8fafc;
            display: grid;
            gap: 6px;
        }

        .skip-form label {
            font-size: 13px;
        }

        .skip-form button.skip-confirm {
            background: var(--uncertain);
            border-color: var(--uncertain);
        }

        .skip-badge {
            display: inline-block;
            margin-left: 6px;
            padding: 1px 6px;
            border-radius: 3px;
            background: var(--warning-bg);
            color: var(--warning-ink);
            border: 1px solid var(--uncertain);
            font-size: 11px;
            font-weight: 700;
        }

        .closed-badge {
            display: inline-block;
            margin-left: 6px;
            padding: 1px 6px;
            border-radius: 3px;
            background: var(--present-bg);
            color: var(--present-ink);
            border: 1px solid var(--present);
            font-size: 11px;
            font-weight: 700;
        }

        #map {
            height: 100vh;
            min-height: 680px;
        }

        .verification-marker {
            border: 2px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.45);
        }

        /* Six-state validation RING treatments (docs/portal-ra-issues-and-pin-drops.md).
           Each state wears a ring, never a fill hue, so status never competes
           with the religion/context fill. The plain .verification-marker above
           IS the unvalidated (neutral) ring. Ring hues are chosen distinct in
           both hue AND lightness so they survive colour-blind viewing on the
           light basemap. */
        .verification-marker.vm-validated-present {
            box-shadow: 0 0 0 2px #ffffff, 0 0 0 5px #2874a6, 0 0 5px rgba(0, 0, 0, 0.45);
        }

        /* validated_absent: distinct closed ring — a single heavy near-black
           ring, far darker than the blue present ring, so the two read apart
           without relying on hue */
        .verification-marker.vm-validated-absent {
            box-shadow: 0 0 0 2px #ffffff, 0 0 0 5px #1f2937, 0 0 5px rgba(0, 0, 0, 0.45);
        }

        .verification-marker.vm-in-review {
            background: #ffffff;
            border-width: 3px;
            border-style: dashed;
            border-color: #2874a6;
        }

        /* disputed: intermediate single amber ring — trust dropped back, one
           ring not two, in a caution hue distinct from validated blue */
        .verification-marker.vm-disputed {
            box-shadow: 0 0 0 2px #ffffff, 0 0 0 4px #d68910, 0 0 5px rgba(0, 0, 0, 0.45);
        }

        /* stale_validation: reserved treatment (violet intermediate ring).
           Unreachable until per-wave re-confirmation data exists; see
           validationState() in verification-map.js. */
        .verification-marker.vm-stale {
            box-shadow: 0 0 0 2px #ffffff, 0 0 0 4px #7d3c98, 0 0 5px rgba(0, 0, 0, 0.45);
        }

        .points-legend-control {
            background: rgba(255, 255, 255, 0.94);
            border: 1px solid #b6c2cf;
            border-radius: 5px;
            padding: 8px 10px;
            display: grid;
            gap: 6px;
            font-size: 12px;
            color: #34495e;
            box-shadow: 0 1px 4px rgba(15, 23, 42, 0.25);
        }

        .points-legend-control select {
            font-size: 12px;
            padding: 3px 6px;
            border: 1px solid #b6c2cf;
            border-radius: 4px;
            background: #ffffff;
            color: #34495e;
        }

        /* per-mode helper line under the points select: quiet, matches the
           control's own small-text register (12px slate) at a step down */
        .points-mode-note {
            font-size: 11px;
            line-height: 1.35;
            color: #5d6d7e;
            max-width: 210px;
        }

        .points-mode-note[hidden] {
            display: none;
        }

        .map-legend {
            display: grid;
            gap: 3px;
        }

        .legend-row {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .legend-dot {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            flex: none;
            display: inline-block;
        }

        /* small heading above the validation-ring legend rows */
        .legend-caption {
            font-weight: 700;
            color: #34495e;
            margin-bottom: 1px;
        }

        /* legend swatches mirror the map ring treatments; the fill is a neutral
           slate stand-in for "any religion/status fill", so each row reads as
           the RING, not the fill */
        .legend-dot.vm-validated-present-swatch {
            background: #64748b;
            box-shadow: 0 0 0 1.5px #ffffff, 0 0 0 3.5px #2874a6;
        }

        .legend-dot.vm-validated-absent-swatch {
            background: #64748b;
            box-shadow: 0 0 0 1.5px #ffffff, 0 0 0 3.5px #1f2937;
        }

        .legend-dot.vm-in-review-swatch {
            background: #ffffff;
            border: 2.5px dashed #2874a6;
        }

        .legend-dot.vm-disputed-swatch {
            background: #64748b;
            box-shadow: 0 0 0 1.5px #ffffff, 0 0 0 3px #d68910;
        }

        .legend-dot.vm-stale-swatch {
            background: #64748b;
            box-shadow: 0 0 0 1.5px #ffffff, 0 0 0 3px #7d3c98;
        }

        .legend-dot.vm-default-swatch {
            background: #64748b;
            border: 1.5px solid #ffffff;
            box-shadow: 0 0 3px rgba(0, 0, 0, 0.4);
        }

        .legend-dot.context-dot-swatch {
            background: rgba(100, 116, 139, 0.75);
            border: 1px solid #475569;
            width: 8px;
            height: 8px;
        }

        .task-row-title .legend-dot {
            margin-right: 4px;
        }

        .history-body {
            font-size: 13px;
        }

        .history-summary {
            font-weight: 700;
            color: #34495e;
        }

        .history-timeline {
            list-style: none;
            margin: 0;
            padding: 0;
            display: grid;
            gap: 6px;
        }

        .history-timeline li {
            border-left: 2px solid #b6c2cf;
            padding-left: 8px;
        }

        .history-reason {
            color: #5d6d7e;
            font-size: 12px;
        }

        .rapid-current-form {
            display: grid;
            gap: 12px;
        }

        .rapid-summary {
            display: grid;
            grid-template-columns: minmax(84px, auto) minmax(0, 1fr);
            gap: 4px 10px;
            margin: 8px 0 12px;
            font-size: 0.92rem;
        }

        .rapid-summary dt {
            font-weight: 700;
            color: #243447;
        }

        .rapid-summary dd {
            margin: 0;
            overflow-wrap: anywhere;
        }

        .rapid-choice-group {
            display: grid;
            gap: 8px;
            margin: 0;
            padding: 0;
            border: 0;
        }

        .rapid-choice-group legend {
            margin-bottom: 4px;
            font-weight: 700;
            color: #243447;
        }

        .rapid-choice {
            display: grid;
            grid-template-columns: 24px minmax(0, 1fr);
            align-items: start;
            gap: 9px;
            min-height: 54px;
            padding: 10px;
            border: 1px solid #b6c2cf;
            border-radius: 6px;
            background: #ffffff;
            cursor: pointer;
        }

        .rapid-choice:has(input:checked) {
            border-color: #166534;
            box-shadow: 0 0 0 2px rgba(22, 101, 52, 0.16);
            background: #f0fdf4;
        }

        .rapid-choice input {
            width: 20px;
            height: 20px;
            margin: 1px 0 0;
        }

        .rapid-choice span {
            display: grid;
            gap: 3px;
            line-height: 1.3;
        }

        .rapid-choice small {
            color: #526477;
            font-size: 12px;
        }

        .rapid-conditional,
        .rapid-optional-fields {
            display: grid;
            gap: 10px;
        }

        .rapid-conditional[hidden] {
            display: none;
        }

        .rapid-detailed-link {
            margin-top: 10px;
            font-size: 13px;
        }

        .rapid-current-form button[type="submit"] {
            min-height: 46px;
            font-weight: 700;
        }

        /* Two-pane desktop lock (>900px, above the mobile stack breakpoint).
           The app shell is already height:100vh, but its single grid row was
           auto-sized, so a long sidebar grew the row past the viewport and the
           whole page scrolled — dragging the height-capped map off-screen and
           leaving the right half blank. Pinning the row to the shell height and
           letting the sidebar own its own scroll gives a true two-pane layout:
           the map fills its column and never scrolls away, the sidebar scrolls
           independently. Scoped to desktop so the mobile stacked/page-scroll
           layout in the max-width:900px block is untouched. */
        @media (min-width: 901px) {
            .app-shell {
                /* cap the single row to the shell height; minmax(0,...) lets
                   the children shrink below content so they can scroll */
                grid-template-rows: minmax(0, 1fr);
            }

            .sidebar {
                /* the sidebar becomes the independent scroll container; block
                   flow keeps every section at natural height so content
                   overflows into the scroll rather than being squeezed */
                display: block;
                min-height: 0;
                overflow-y: auto;
            }

            .detail-panel {
                /* no longer the internal flex scroller; it flows into the
                   sidebar scroll like the other sections */
                flex: none;
                overflow: visible;
            }

            #map {
                /* fill the grid cell (== viewport height here) instead of a raw
                   100vh, so the map is bound to its column and cannot scroll
                   away; min-height:0 drops the 680px floor that could exceed
                   the cell on short viewports */
                height: 100%;
                min-height: 0;
            }
        }

        @media (max-width: 900px) {
            .app-shell {
                grid-template-columns: 1fr;
                grid-template-rows: 48vh 52vh;
                min-height: 100vh;
            }

            .sidebar {
                grid-row: 2;
                border-right: 0;
                border-top: 1px solid #d8dee4;
            }

            #map {
                grid-row: 1;
                height: 48vh;
                min-height: 0;
            }

            .field-grid,
            .button-row {
                grid-template-columns: 1fr;
            }

            body.assignment-mode .app-shell {
                /* cap the sidebar row so the map stays on screen: the sidebar
                   scrolls within the upper half instead of pushing the map
                   ~1,700px below the fold on a phone */
                grid-template-rows: minmax(0, 50vh) 50vh;
                min-height: 100vh;
                max-height: 100vh;
            }

            body.assignment-mode .sidebar {
                grid-row: 1;
                min-height: 0;
                overflow-y: auto;
            }

            body.assignment-mode #map {
                grid-row: 2;
                height: 50vh;
            }

            /* the validation-ring legend covers a third of a phone-height map;
               keep the Points control and drop the static key on small screens */
            .map-legend {
                display: none;
            }
        }
    </style>
</head>
<body>
    <script>
        // set body.assignment-mode before first paint so the mobile sidebar-on-top
        // layout applies without a one-frame flash. mirrors the JS rule below: any
        // URL other than ?full=1 or ?batch=all is assumed to be an assignment in
        // the production NZ deployment (Convex backend is configured). the JS
        // toggle in setupPageMode authoritatively corrects this after init.
        (function () {
            try {
                var params = new URLSearchParams(window.location.search);
                var fullMap = params.get("full") === "1" || params.get("batch") === "all";
                if (!fullMap) {
                    document.body.classList.add("assignment-mode");
                }
            } catch (error) {
                // URLSearchParams missing on very old browsers; skip and let JS handle it
            }
        })();
    </script>
    <main class="app-shell">
        <aside class="sidebar">
            <header class="sidebar-header">
                <h1>NZ OSM Verification</h1>
                <p><span id="snapshotId">Connecting...</span></p>
                <div class="nav-links">
                    <a href="./">NZ map</a>
                    <a href="../../global/">Global map</a>
                    <a href="https://religionmap.org/apps/guides/ra.html" target="_blank" rel="noopener">Guide</a>
                </div>
                <div class="sidebar-actions"><button type="button" id="addPlaceButton" class="primary-action">＋ Add a place that's missing</button></div>
                <div id="modeNotice" class="pilot-note"></div>
            </header>

            <section id="backendPanel" class="backend-panel"></section>

            <div id="quickstartBanner"></div>

            <section class="filters">
                <label>
                    Search
                    <input id="searchInput" type="search" placeholder="Name, address, OSM id">
                </label>
                <label>
                    Target year
                    <select id="targetYearSelect">
                        <option value="2023">2023</option>
                        <option value="2018">2018</option>
                        <option value="2013">2013</option>
                    </select>
                </label>
                <details class="more-filters">
                    <summary>More filters</summary>
                    <div class="more-filters-body">
                        <label>
                            Priority
                            <select id="priorityFilter">
                                <option value="all">All priorities</option>
                                <option value="high">High</option>
                                <option value="medium">Medium</option>
                                <option value="low">Low</option>
                            </select>
                        </label>
                        <label>
                            Suggested action
                            <select id="actionFilter">
                                <option value="all">All actions</option>
                                <option value="needs_human_review">Needs human review</option>
                                <option value="review_when_sampling">Spot-check in sample</option>
                                <option value="candidate_no_action">Candidate no action</option>
                            </select>
                        </label>
                        <label>
                            Target-year status
                            <select id="statusFilter">
                                <option value="all">All statuses</option>
                                <option value="present">Present</option>
                                <option value="absent">Absent</option>
                                <option value="uncertain">Uncertain</option>
                                <option value="not_assessed">Not assessed</option>
                            </select>
                        </label>
                    </div>
                </details>
                <div class="pilot-note temporal-note">
                    Target-year colours are provisional. OSM date tags are evidence to check, not final historical truth.
                    <div class="temporal-legend" aria-label="Target-year colour legend">
                        <span class="status-pill status-present">Present</span>
                        <span class="status-pill status-absent">Absent</span>
                        <span class="status-pill status-uncertain">Uncertain</span>
                        <span class="status-pill status-not-assessed">Not assessed</span>
                    </div>
                </div>
            </section>

            <section class="stats" aria-live="polite">
                <div class="stat"><strong id="shownCount">0</strong><span>shown</span></div>
                <div class="stat"><strong id="highCount">0</strong><span>high</span></div>
                <div class="stat"><strong id="presentCount">0</strong><span>present</span></div>
                <div class="stat"><strong id="lifecycleNeededCount">0</strong><span>needs dates</span></div>
            </section>

            <section id="taskList" class="task-list" aria-label="Verification tasks"></section>
            <section id="sessionPanel" class="session-panel"></section>
            <section id="nominationPanel" class="nomination-panel"></section>
            <section id="pinCardHost" class="pin-card-host" hidden></section>
            <section id="detailPanel" class="detail-panel" tabindex="-1"></section>
        </aside>

        <div id="map"></div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>
    <script src="js/convex-config.js?v=20260707-changes-requested"></script>
    <script src="js/convex-task-client.js?v=20260826a"></script>
    <script src="js/rapid-entry-contract.js?v=20260826a"></script>
  <script src="js/verification-map.js?v=20260827b"></script>
</body>
</html>
