        waves: "Two censuses: 2007 and 2017",

      reading: [
        "Departments are shaded by the share reporting a religious affiliation (Católica, Evangélica, or Otra), or by the share in the INEI Ninguna category, shown as No religion %. The four INEI categories partition the population aged 12 and over; the two shares are exact complements and sum to 100 by construction. Both waves use each department's printed census population aged 12 and over as the denominator.",
        "The 2017 wave carries exact published counts from Resultados Definitivos, CUADRO Nº 1: every department's four categories sum to its printed department Total, and every category sums across the 25 departments to its printed national margin (Católica 17,635,339; Evangélica 3,264,819; Otra 1,115,872; Ninguna 1,180,361), for a grand total of 23,196,391. The 2017 table splits Lima into Provincia de Lima and Región Lima; this product aggregates the two rows to Departamento Lima to share the 2007 25-unit frame, and the split sums exactly at every category.",

        "A change metric reports the percentage-point change in the affiliation share between the 2007 and 2017 censuses on the stable 25-department frame. The interval is ten years and a wave-to-wave difference is not an annual rate. Affiliation and no religion are exact complements; the same magnitude with the opposite sign therefore describes the no-religion change, and national population growth from 20,850,502 to 23,196,391 is never treated as a religion change.",
        "No religion (Ninguna) varies sharply across departments. San Martín is the national maximum (2007 8.5%, 2017 11.3%), against Piura and Apurímac near 1-2%, and the national no-religion share grows from 2.9% in 2007 to 5.1% in 2017. Evangélica concentrates in the Amazon and central highlands (2017 Ucayali 27.6%, Huánuco 26.4%, Huancavelica 25.2%), against the strongly Catholic coastal and southern departments (Piura, Ica, Arequipa above 84%). This department-level contrast is the reason to map Peru; the Católica/Evangélica/Otra composition rides verbatim on each row of the area summary and is source context, not a shipped map metric.",

        "1993 is held for the department product. INEI's harmonised comparison re-tabulates 1993 for the population aged 12 and over with the same four categories, but only at the national level (Perfil 2007, CUADRO Nº 2.44); no department-level 1993 table at that universe was reachable, and the contemporaneous all-ages three-category 1993 table is a different universe and frame that is neither backcast nor merged. Finer geography (province, district) exists via INEI REDATAM and the census microdata but was out of route for this build. No governed Peru place-of-worship snapshot ships with this product; place counts and density metrics are null."

        sourceOfRecord: "Instituto Nacional de Estadística e Informática (INEI), <a href=\"https://www.inei.gob.pe/media/MenuRecursivo/publicaciones_digitales/Est/Lib1136/libro.pdf\" target=\"_blank\" rel=\"noopener\">Perfil Sociodemográfico del Perú, CUADRO Nº 2.46</a> (2007) and <a href=\"https://www.inei.gob.pe/media/MenuRecursivo/publicaciones_digitales/Est/Lib1544/00TOMO_03.pdf\" target=\"_blank\" rel=\"noopener\">Resultados Definitivos, CUADRO Nº 1</a> (2017), religion by department, population aged 12 and over; boundaries from <a href=\"https://www.geoboundaries.org/api/current/gbOpen/PER/ADM1/\" target=\"_blank\" rel=\"noopener\">geoBoundaries PER ADM1</a>, dissolved to the 25 departments.",
