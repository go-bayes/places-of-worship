        waves: "Censuses 2005, 2015, 2020",

      reading: [
        "States are shaded by the share reporting a religious affiliation, or by the 2005 None or refused share, shown as No religion %. The affiliation choropleth carries signal only in 2005: the 2015 and 2020 report folds persons with no religion into the Other category, which makes religious affiliation 100 percent for every state by construction; those two waves are therefore flat population surfaces rather than a distinguishing measure. The map opens on 2005 for that reason.",
        "The universe differs by wave and must never be read as change across it. The 2005 Census Monograph Table 10.1 counts all persons of all ages against each state's printed Total (the 16 states close to the national Total of 19,907). The 2015 and 2020 Census Basic Tables Table 42 restrict to adults 18 and over: the 2015 Palau Total column is 8,376 and equals the 16-state sum, and the 2020 table prints no subtotal; the 16 state columns sum to 9,303, and the overall Total of 13,576 (which includes overseas legal-residence columns for persons whose legal residence is abroad) is never the state denominator.",
        "The no-religion slot is real for 2005 and null for 2015 and 2020. The 2005 table prints a distinct None or refused column (222 persons nationally, near 1.1 percent), which mixes persons with no religion and refusals to answer. The 2015 and 2020 report classifies persons with no religion into Other; no separable no-religion count exists in those waves, and the metric is null for them.",
        "No change metric is offered. The 2005 nine-way frame separates Jehovah's Witnesses, Other Protestants, and a distinct None or refused and has no Muslim, Assembly of God, or Baptist column; the 2015 and 2020 nine-way frame splits those three and folds no-religion into Other. The 2005-to-later difference therefore crosses both a universe break (all ages against 18 and over) and a category-frame break, and any positive reading there is an artefact of the frame change rather than real change; the 2015-to-2020 difference is trivially zero because affiliation is flat at 100 by construction. Each source frame is preserved verbatim per wave and not merged. Modekngei, the indigenous Palauan religion, is a first-class named category in every wave.",
        "The boundary frame is geoBoundaries PLW ADM1, 16 states, represented year 2017. All 16 census states join one-to-one; two spelling concordances preserve both labels (geoBoundaries Ngeremlengui maps to census Ngaremlengui, and the 2005 monograph spelling Ngerchelong maps to canonical Ngarchelong). The extent spans latitude 2.75 to 8.09 North and includes the far-southwest outlying states Sonsorol and Hatohobei alongside the main Babeldaob-Koror cluster; the map therefore frames the whole country rather than the main cluster.",
        "No governed Palau place-of-worship snapshot ships with this product; place counts and density metrics are null, and OSM coverage has not been verified in this build. One documented source discrepancy: the 2005 monograph prose says about one in six people reported no religion or refused, which its own table refutes (None or refused is 222 of 19,907, near 1.1 percent); the table governs and the prose sentence is recorded, not used."
      ],

        tables: "The 2005 Monograph Table 10.1 (text-extractable) and the 2015 and 2020 Basic Tables Table 42 (image tables transcribed at 150 dpi) are the source of record for the shipped counts; every transcribed cell reconciles at both margins with zero difference. The area-summary religious_affiliation_percent field carries the share reporting an affiliation against each state's printed total (the population less None or refused in 2005; 100 percent by construction in 2015 and 2020, where no-religion is folded into Other); the no_religion_percent field carries the 2005 None or refused share and is null for 2015 and 2020.",
