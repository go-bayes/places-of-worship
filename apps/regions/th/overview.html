        "The affiliation share is above 99% in nearly every province; it therefore carries little visible spatial contrast, and no religion is near zero everywhere. The Muslim–Buddhist composition that motivates the map sits inside the affiliation slot and in the verbatim category counts, not in either shaded metric. In the deep-South provinces of Pattani, Yala, Narathiwat, and Satun, Islam is the majority declared religion — Pattani reports 513,841 Muslim residents of 609,015 (84.4%) — while Buddhism is the majority across the rest of the kingdom. Christianity concentrates in the northern highland provinces (Chiang Mai, Chiang Rai, Tak). These provinces are politically sensitive; the build and the page render the NSO record verbatim and neutrally.",
