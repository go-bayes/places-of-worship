<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Places of Worship | Trinidad and Tobago Research Map</title>
  <link href="https://unpkg.com/maplibre-gl@3.6.1/dist/maplibre-gl.css" rel="stylesheet">
  <link href="../../shared/map-shell.css" rel="stylesheet">
  <link href="../../global/styles/maplibre-flat.css?v=20260713g" rel="stylesheet">
  <link href="../_shared/region-map.css?v=20260714b" rel="stylesheet">
</head>
<body>
  <div id="region-root"></div>
  <script src="../../global/config.public.js"></script>
  <script src="../../global/config.js"></script>
  <script src="https://unpkg.com/maplibre-gl@3.6.1/dist/maplibre-gl.js"></script>
  <script>
    // country-specific config only; shared behaviour lives in the runtime.
    // Trinidad and Tobago's product is CSO census religious affiliation by the
    // fifteen municipalities (nine regional corporations, three boroughs, two
    // cities, and Tobago) for a single wave, 2011. The source, 2011 Population
    // and Housing Census Demographic Report Table 8 "Non-Institutional
    // Population by Sex, Age Group, Religion and Municipality" (Both Sexes, All
    // Ages column), is count-valued with seventeen verbatim categories,
    // including Baptist-Spiritual Shouter and Orisha, which are never merged.
    //
    // The published table does NOT close integer-exact: printed marginals
    // differ from the sums of the printed cells by up to +-2 (municipality
    // columns +-1, religion rows +-2, national total -1). This is a source
    // property, not an extraction error: two independent extractors agree on
    // all 255 cells, and the published national row itself sums to 1,322,547
    // against a printed 1,322,546. Under the documented-discrepancy ruling
    // (Saint Lucia / Cote d'Ivoire), every cell is transcribed verbatim and
    // every residual is recorded, never repaired.
    //
    // The denominator is the NON-INSTITUTIONAL population (1,322,546), the
    // population living in private households, NOT the total enumerated
    // population (1,328,019); the institutional population is tabulated
    // separately and is not cross-tabbed by religion.
    //
    // Slot design is the ordinary two-slot (SB/FM/KI precedent, verbatim-cell
    // variant): religious_affiliation_percent is the sum of the fifteen
    // named-religion cells plus the residual Other line, over the printed
    // municipality Total; no_religion_percent is the single census None line.
    // The Not Stated non-response line stays in the denominator and in neither
    // share; the two shares therefore need not sum to 100. Trinidad and Tobago
    // has a real None category; no minority-share treatment applies. Place,
    // density, and change metrics are omitted: no governed place-of-worship
    // snapshot ships, and religion is cross-tabulated by municipality only in
    // the 2011 census.
    //
    // Single wave only. The 2000 National Census Report publishes religion
    // nationally only (Table 2.6, prorated, tabulable-households base); no
    // post-2011 census exists (COVID-delayed; the census is planned for 2027).
    // The single-wave municipality page proceeds under the Guinea precedent.
    //
    // Licence needs_review. The CSO asserts copyright and permits reproduction
    // of extracts only for "personal, non-commercial use with permission" with
    // full acknowledgement; its website footer asserts All Rights Reserved, and
    // no open-data licence is stated. The derived aggregate summary ships with
    // CSO attribution under BUILD-THEN-ASK, pending a CSO reuse confirmation
    // (courtesy ask recorded for the PI); nothing here implies the licence is
    // settled. Boundaries are OCHA COD-AB TTO ADM1 (Creative Commons
    // Attribution for Intergovernmental Organisations, CC BY-IGO), geometry
    // from GADM, joined one-to-one via a name crosswalk; geoBoundaries was
    // rejected because it omits the Borough of Arima (fourteen units).
    window.REGION_CONFIG = {
      countryCode: "TT",
      title: "Places of Worship | Trinidad and Tobago Research Map",
      // trinidad and tobago spans lon -61.93..-60.49 by lat 10.04..11.36 across
      // the fifteen municipalities; centre between the two islands and open at a
      // zoom that fits the full extent beside the census panels
      center: [-61.2, 10.68],
      initialZoom: 8,
      censusLevels: {
        municipality: {
          label: "Municipality",
          boundaries: "data/tt_municipality_codab.geojson",
          summary: "data/area_summary_municipality.json",
          codeProp: "area_code",
          nameProp: "area_name",
          credit: "Census religion © Central Statistical Office of Trinidad and Tobago (CSO), 2011 Population and Housing Census Demographic Report, Table 8 (reproduced with acknowledgement of source; licence needs review) · Boundaries © OCHA COD-AB TTO ADM1 (Creative Commons Attribution for Intergovernmental Organisations, CC BY-IGO), geometry from GADM"
        }
      },
      defaultLevel: "municipality",
      defaultMetric: "religious_affiliation_percent",
      defaultYear: 2011,
      // the two census-question shares; place, density, and change metrics are
      // omitted because no place layer is built and religion is cross-tabulated
      // by municipality only in the 2011 census (single wave)
      metricsAvailable: [
        "religious_affiliation_percent",
        "no_religion_percent"
      ],
      metricLabels: {
        religious_affiliation_percent: {
          label: "Religious affiliation %",
          note: "share of the municipality's non-institutional population reporting a religion — the fifteen named categories plus the residual Other line, from 2011 Demographic Report Table 8"
        },
        no_religion_percent: {
          label: "No religion %",
          note: "share of the municipality's non-institutional population in the single census None line; the separate Not Stated non-response line stays in the denominator and is not counted here"
        }
      },
      popupDenominatorNote: "Percentages use each municipality's printed non-institutional population total (national 1,322,546), the population living in private households, not the total enumerated population (1,328,019); the institutional population is tabulated separately and not cross-tabbed by religion. Religious affiliation is the sum of the fifteen named-religion cells plus the residual Other line; No religion is the single census None line. The Not Stated non-response line stays in the denominator and in neither share; the two shares therefore need not sum to 100. The published Table 8 does not close integer-exact: printed marginals differ from the printed-cell sums by up to ±2 (a source property), and every residual is recorded, never repaired. This is a single 2011 census wave; the construct is census affiliation and does not measure belief, practice, attendance, or registered membership.",
      cityPresets: [
        { label: "Port of Spain", coords: [-61.5019, 10.6549], zoom: 12 },
        { label: "San Fernando", coords: [-61.4681, 10.2797], zoom: 12 },
        { label: "Chaguanas", coords: [-61.4111, 10.5167], zoom: 12 },
        { label: "Arima", coords: [-61.2825, 10.6375], zoom: 12 },
        { label: "Point Fortin", coords: [-61.6843, 10.1740], zoom: 12 },
        { label: "Scarborough", shortLabel: "Scarborough (Tobago)", coords: [-60.7392, 11.1810], zoom: 12 }
      ],
      geocode: { country: "tt", biasLngLat: [-61.2, 10.68] },
      onboarding: {
        title: "Trinidad and Tobago research map",
        intro: "Census religious affiliation across Trinidad and Tobago's fifteen municipalities, a single 2011 snapshot from the Central Statistical Office (CSO), 2011 Population and Housing Census Demographic Report, Table 8. The table is a count-valued cross-tab of the non-institutional population (1,322,546), with seventeen verbatim religion categories including Baptist-Spiritual Shouter and Orisha and a real None line, alongside a separate Not Stated non-response line. The construct is census affiliation; it does not measure belief, practice, attendance, or registered membership.",
        bullets: [
          "Municipalities are shaded by the share reporting a religion (the fifteen named categories plus the residual <code>Other</code> line), or by the share in the census <code>None</code> line, shown as No religion %.",
          "This is one census wave, 2011, at municipality level. The published table does not close integer-exact: printed marginals differ from the sums of the printed cells by up to ±2 (municipality columns ±1, religion rows ±2, national total −1). Every cell is transcribed verbatim and every residual is recorded, never repaired. No change metric is offered.",
          "Percentages use each municipality's printed non-institutional population total (national 1,322,546), not the total enumerated population (1,328,019); the institutional population is tabulated separately and not cross-tabbed by religion. The Not Stated non-response line stays in the denominator and in neither share; the two shares therefore need not sum to 100.",
          "Religious affiliation runs from 78.5% in Tunapuna/Piarco to 90.8% in Penal/Debe, and the gradient is driven mainly by Not Stated, which reaches 19.3% in Tunapuna/Piarco. No religion is low everywhere (2.2% nationally), peaking at 5.4% in Tobago. In the source cells the central-and-south belt is Hindu-plurality (Penal/Debe, Couva/Tabaquite/Talparo) while the north-west is Roman Catholic and Anglican and Tobago is distinctively Anglican; that per-category geography is source context in Table 8, not a shipped map metric.",
          "Open <strong>Show Census Data</strong> (top centre) for the metric controls."
        ],
        links: [
          { label: "About this map", href: "overview.html" },
          { label: "Global map", href: "../../global/" }
        ]
      },
      wordmarkLinks: [
        { id: "datamaps-link", label: "Data maps", href: "../", title: "All country data maps" },
        { id: "wordmark-global", label: "Global map", href: "../../global/", title: "Open the global map" }
      ],
      censusSourceAttribution: 'Census religion © <a href="https://cso.gov.tt/" target="_blank" rel="noopener">Central Statistical Office of Trinidad and Tobago (CSO)</a>, 2011 Population and Housing Census Demographic Report, Table 8 (Non-Institutional Population by Sex, Age Group, Religion and Municipality). Source: Central Statistical Office of Trinidad and Tobago, 2011 Population and Housing Census Demographic Report. Reproduced with acknowledgement of source. The CSO asserts copyright and states no open-data licence; a reuse confirmation is pending and the licence status is under review. &middot; Boundaries © <a href="https://data.humdata.org/dataset/cod-ab-tto" target="_blank" rel="noopener">OCHA COD-AB</a> TTO ADM1 (Creative Commons Attribution for Intergovernmental Organisations, CC BY-IGO), geometry from GADM',
      censusFlagNote: "* Counts are the 2011 Demographic Report Table 8 verbatim cells (Non-Institutional Population, Both Sexes, All Ages). The published table does not close integer-exact: printed marginals differ from the printed-cell sums by up to ±2 (municipality columns ±1, religion rows ±2, national total −1); every residual is recorded, never repaired, and printed '-' is transcribed as 0. Religious affiliation is the fifteen named categories plus Other; No religion is the single None line; the Not Stated non-response line stays in the denominator and in neither share; the two therefore need not sum to 100. Single wave (2011), municipality level; no change metric. Census data ship with CSO attribution under a build-then-ask posture, licence needs review; boundaries CC BY-IGO."
    };
  </script>
  <script src="../_shared/region-map.js?v=20260716a"></script>
  <script src="../../shared/datamaps-switcher.js?v=20260714a"></script>
</body>
</html>
