<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Places of Worship | US Research Map</title>
  <link href="https://unpkg.com/maplibre-gl@3.6.1/dist/maplibre-gl.css" rel="stylesheet">
  <link href="../../shared/map-shell.css" rel="stylesheet">
  <link href="../../global/styles/maplibre-flat.css" rel="stylesheet">
  <link href="../_shared/region-map.css?v=20260707i" rel="stylesheet">
</head>
<body>
  <div id="region-root"></div>
  <script src="../../global/config.public.js"></script>
  <script src="../../global/config.js"></script>
  <script src="https://unpkg.com/maplibre-gl@3.6.1/dist/maplibre-gl.js"></script>
  <script>
    // the whole country-specific surface; every behaviour lives in the
    // shared module (../_shared/region-map.js) and keys on this config
    // and the data products, never on country identity
    window.REGION_CONFIG = {
      countryCode: "US",
      title: "Places of Worship | US Research Map",
      // continental US centre; alaska/hawaii/territories included in the
      // data but off-canvas at this default view
      center: [-98.6, 39.8],
      initialZoom: 4,
      // each level is a governed area-summary product plus its boundary
      // file; paths resolve from this page's directory
      censusLevels: {
        county: {
          label: "County",
          boundaries: "data/counties_2020.geojson",
          summary: "data/area_summary_county.json",
          codeProp: "GEOID",
          nameProp: "NAME",
          credit: "U.S. Census Bureau cartographic boundaries (public domain) · 2020 vintage"
        },
        county_1930: {
          label: "County (1930)",
          boundaries: "data/counties_1930.geojson",
          summary: "data/area_summary_county_1930.json",
          codeProp: "GISJOIN",
          nameProp: "AREA_NAME",
          credit: "IPUMS NHGIS historical county boundaries · 1930 vintage · 2008 TIGER/Line+ basis"
        },
        county_1890: {
          label: "County (1890)",
          boundaries: "data/counties_1890.geojson",
          summary: "data/area_summary_county_1890.json",
          codeProp: "GISJOIN",
          nameProp: "AREA_NAME",
          credit: "IPUMS NHGIS historical county boundaries · 1890 vintage · 2008 TIGER/Line+ basis"
        },
        county_1870: {
          label: "County (1870)",
          boundaries: "data/counties_1870.geojson",
          summary: "data/area_summary_county_1870.json",
          codeProp: "GISJOIN",
          nameProp: "AREA_NAME",
          credit: "IPUMS NHGIS historical county boundaries · 1870 vintage · 2008 TIGER/Line+ basis"
        },
        county_1860: {
          label: "County (1860)",
          boundaries: "data/counties_1860.geojson",
          summary: "data/area_summary_county_1860.json",
          codeProp: "GISJOIN",
          nameProp: "AREA_NAME",
          credit: "IPUMS NHGIS historical county boundaries · 1860 vintage · 2008 TIGER/Line+ basis"
        },
        county_1850: {
          label: "County (1850)",
          boundaries: "data/counties_1850.geojson",
          summary: "data/area_summary_county_1850.json",
          codeProp: "GISJOIN",
          nameProp: "AREA_NAME",
          credit: "IPUMS NHGIS historical county boundaries · 1850 vintage · 2008 TIGER/Line+ basis"
        }
      },
      defaultLevel: "county",
      defaultMetric: "religious_affiliation_percent",
      defaultYear: 2020,
      // construct honesty (binding, docs/playbooks/us-data-map.md): the US
      // religion census measures congregations and adherents reported by
      // religious bodies, not a census self-identification question, and
      // there is no US OSM place-of-worship layer built yet. metricLabels
      // overrides the shared module's default census-question wording;
      // metricsAvailable hides the no-religion and place-density metrics
      // that do not apply to this construct or data state, rather than
      // showing them permanently pending.
      metricLabels: {
        religious_affiliation_percent: {
          label: "Seating, members, or adherents per 100 population",
          note: "church seating in 1850-1890, members in 1906-1936, and reported congregational adherents or members in 1952-2020"
        },
        religious_change: {
          label: "Change in the per-100 measure",
          note: "wave-to-wave percentage-point change within the selected boundary level"
        }
      },
      metricsAvailable: ["religious_affiliation_percent", "religious_change"],
      // one slider across all eras: dragging the year switches the
      // geography level (boundary vintage) automatically
      timeline: [
        { year: 1850, level: "county_1850" },
        { year: 1860, level: "county_1860" },
        { year: 1870, level: "county_1870" },
        { year: 1890, level: "county_1890" },
        { year: 1906, level: "county_1930" },
        { year: 1916, level: "county_1930" },
        { year: 1926, level: "county_1930" },
        { year: 1936, level: "county_1930" },
        { year: 1952, level: "county" },
        { year: 1971, level: "county" },
        { year: 1980, level: "county" },
        { year: 1990, level: "county" },
        { year: 2000, level: "county" },
        { year: 2010, level: "county" },
        { year: 2020, level: "county" }
      ],
      // ~350k US places of worship in OSM bury the county choropleth at
      // national zoom; fade the overview dot tier (dots ramp back in from z6)
      overviewDotOpacity: 0.12,
      popupDenominatorNote: "Rates use the source-supplied county population denominator. The construct shifts from church seating to members to adherents across the historical series.",
      cityPresets: [
        { label: "New York City", shortLabel: "NYC", coords: [-73.9857, 40.7484], zoom: 10 },
        { label: "Los Angeles", shortLabel: "LA", coords: [-118.2437, 34.0522], zoom: 10 },
        { label: "Chicago", coords: [-87.6298, 41.8781], zoom: 10 },
        { label: "Houston", coords: [-95.3698, 29.7604], zoom: 10 },
        { label: "Atlanta", coords: [-84.3880, 33.7490], zoom: 10 },
        { label: "Seattle", coords: [-122.3321, 47.6062], zoom: 10 },
        { label: "Denver", coords: [-104.9903, 39.7392], zoom: 10 },
        { label: "Miami", coords: [-80.1918, 25.7617], zoom: 10 },
        { label: "Washington", shortLabel: "DC", coords: [-77.0369, 38.9072], zoom: 10 },
        { label: "Boston", coords: [-71.0589, 42.3601], zoom: 10 }
      ],
      geocode: { country: "us", biasLngLat: [-98.6, 39.8] },
      onboarding: {
        title: "US research map",
        intro: "Places of worship across the United States, with county overlays from NHGIS church statistics, the Census of Religious Bodies, and ARDA's Churches and Church Membership / U.S. Religion Census series, 1850 to 2020.",
        bullets: [
          "The census overlay is on: counties are shaded by adherents per 100 population, as reported by religious bodies to the U.S. Religion Census.",
          "The historical construct shifts across the series: 1850-1890 shows church seating, 1906-1936 shows members, and 1952-2020 shows adherents reported by religious bodies.",
          "This is not a census affiliation question: the United States census asks no religion question. The data are institutional counts submitted by participating denominations and faith groups.",
          "Participating bodies and definitions differ by wave; the 1952 file has only a limited Black-denomination estimate, and the 1971 file does not systematically cover historically Black denominations.",
          "Open <strong>Census</strong> (top centre) for the metric and year slider.",
          "Tap any dot for a place; tap a county for its adherence detail."
        ],
        links: [
          { label: "Global map", href: "../../global/" }
        ]
      },
      wordmarkLinks: [
        { id: "datamaps-link", label: "Data maps", href: "../", title: "All country data maps" },
        { id: "wordmark-global", label: "Global map", href: "../../global/", title: "Open the global map" }
      ],
      datedPlaces: "data/dated_places.geojson",
      censusSourceAttribution: 'Congregations &amp; adherents © <a href="https://www.usreligioncensus.org/" target="_blank" rel="noopener">U.S. Religion Census</a> / <a href="https://www.thearda.com/" target="_blank" rel="noopener">Association of Religion Data Archives (ARDA)</a> · Historical tables © <a href="https://www.nhgis.org/" target="_blank" rel="noopener">IPUMS NHGIS</a> · Boundaries © <a href="https://www.census.gov/" target="_blank" rel="noopener">U.S. Census Bureau</a> (public domain) / <a href="https://www.nhgis.org/" target="_blank" rel="noopener">IPUMS NHGIS</a>',
      censusFlagNote: "* historical wave coverage differs across source series, period-boundary vintage differs from the source wave, or a 1952-2020 county boundary was crosswalked to the 2020 county layer (see the manifests)."
    };
  </script>
  <script src="../_shared/region-map.js?v=20260707i"></script>
</body>
</html>
