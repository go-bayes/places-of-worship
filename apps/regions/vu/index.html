<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Places of Worship | Vanuatu Research Map</title>
  <link href="https://unpkg.com/maplibre-gl@3.6.1/dist/maplibre-gl.css" rel="stylesheet">
  <link href="../../shared/map-shell.css" rel="stylesheet">
  <link href="../../global/styles/maplibre-flat.css" rel="stylesheet">
  <link href="../_shared/region-map.css" rel="stylesheet">
</head>
<body>
  <div id="region-root"></div>
  <script src="../../global/config.public.js"></script>
  <script src="../../global/config.js"></script>
  <script src="https://unpkg.com/maplibre-gl@3.6.1/dist/maplibre-gl.js"></script>
  <script>
    // the whole country-specific surface; every behaviour lives in the
    // shared module (../_shared/region-map.js) and keys on this config
    // and the data products, never on country identity
    window.REGION_CONFIG = {
      countryCode: "VU",
      title: "Places of Worship | Vanuatu Research Map",
      // vanuatu archipelago: centred between Efate and Espiritu Santo
      center: [167.9, -16.3],
      initialZoom: 6,
      // each level is a governed area-summary product plus its boundary
      // file; paths resolve from this page's directory
      censusLevels: {
        adm1: {
          label: "Province",
          boundaries: "data/adm1_2020.geojson",
          summary: "data/area_summary_adm1.json",
          codeProp: "area_code",
          nameProp: "area_name",
          credit: "Boundaries © geoBoundaries (ODbL)"
        },
        adm2: {
          label: "Area council",
          boundaries: "data/adm2_2020.geojson",
          summary: "data/area_summary_adm2.json",
          codeProp: "area_code",
          nameProp: "area_name",
          credit: "Boundaries © geoBoundaries (CC BY 3.0 IGO)"
        }
      },
      defaultLevel: "adm1",
      // open on the metric that has data today: place-of-worship density.
      // the religion metrics await a structured census source
      defaultMetric: "place_density_per_sq_km",
      defaultYear: 2020,
      cityPresets: [
        { label: "Port Vila", shortLabel: "Pt Vila", coords: [168.3219, -17.7404], zoom: 11 },
        { label: "Luganville", coords: [167.1667, -15.5167], zoom: 11 },
        { label: "Isangel", aliases: ["Tanna"], coords: [169.2756, -19.539], zoom: 11 },
        { label: "Lakatoro", coords: [167.4203, -16.0992], zoom: 11 },
        { label: "Saratamata", aliases: ["Ambae"], coords: [167.9667, -15.3], zoom: 11 },
        { label: "Sola", aliases: ["Banks"], coords: [167.5494, -13.8761], zoom: 10 },
        { label: "Norsup", coords: [167.3919, -16.0667], zoom: 11 },
        { label: "Longana", coords: [167.95, -15.3], zoom: 11 }
      ],
      geocode: { country: "vu", biasLngLat: [167.9, -16.3] },
      onboarding: {
        title: "Vanuatu research map",
        intro: "Places of worship across Vanuatu, with census geographies ready for religious-affiliation data.",
        bullets: [
          "Areas are shaded by place-of-worship density (OSM places per km²).",
          "Open <strong>Census</strong> (top centre) for the metric and geography; religion data is pending.",
          "Tap any dot for a place, or an area for its density."
        ],
        links: [
          { label: "Global map", href: "../../global/" }
        ]
      },
      wordmarkLinks: [
        { id: "wordmark-global", label: "Global map", href: "../../global/", title: "Open the global map" }
      ],
      censusSourceAttribution: 'Boundaries © <a href="https://www.geoboundaries.org/" target="_blank" rel="noopener">geoBoundaries</a>',
      censusFlagNote: "* small or suppressed denominator under census confidentiality rounding; treat percentages as indicative."
    };
  </script>
  <script src="../_shared/region-map.js"></script>
</body>
</html>
