<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Places of Worship | Vanuatu Research Map</title>
  <link href="https://unpkg.com/maplibre-gl@3.6.1/dist/maplibre-gl.css" rel="stylesheet" integrity="sha384-p5cy4wHtKSqjnLUNjQ+8ffCwUp0vlLS+6lg1lc3qqXax2E1EmVCMCAimU+R0MOZH" crossorigin="anonymous">
  <link href="../../shared/map-shell.css?v=20260904a" rel="stylesheet">

</head>
<body>
  <div id="region-root"></div>
  <script src="../../global/config.public.js"></script>
  <script src="https://unpkg.com/maplibre-gl@3.6.1/dist/maplibre-gl.js" integrity="sha384-uofOi1moPDuBpTo0FkNAG4WsnGegNBw9g6c0yU85W9DOyVkz3Ht2vKC744Y92hu0" crossorigin="anonymous"></script>
  <script>
    // the whole country-specific surface; every behaviour lives in the
    // shared module (../_shared/region-map.js) and keys on this config
    // and the data products, never on country identity
    window.REGION_CONFIG = {
      countryCode: "VU",
      title: "Places of Worship | Vanuatu Research Map",
      // vanuatu archipelago: centred between Efate and Espiritu Santo
      center: [167.9, -16.3],
      initialZoom: 6,
      // each level is a governed area-summary product plus its boundary
      // file; paths resolve from this page's directory
      censusLevels: {
        adm1: {
          label: "Province",
          boundaries: "data/adm1_2020.geojson",
          summary: "data/area_summary_adm1.json",
          codeProp: "area_code",
          nameProp: "area_name",
          credit: "Boundaries © geoBoundaries (ODbL)"
        },
        adm2: {
          label: "Area council",
          boundaries: "data/adm2_2020.geojson",
          summary: "data/area_summary_adm2.json",
          codeProp: "area_code",
          nameProp: "area_name",
          credit: "Boundaries © geoBoundaries (CC BY 3.0 IGO)"
        }
      },
      defaultLevel: "adm1",
      // affiliation is 94-100% in every province and year, so it makes a flat
      // map; the informative signal is denominational. open on customary
      // (kastom) beliefs, the headline diversification metric, which runs back
      // to the 1967 first census
      defaultMetric: "customary_beliefs_percent",
      defaultYear: 2020,
      // denomination metrics are opt-in in the shared module; this list also
      // sets the dropdown order, leading with the most informative metrics.
      // all five denominations run 1967-2020 at province level (2020 at area
      // council); affiliation/no-religion/places cover 1999-2020
      metricsAvailable: [
        "customary_beliefs_percent",
        "presbyterian_percent",
        "anglican_percent",
        "catholic_percent",
        "seventh_day_adventist_percent",
        "religious_affiliation_percent",
        "no_religion_percent",
        "places_per_10000_residents",
        "place_density_per_sq_km"
      ],
      cityPresets: [
        { label: "Port Vila", shortLabel: "Pt Vila", coords: [168.3219, -17.7404], zoom: 11 },
        { label: "Luganville", coords: [167.1667, -15.5167], zoom: 11 },
        { label: "Isangel", aliases: ["Tanna"], coords: [169.2756, -19.539], zoom: 11 },
        { label: "Lakatoro", coords: [167.4203, -16.0992], zoom: 11 },
        { label: "Saratamata", aliases: ["Ambae"], coords: [167.9667, -15.3], zoom: 11 },
        { label: "Sola", aliases: ["Banks"], coords: [167.5494, -13.8761], zoom: 10 },
        { label: "Norsup", coords: [167.3919, -16.0667], zoom: 11 },
        { label: "Longana", coords: [167.95, -15.3], zoom: 11 }
      ],
      geocode: { country: "vu", biasLngLat: [167.9, -16.3] },
      onboarding: {
        title: "Vanuatu research map",
        intro: "Places of worship across Vanuatu, with census denomination overlays back to the 1967 first census.",
        bullets: [
          "The census overlay is on: provinces are shaded by the share reporting customary (kastom) beliefs, which fell sharply after 1967.",
          "Open <strong>Show Census Data</strong> (top centre) to choose denomination or affiliation, geography, and census year (1967&ndash;2020).",
          "Tap any dot for a place; tap a province for its census detail."
        ],
        links: [
          { label: "About this map", href: "overview.html" },
          { label: "Global map", href: "../../global/" }
        ]
      },
      wordmarkLinks: [
        { id: "wordmark-global", label: "Global map", href: "../../global/", title: "Open the global map" },
        { id: "verification-link", label: "Submit evidence", href: "verification.html", title: "Open the RA verification map" },
        { id: "review-link", label: "Review evidence", href: "review.html", title: "Review submitted evidence" }
      ],
      // datedPlaces deliberately absent: vu's dated_places.geojson is an
      // empty featurecollection, so period mode would blank every dot;
      // restore the key when the dated product carries real features
      // pulotu cultures pilot (design ratified 2026-07-11): the global
      // product, filtered to VU by the runtime; nine cultures, one per
      // area council. attribution rides the cultures-mode legend note
      pulotuCultures: {
        data: "../_shared/data/pulotu_cultures.geojson?v=20260711c"
      },
      censusSourceAttribution: 'Census religion © <a href="https://vbos.gov.vu/" target="_blank" rel="noopener">Vanuatu Bureau of Statistics</a> &amp; <a href="https://sdd.spc.int/" target="_blank" rel="noopener">SPC</a>; 1967 first census © McArthur &amp; Yaxley (1968) · Boundaries © <a href="https://www.geoboundaries.org/" target="_blank" rel="noopener">geoBoundaries</a>',
      censusFlagNote: "* caveats: 1967 is the first census (McArthur &amp; Yaxley Table A), tabulating adherents of religious groups aged 15+ with no no-religion category, aggregated from islands to the modern provinces — so affiliation and no-religion are blank for 1967 and only the denomination shares are comparable across years; 2020 province rows include the urban municipalities by derivation so all years share one basis; 2009 area-council religion is published by island, so area-council rows carry island-level values; published cells also carry small (±1–2) internal inconsistencies consistent with confidentiality perturbation — treat close percentages as equal."
    };
  </script>
  <script src="../../shared/region-resolve.js?v=20260904a"></script>
  <script src="../_shared/region-map.js?v=20261015b"></script>
  <script src="../../shared/datamaps-switcher.js?v=20261013a"></script>
</body>
</html>
