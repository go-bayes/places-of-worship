        "Each wave reconciles exactly at both margins. In 2011 the 34 enumerated municipality totals sum to the printed national 1,739,825, and every religion column sums across those municipalities to its printed national total (Islam 1,663,412; Orthodox 25,837; Catholic 38,438; Others 1,188; No religious affiliation 1,242; Prefers not to answer 9,708). In 2024 all 38 municipality totals sum to the printed national 1,585,566, and every religion column sums to its printed national total (Islam 1,482,276; Orthodox 36,683; Catholic 27,815; Others 7,175; No religious affiliation 7,899; Prefers not to answer 23,718).",
