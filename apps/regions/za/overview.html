    window.OVERVIEW_CONFIG = {

        "Percentages use the stated-response denominator: named religions plus no religion, excluding the Undetermined residual. Religious affiliation and no religion sum to 100 percent of stated responses. The Undetermined share is large in 1996 (about 9 percent nationally, reflecting 1996 census processing) and small in 2001 and 2022 (about 1 to 2 percent), so 1996 stated-response shares rest on a smaller base.",
