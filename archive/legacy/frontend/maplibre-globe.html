<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Places of Worship | MapLibre Map</title>
  <link href="https://unpkg.com/maplibre-gl@3.6.1/dist/maplibre-gl.css" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0c10;
      --panel: rgba(13, 16, 23, 0.82);
      --text: #e8edf2;
      --accent: #4fd1c5;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; }
    body, html { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: "Work Sans", -apple-system, "Segoe UI", sans-serif; }
    #map { position: fixed; inset: 0; }
    #hud {
      position: fixed; top: 12px; left: 12px; right: 12px; max-width: 520px;
      padding: 14px 16px; background: var(--panel); border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px; backdrop-filter: blur(12px); box-shadow: 0 8px 30px rgba(0,0,0,0.25); z-index: 10;
    }
    #hud h1 { margin: 0 0 4px; font-weight: 600; letter-spacing: -0.02em; font-size: 18px; }
    #hud p { margin: 0 0 10px; color: var(--muted); font-size: 13px; line-height: 1.4; }
    #hud .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    #hud button {
      background: var(--accent); color: #0b0c10; border: none; border-radius: 10px; padding: 9px 12px;
      font-weight: 700; cursor: pointer; transition: transform 120ms ease, box-shadow 120ms ease; font-size: 13px;
    }
    #hud button.secondary { background: rgba(255,255,255,0.08); color: var(--text); }
    #hud button:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(0,0,0,0.25); }
    #legend { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; }
    .chip {
      display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted);
      background: rgba(255,255,255,0.05); padding: 6px 10px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.06);
    }
    .chip i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; }
    @media (max-width: 640px) {
      #hud { max-width: 94vw; }
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="status" style="position:fixed;bottom:12px;left:12px;right:12px;max-width:520px;background:rgba(200,30,30,0.9);color:#fff;padding:8px 12px;border-radius:8px;font-size:12px;display:none;z-index:12;">
    Map failed to load. Check that MapLibre and Martin are reachable.
  </div>
  <div id="hud">
    <h1>MapLibre (Flat)</h1>
    <p>Starts in Wellington. Flat monochrome base with points from PMTiles. Polygons optional.</p>
    <div class="row" style="margin-bottom: 10px;">
      <button id="jump-wellington">Jump to Wellington</button>
    </div>
    <div id="legend">
      <span class="chip"><i style="background:#4fd1c5"></i> Place</span>
      <span class="chip"><i style="background:#f472b6"></i> Cluster</span>
      <span class="chip"><i style="background:#7dd3fc"></i> NZ polygon</span>
    </div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@3.6.1/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/pmtiles@3.1.1/dist/index.js"></script>
  <script>
    const status = document.getElementById("status");
    function showStatus(message) {
      status.textContent = message;
      status.style.display = "block";
    }

    const WELLINGTON = [174.7762, -41.2865];
    // Martin tile endpoints: this Martin build serves tiles at /{source}/{z}/{x}/{y}.
    const PLACES_TILES = "http://127.0.0.1:3001/places/{z}/{x}/{y}";
    const POLYGONS_TILES = "http://127.0.0.1:3001/nz-polygons/{z}/{x}/{y}";
    const urlParams = new URLSearchParams(window.location.search);
    const PLACES_LAYER = urlParams.get("placesLayer") || "places";
    const POLYGONS_LAYER = urlParams.get("polygonsLayer") || "nz-polygons";

    const protocol = new pmtiles.Protocol();
    maplibregl.addProtocol("pmtiles", protocol.tile);

    const monochromeStyle = {
      version: 8,
      name: "Monochrome",
      glyphs: "https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf",
      sources: {
        "carto-light": {
          type: "raster",
          tiles: [
            "https://a.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}.png",
            "https://b.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}.png",
            "https://c.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}.png",
            "https://d.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}.png"
          ],
          tileSize: 256,
          attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
        }
      },
      layers: [
        { id: "background", type: "background", paint: { "background-color": "#0b0c10" } },
        {
          id: "basemap",
          type: "raster",
          source: "carto-light",
          minzoom: 0,
          maxzoom: 19,
          paint: {
            "raster-saturation": -1,
            "raster-brightness-min": 0.35,
            "raster-brightness-max": 0.9,
            "raster-contrast": 0.1
          }
        }
      ]
    };

    if (!window.maplibregl) {
      showStatus("MapLibre failed to load. Check https://unpkg.com connectivity.");
      throw new Error("MapLibre missing");
    }

    const map = new maplibregl.Map({
      container: "map",
      style: monochromeStyle,
      center: WELLINGTON,
      zoom: 4.5,
      pitch: 0,
      bearing: 0,
      projection: "mercator",
      hash: true
    });

    map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), "bottom-right");
    map.addControl(new maplibregl.FullscreenControl(), "bottom-right");
    map.addControl(new maplibregl.GeolocateControl({
      positionOptions: { enableHighAccuracy: true },
      trackUserLocation: true,
      showUserHeading: true
    }), "bottom-right");

    function centroidFromGeometry(geom) {
      if (!geom) return WELLINGTON;
      const rings = geom.type === "Polygon" ? geom.coordinates[0] : geom.coordinates[0]?.[0];
      if (!Array.isArray(rings) || !rings.length) return WELLINGTON;
      let x = 0, y = 0;
      for (const coord of rings) { x += coord[0]; y += coord[1]; }
      return [x / rings.length, y / rings.length];
    }

    function addPlacesLayers(isVector) {
      const sourceLayer = isVector ? PLACES_LAYER : undefined;

      if (!isVector) {
        map.addLayer({
          id: "clusters",
          type: "circle",
          source: "places",
          "source-layer": sourceLayer,
          filter: ["has", "point_count"],
          paint: {
            "circle-color": [
              "step",
              ["get", "point_count"],
              "#f472b6",
              25, "#fb7185",
              100, "#ef4444"
            ],
            "circle-radius": [
              "step",
              ["get", "point_count"],
              18,
              25, 22,
              100, 28
            ],
            "circle-stroke-width": 1.5,
            "circle-stroke-color": "#0b0c10"
          }
        });

        map.addLayer({
          id: "cluster-count",
          type: "symbol",
          source: "places",
          "source-layer": sourceLayer,
          filter: ["has", "point_count"],
          layout: {
            "text-field": ["get", "point_count_abbreviated"],
            "text-font": ["Open Sans Bold", "Arial Unicode MS Bold"],
            "text-size": 12
          },
          paint: { "text-color": "#0b0c10" }
        });
      }

      map.addLayer({
        id: "points",
        type: "circle",
        source: "places",
        "source-layer": sourceLayer,
        paint: {
          "circle-radius": 4.5,
          "circle-color": "#4fd1c5",
          "circle-stroke-width": 0.8,
          "circle-stroke-color": "#0b0c10",
          "circle-opacity": 0.9
        }
      });

      map.on("click", "points", e => {
        const feature = e.features[0];
        const [lng, lat] = feature.geometry.coordinates;
        const streetViewUrl = `https://www.google.com/maps?q=${lat},${lng}&layer=c&cbll=${lat},${lng}`;
        new maplibregl.Popup({ maxWidth: "320px" })
          .setLngLat(feature.geometry.coordinates)
          .setHTML(`
            <div style="font-weight:600;margin-bottom:4px;">${feature.properties.name || "Place"}</div>
            <div style="color:#94a3b8;font-size:12px;">Code: ${feature.properties.code || "N/A"}</div>
            <div style="margin-top:8px;">
              <a href="${streetViewUrl}" target="_blank" rel="noopener" style="color:#4fd1c5;text-decoration:none;">Open Street View</a>
            </div>
          `)
          .addTo(map);
      });

      map.on("mouseenter", "points", () => map.getCanvas().style.cursor = "pointer");
      map.on("mouseleave", "points", () => map.getCanvas().style.cursor = "");
    }

    async function loadPolygons() {
      if (POLYGONS_TILES) {
        map.addSource("nz-polygons", { type: "vector", tiles: [POLYGONS_TILES], minzoom: 2, maxzoom: 14 });
        map.addLayer({
          id: "nz-polygons-fill",
          type: "fill",
          source: "nz-polygons",
          "source-layer": POLYGONS_LAYER,
          paint: { "fill-color": "rgba(125, 211, 252, 0.10)", "fill-outline-color": "rgba(255,255,255,0.05)" }
        });
        map.addLayer({
          id: "nz-polygons-line",
          type: "line",
          source: "nz-polygons",
          "source-layer": POLYGONS_LAYER,
          paint: { "line-color": "rgba(255,255,255,0.25)", "line-width": 0.6 }
        });
        return;
      }

      const res = await fetch("../data/sa2.geojson");
      if (!res.ok) return;
      const geojson = await res.json();
      map.addSource("nz-polygons", { type: "geojson", data: geojson });
      map.addLayer({
        id: "nz-polygons-fill",
        type: "fill",
        source: "nz-polygons",
        paint: { "fill-color": "rgba(125, 211, 252, 0.10)", "fill-outline-color": "rgba(255,255,255,0.05)" }
      });
      map.addLayer({
        id: "nz-polygons-line",
        type: "line",
        source: "nz-polygons",
        paint: { "line-color": "rgba(255,255,255,0.25)", "line-width": 0.6 }
      });
    }

    async function loadPlaces() {
      if (PLACES_TILES) {
        map.addSource("places", { type: "vector", tiles: [PLACES_TILES], minzoom: 2, maxzoom: 14 });
        addPlacesLayers(true);
        return;
      }

      const res = await fetch("../data/sa2.geojson");
      if (!res.ok) throw new Error("Failed to load demo data");
      const geojson = await res.json();
      const points = {
        type: "FeatureCollection",
        features: geojson.features.slice(0, 1500).map(f => ({
          type: "Feature",
          properties: {
            name: f.properties?.SA22018_V1_NAME || "Unknown area",
            code: f.properties?.SA22018_V1_00 || "NA"
          },
          geometry: { type: "Point", coordinates: centroidFromGeometry(f.geometry) }
        }))
      };
      map.addSource("places", { type: "geojson", data: points, cluster: true, clusterRadius: 50, clusterMaxZoom: 12 });
      addPlacesLayers(false);
    }

    map.on("load", () => {
      loadPolygons().catch(err => console.error(err));
      loadPlaces().catch(err => console.error(err));
    });

    map.on("error", (e) => {
      const detail = e && e.error && e.error.message ? e.error.message : "Unknown error";
      showStatus(`Map error: ${detail}`);
    });

    document.getElementById("jump-wellington").addEventListener("click", () => {
      map.easeTo({ center: WELLINGTON, zoom: 9, pitch: 55, bearing: 10, duration: 1200 });
    });

  </script>
</body>
</html>
