<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400" role="img" aria-labelledby="title desc">
  <title id="title">Validate a CSV successfully</title>
  <desc id="desc">A terminal window showing a successful pow validate output with no errors or warnings.</desc>
  <rect width="920" height="400" fill="#f5f7fa"/>
  <rect x="70" y="44" width="780" height="306" rx="10" fill="#111827"/>
  <rect x="70" y="44" width="780" height="34" rx="10" fill="#374151"/>
  <circle cx="94" cy="61" r="6" fill="#ef4444"/>
  <circle cx="116" cy="61" r="6" fill="#f59e0b"/>
  <circle cx="138" cy="61" r="6" fill="#22c55e"/>
  <text x="86" y="116" fill="#d1d5db" font-family="Menlo, Consolas, monospace" font-size="17">$ cargo run -p pow-cli -- validate "/path/to/NZ pilot batch.csv"</text>
  <text x="86" y="162" fill="#9ca3af" font-family="Menlo, Consolas, monospace" font-size="17">pow validate: /path/to/NZ pilot batch.csv</text>
  <text x="86" y="194" fill="#9ca3af" font-family="Menlo, Consolas, monospace" font-size="17">format: csv</text>
  <text x="86" y="226" fill="#9ca3af" font-family="Menlo, Consolas, monospace" font-size="17">records checked: 25</text>
  <text x="86" y="258" fill="#34d399" font-family="Menlo, Consolas, monospace" font-size="17">errors: 0</text>
  <text x="86" y="290" fill="#34d399" font-family="Menlo, Consolas, monospace" font-size="17">warnings: 0</text>
</svg>
