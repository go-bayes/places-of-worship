<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Places of Worship | MapLibre Flat Prototype</title>
  <link href="https://unpkg.com/maplibre-gl@3.6.1/dist/maplibre-gl.css" rel="stylesheet">
  <style>
    :root {
      --bg: #f8fafc;
      --panel: rgba(13, 16, 23, 0.82);
      --text: #e8edf2;
      --accent: #cbd5f5;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; }
    body, html { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: "Work Sans", -apple-system, "Segoe UI", sans-serif; }
    #map { position: fixed; inset: 0; }
    #hud {
      position: fixed; top: 12px; left: 12px; right: 12px; max-width: 520px;
      padding: 14px 16px; background: var(--panel); border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px; backdrop-filter: blur(12px); box-shadow: 0 8px 30px rgba(0,0,0,0.25); z-index: 10;
    }
    #hud h1 { margin: 0 0 4px; font-weight: 600; letter-spacing: -0.02em; font-size: 18px; }
    #hud p { margin: 0 0 10px; color: var(--muted); font-size: 13px; line-height: 1.4; }
    #hud .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    #hud button {
      background: var(--accent); color: #0b0c10; border: none; border-radius: 10px; padding: 9px 12px;
      font-weight: 700; cursor: pointer; transition: transform 120ms ease, box-shadow 120ms ease; font-size: 13px;
    }
    #hud button.secondary { background: rgba(255,255,255,0.08); color: var(--text); }
    #hud button:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(0,0,0,0.25); }
    #legend { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; }
    .chip {
      display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted);
      background: rgba(255,255,255,0.05); padding: 6px 10px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.06);
    }
    .chip i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; }
    #dock {
      position: fixed; left: 12px; right: auto; bottom: 6px;
      display: flex; flex-direction: column; gap: 6px; z-index: 11;
      width: min(94vw, 480px);
    }
    .dock-panel {
      background: rgba(15, 23, 42, 0.62); border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px; padding: 6px 8px; backdrop-filter: blur(10px);
      box-shadow: 0 8px 18px rgba(0,0,0,0.24);
      width: 100%;
    }
    .dock-row { display: flex; gap: 6px; flex-wrap: nowrap; align-items: center; min-height: 24px; }
    .dock-row input {
      flex: 1.3; min-width: 0; background: rgba(255,255,255,0.08); border: 1px solid transparent;
      color: var(--text); padding: 2px 6px; border-radius: 8px; font-size: 9px;
    }
    .dock-row select {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--text);
      padding: 2px 6px;
      border-radius: 8px;
      font-size: 9px;
      min-width: 104px;
      flex-shrink: 0;
    }
    .dock-row input::placeholder { color: rgba(226,232,240,0.6); }
    .dock-row button {
      background: rgba(226, 232, 240, 0.16); color: #e2e8f0; border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px; padding: 2px 6px; font-weight: 700; cursor: pointer;
      transition: transform 120ms ease, box-shadow 120ms ease; font-size: 9px;
    }
    .dock-row button.secondary { background: rgba(255,255,255,0.12); color: var(--text); }
    .dock-row button:hover { transform: translateY(-1px); box-shadow: 0 8px 16px rgba(0,0,0,0.3); }
    .dock-cities-row { align-items: center; }
    .dock-cities {
      display: flex;
      gap: 6px;
      flex-wrap: nowrap;
      width: 100%;
      overflow-x: auto;
      padding-bottom: 2px;
      flex: 1;
    }
    .dock-chip {
      background: rgba(148,163,184,0.14); color: var(--text); border: 1px solid rgba(255,255,255,0.05);
      padding: 2px 6px; border-radius: 999px; font-size: 8.5px; cursor: pointer;
      transition: transform 120ms ease, background 120ms ease;
    }
    .dock-chip:hover { transform: translateY(-1px); background: rgba(148,163,184,0.28); }
    .dock-row + .dock-row { margin-top: 4px; }
    .streetview {
      width: min(380px, 70vw);
      height: min(240px, 32vh);
      border-radius: 10px;
      overflow: hidden;
      background: rgba(15, 23, 42, 0.8);
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      margin-top: 8px;
    }
    .streetview.expanded {
      width: min(640px, 86vw);
      height: min(420px, 60vh);
    }
    .maplibregl-popup-content {
      max-width: min(720px, 88vw);
    }
    .streetview-toolbar {
      display: flex;
      justify-content: space-between;
      margin-top: 6px;
      gap: 8px;
    }
    .streetview-toolbar button {
      background: rgba(226, 232, 240, 0.18);
      border: 1px solid rgba(255,255,255,0.08);
      color: #e2e8f0;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
    }
    .popup-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .popup-actions a,
    .popup-actions button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid rgba(0,0,0,0.1);
      background: rgba(15, 23, 42, 0.08);
      color: #111;
      font-size: 12px;
      text-decoration: none;
      cursor: pointer;
    }
    #corner-link {
      position: fixed;
      right: 12px;
      bottom: 6px;
      z-index: 11;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255,255,255,0.06);
      color: #e2e8f0;
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 9px;
      text-decoration: none;
      opacity: 0.85;
    }
    #counts {
      position: fixed;
      right: 12px;
      top: 12px;
      z-index: 11;
      background: rgba(15, 23, 42, 0.62);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px;
      padding: 6px 8px;
      font-size: 10px;
      color: #e2e8f0;
      min-width: 118px;
    }
    #counts h3 {
      margin: 0 0 6px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.01em;
    }
    #counts ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 3px;
    }
    #counts li {
      display: flex;
      justify-content: space-between;
      gap: 6px;
      color: #cbd5f5;
      align-items: center;
    }
    #counts .legend {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    #counts .dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.25);
    }
    #counts .count-total {
      margin-top: 6px;
      font-weight: 600;
      color: #f1f5f9;
    }
    .maplibregl-ctrl-bottom-right { bottom: 56px; }
    @media (max-width: 640px) {
      #hud { max-width: 94vw; }
      #dock { left: 10px; right: 10px; bottom: 10px; width: auto; }
      #corner-link { right: 12px; bottom: 10px; }
      .maplibregl-ctrl-bottom-right { bottom: 80px; }
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <a id="corner-link" href="https://go-bayes.github.io/places-of-worship/enhanced-places.html">Explore Enhanced View (NZ)</a>
  <div id="counts">
    <h3>Visible Places</h3>
    <ul id="countsList"></ul>
    <div class="count-total" id="countsTotal">Total: 0</div>
  </div>
  <div id="dock">
    <div class="dock-panel">
      <div class="dock-row">
        <input id="searchInput" type="text" placeholder="Search an address or place (prototype)">
        <button id="searchButton">Search</button>
      </div>
      <div class="dock-row dock-cities-row">
        <div class="dock-cities" id="cityChips"></div>
        <select id="basemapSelect"></select>
      </div>
    </div>
  </div>

  <script src="config.public.js"></script>
  <script src="config.js"></script>
  <script src="https://unpkg.com/maplibre-gl@3.6.1/dist/maplibre-gl.js"></script>
  <script>
    if (!window.maplibregl) {
      throw new Error("MapLibre missing");
    }
    const showStatus = () => {};

    const WELLINGTON = [174.7762, -41.2865];
    const OVERVIEW_TILES = "https://tiles.placemap.org/places-overview/{z}/{x}/{y}";
    const PLACES_TILES = "https://tiles.placemap.org/places/{z}/{x}/{y}";
    const POLYGONS_TILES = "https://tiles.placemap.org/nz-polygons/{z}/{x}/{y}";
    const BUILDINGS_TILES = "https://tiles.placemap.org/buildings/{z}/{x}/{y}";

    const urlParams = new URLSearchParams(window.location.search);
    const OVERVIEW_LAYER = urlParams.get("overviewLayer") || "places_overview";
    const OVERVIEW_ENABLED = urlParams.get("overview") !== "0";
    const PLACES_LAYER = urlParams.get("placesLayer") || "places";
    const POLYGONS_LAYER = urlParams.get("polygonsLayer") || "nz-polygons";
    const BUILDINGS_LAYER = urlParams.get("buildingsLayer") || "buildings";
    const GOOGLE_MAPS_KEY = window.GOOGLE_MAPS_API_KEY || "";
    const MAPTILER_API_KEY = window.MAPTILER_API_KEY || "";
    let googleMapsReady = false;

    const religionColors = [
      "match",
      ["get", "religion"],
      "christian", "#e11d48",
      "muslim", "#16a34a",
      "hindu", "#f97316",
      "buddhist", "#facc15",
      "jewish", "#2563eb",
      "sikh", "#7c3aed",
      "shinto", "#ec4899",
      "taoist", "#06b6d4",
      "#9ca3af"
    ];

    const basemapSelect = document.getElementById("basemapSelect");
    const hasMaptilerKey = Boolean(MAPTILER_API_KEY && !MAPTILER_API_KEY.includes("REPLACE_WITH_MAPTILER_KEY"));
    const cartoStyle = {
      id: "carto-light",
      label: "CARTO Light",
      style: {
        version: 8,
        name: "CARTO Light",
        sources: {
          "carto-light": {
            type: "raster",
            tiles: [
              "https://a.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png",
              "https://b.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png",
              "https://c.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png",
              "https://d.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png"
            ],
            tileSize: 256,
            attribution: "© OpenStreetMap contributors, © CARTO"
          }
        },
        layers: [{ id: "carto-light", type: "raster", source: "carto-light" }]
      }
    };
    const maptilerStyles = hasMaptilerKey
      ? [
          {
            id: "backdrop",
            label: "Backdrop",
            url: `https://api.maptiler.com/maps/backdrop/style.json?key=${encodeURIComponent(MAPTILER_API_KEY)}`
          },
          {
            id: "aquarelle",
            label: "Aquarelle",
            url: `https://api.maptiler.com/maps/aquarelle/style.json?key=${encodeURIComponent(MAPTILER_API_KEY)}`
          },
          {
            id: "dataviz",
            label: "Dataviz",
            url: `https://api.maptiler.com/maps/dataviz/style.json?key=${encodeURIComponent(MAPTILER_API_KEY)}`
          },
          {
            id: "satellite",
            label: "Satellite",
            url: `https://api.maptiler.com/maps/satellite/style.json?key=${encodeURIComponent(MAPTILER_API_KEY)}`
          },
          {
            id: "toner",
            label: "Toner",
            url: `https://api.maptiler.com/maps/toner/style.json?key=${encodeURIComponent(MAPTILER_API_KEY)}`
          },
          {
            id: "topo",
            label: "Topo",
            url: `https://api.maptiler.com/maps/topo/style.json?key=${encodeURIComponent(MAPTILER_API_KEY)}`
          },
          {
            id: "winter",
            label: "Winter",
            url: `https://api.maptiler.com/maps/winter/style.json?key=${encodeURIComponent(MAPTILER_API_KEY)}`
          }
        ]
      : [];
    const basemapOptions = [cartoStyle, ...maptilerStyles];
    const defaultBasemapId = cartoStyle.id;
    let activeBasemapId = defaultBasemapId;

    const map = new maplibregl.Map({
      container: "map",
      style: cartoStyle.style,
      center: WELLINGTON,
      zoom: 4.5,
      pitch: 0,
      bearing: 0,
      projection: "mercator",
      hash: true,
      maxZoom: 18
    });

    map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), "bottom-right");
    map.addControl(new maplibregl.FullscreenControl(), "bottom-right");

    function initBasemapSelect() {
      basemapSelect.innerHTML = "";
      basemapOptions.forEach((style) => {
        const option = document.createElement("option");
        option.value = style.id;
        option.textContent = style.label;
        basemapSelect.appendChild(option);
      });
      basemapSelect.value = defaultBasemapId;
      basemapSelect.addEventListener("change", (event) => {
        const selected = basemapOptions.find((style) => style.id === event.target.value);
        if (selected) {
          activeBasemapId = selected.id;
          map.setStyle(selected.style || selected.url);
          map.once("style.load", () => {
            addCustomLayers();
            updateCounts();
            map.triggerRepaint();
            map.once("idle", ensureCustomLayers);
          });
          setTimeout(() => {
            ensureCustomLayers();
            map.triggerRepaint();
          }, 900);
        }
      });
      basemapSelect.disabled = basemapOptions.length <= 1;
    }

    function loadGoogleMaps() {
      if (googleMapsReady) return Promise.resolve();
      if (!GOOGLE_MAPS_KEY) return Promise.reject(new Error("Missing Google Maps key"));
      if (window.google && window.google.maps) {
        googleMapsReady = true;
        return Promise.resolve();
      }
      return new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(GOOGLE_MAPS_KEY)}`;
        script.async = true;
        script.onload = () => {
          googleMapsReady = true;
          resolve();
        };
        script.onerror = () => reject(new Error("Failed to load Google Maps"));
        document.head.appendChild(script);
      });
    }

    const SOURCES = {
      overview: "pow-overview",
      places: "pow-places",
      polygons: "pow-polygons",
      buildings: "pow-buildings"
    };
    const LAYERS = {
      overview: "pow-overview-points",
      places: "pow-places-points",
      polygonsFill: "pow-polygons-fill",
      polygonsLine: "pow-polygons-line",
      buildingsFill: "pow-buildings-fill",
      buildingsLine: "pow-buildings-line"
    };

    function addOverviewLayer() {
      map.addSource(SOURCES.overview, { type: "vector", tiles: [OVERVIEW_TILES], minzoom: 0, maxzoom: 9 });
      map.addLayer({
        id: LAYERS.overview,
        type: "circle",
        source: SOURCES.overview,
        "source-layer": OVERVIEW_LAYER,
        maxzoom: 9,
        paint: {
          "circle-radius": [
            "interpolate",
            ["linear"],
            ["zoom"],
            0, 2,
            6, 5,
            9, 6
          ],
          "circle-color": religionColors,
          "circle-stroke-width": 0.6,
          "circle-stroke-color": "rgba(10, 11, 14, 0.6)",
          "circle-opacity": [
            "interpolate",
            ["linear"],
            ["zoom"],
            0, 0.75,
            7, 0.75,
            10.5, 0.55,
            12, 0.0
          ]
        }
      });
    }

    let placesHandlersAttached = false;
    function addPlacesLayer() {
      map.addSource(SOURCES.places, { type: "vector", tiles: [PLACES_TILES], minzoom: 6, maxzoom: 18 });
      map.addLayer({
        id: LAYERS.places,
        type: "circle",
        source: SOURCES.places,
        "source-layer": PLACES_LAYER,
        paint: {
          "circle-radius": [
            "interpolate",
            ["linear"],
            ["zoom"],
            6, 2.2,
            10, 4.2,
            16, 6.5
          ],
          "circle-color": religionColors,
          "circle-stroke-width": 0.8,
          "circle-stroke-color": "#0b0c10",
          "circle-opacity": [
            "interpolate",
            ["linear"],
            ["zoom"],
            6, 0.0,
            9, 0.85,
            12, 0.75,
            18, 0.7
          ]
        }
      });

      const hoverPopup = new maplibregl.Popup({
        closeButton: false,
        closeOnClick: false,
        maxWidth: "260px"
      });

      if (placesHandlersAttached) {
        return;
      }
      placesHandlersAttached = true;

      map.on("mousemove", LAYERS.places, (e) => {
        map.getCanvas().style.cursor = "pointer";
        const feature = e.features && e.features[0];
        if (!feature) return;
        const props = feature.properties || {};
        const name = props["name:en"] || props.name_en || props.name || "Unnamed";
        const lat = feature.properties?.lat;
        const lng = feature.properties?.lng;
        const coords = feature.geometry?.coordinates || (lng && lat ? [lng, lat] : null);
        if (!coords) return;
        hoverPopup
          .setLngLat(coords)
          .setHTML(`<div style="font-weight:600;color:#111;">${name}</div>`)
          .addTo(map);
      });

      map.on("mouseleave", LAYERS.places, () => {
        map.getCanvas().style.cursor = "";
        hoverPopup.remove();
      });

      map.on("click", LAYERS.places, async (e) => {
        const feature = e.features && e.features[0];
        if (!feature) return;
        const props = feature.properties || {};
        const name = props["name:en"] || props.name_en || props.name || "Unnamed";
        const lat = feature.properties?.lat;
        const lng = feature.properties?.lng;
        const coords = feature.geometry?.coordinates || (lng && lat ? [lng, lat] : null);
        if (!coords) return;
        const panoId = `pano-${Date.now()}`;
        const latFixed = coords[1].toFixed(6);
        const lngFixed = coords[0].toFixed(6);
        const popup = new maplibregl.Popup({ maxWidth: "720px" })
          .setLngLat(coords)
          .setHTML(
            `<div style="font-weight:600;color:#111;">${name}</div>` +
            `<div class="streetview expanded" id="${panoId}">Loading Street View…</div>` +
            `<div class="streetview-toolbar">` +
            `<button type="button" data-mode="interior" data-pano="${panoId}">Interior</button>` +
            `<button type="button" data-mode="expand" data-pano="${panoId}">Collapse</button>` +
            `</div>` +
            `<div class="popup-actions">` +
            `<a href="https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${latFixed},${lngFixed}" target="_blank" rel="noopener">Open Street View</a>` +
            `<a href="https://www.openstreetmap.org/?mlat=${latFixed}&mlon=${lngFixed}#map=18/${latFixed}/${lngFixed}" target="_blank" rel="noopener">Open OSM</a>` +
            `<button type="button" data-copy="${latFixed},${lngFixed}">Copy coords</button>` +
            `</div>`
          )
          .addTo(map);

        const panoContainer = () => document.getElementById(panoId);
        if (!GOOGLE_MAPS_KEY) {
          const node = panoContainer();
          if (node) node.textContent = "Street View unavailable.";
          return;
        }
        try {
          await loadGoogleMaps();
          const node = panoContainer();
          if (!node) return;
          const sv = new google.maps.StreetViewService();
          let panoInstance = null;
          let currentSource = "OUTDOOR";
          const popupEl = popup.getElement();
          const expandButton = popupEl.querySelector(`[data-mode="expand"][data-pano="${panoId}"]`);
          const interiorButton = popupEl.querySelector(`[data-mode="interior"][data-pano="${panoId}"]`);

          function resizePanorama() {
            if (panoInstance && window.google?.maps?.event) {
              window.google.maps.event.trigger(panoInstance, "resize");
            }
          }

          function setMessage(message) {
            const target = panoContainer();
            if (target) target.textContent = message;
          }

          function loadPanorama(source) {
            const target = panoContainer();
            if (!target) return;
            target.textContent = "Loading Street View…";
            const request = {
              location: { lat: coords[1], lng: coords[0] },
              radius: 150,
              source: google.maps.StreetViewSource[source] || google.maps.StreetViewSource.DEFAULT
            };
            sv.getPanorama(request, (data, status) => {
              if (status === "OK") {
                currentSource = source;
                panoInstance = new google.maps.StreetViewPanorama(target, {
                  position: { lat: coords[1], lng: coords[0] },
                  pov: { heading: 0, pitch: 0 },
                  zoom: 1,
                  addressControl: false,
                  fullscreenControl: false,
                  motionTracking: false,
                  showRoadLabels: false
                });
                resizePanorama();
              } else if (source === "OUTDOOR") {
                setMessage("No outdoor Street View. Try Interior.");
              } else {
                setMessage("No Street View for this location.");
              }
            });
          }

          if (expandButton) {
            expandButton.addEventListener("click", () => {
              const target = panoContainer();
              if (!target) return;
              const expanded = target.classList.toggle("expanded");
              expandButton.textContent = expanded ? "Collapse" : "Expand";
              resizePanorama();
            });
          }

          if (interiorButton) {
            interiorButton.addEventListener("click", () => {
              const next = currentSource === "OUTDOOR" ? "DEFAULT" : "OUTDOOR";
              interiorButton.textContent = next === "DEFAULT" ? "Exterior" : "Interior";
              loadPanorama(next);
            });
          }
          const copyButton = popupEl.querySelector(`[data-copy]`);
          if (copyButton) {
            copyButton.addEventListener("click", async () => {
              const value = copyButton.getAttribute("data-copy");
              try {
                await navigator.clipboard.writeText(value || "");
                copyButton.textContent = "Copied";
                setTimeout(() => {
                  copyButton.textContent = "Copy coords";
                }, 1200);
              } catch (error) {
                copyButton.textContent = "Copy failed";
                setTimeout(() => {
                  copyButton.textContent = "Copy coords";
                }, 1200);
              }
            });
          }

          loadPanorama("OUTDOOR");
        } catch (error) {
          const node = panoContainer();
          if (node) node.textContent = "Street View failed to load.";
        }
      });
    }

    function addPolygonsLayer() {
      map.addSource(SOURCES.polygons, { type: "vector", tiles: [POLYGONS_TILES], minzoom: 2, maxzoom: 14 });
      map.addLayer({
        id: LAYERS.polygonsFill,
        type: "fill",
        source: SOURCES.polygons,
        "source-layer": POLYGONS_LAYER,
        paint: { "fill-color": "rgba(125, 211, 252, 0.10)", "fill-outline-color": "rgba(255,255,255,0.05)" }
      });
      map.addLayer({
        id: LAYERS.polygonsLine,
        type: "line",
        source: SOURCES.polygons,
        "source-layer": POLYGONS_LAYER,
        paint: { "line-color": "rgba(255,255,255,0.25)", "line-width": 0.6 }
      });
    }

    function addBuildingsLayer() {
      map.addSource(SOURCES.buildings, { type: "vector", tiles: [BUILDINGS_TILES], minzoom: 10, maxzoom: 18 });
      map.addLayer({
        id: LAYERS.buildingsFill,
        type: "fill",
        source: SOURCES.buildings,
        "source-layer": BUILDINGS_LAYER,
        minzoom: 10,
        paint: {
          "fill-color": "rgba(15, 23, 42, 0.12)",
          "fill-outline-color": "rgba(15, 23, 42, 0.25)"
        }
      });
      map.addLayer({
        id: LAYERS.buildingsLine,
        type: "line",
        source: SOURCES.buildings,
        "source-layer": BUILDINGS_LAYER,
        minzoom: 10,
        paint: {
          "line-color": "rgba(15, 23, 42, 0.35)",
          "line-width": 0.6
        }
      });
    }

    function addCustomLayers() {
      Object.values(LAYERS).forEach((id) => {
        if (map.getLayer(id)) {
          map.removeLayer(id);
        }
      });
      Object.values(SOURCES).forEach((id) => {
        if (map.getSource(id)) {
          map.removeSource(id);
        }
      });
      if (OVERVIEW_ENABLED) {
        addOverviewLayer();
      }
      addPolygonsLayer();
      addBuildingsLayer();
      addPlacesLayer();
    }

    function ensureCustomLayers() {
      if (!map.isStyleLoaded()) return;
      if (!map.getLayer(LAYERS.places) && !map.getLayer(LAYERS.overview)) {
        addCustomLayers();
        updateCounts();
      }
    }

    map.on("style.load", () => {
      addCustomLayers();
      updateCounts();
      setTimeout(ensureCustomLayers, 350);
    });

    map.on("load", () => {
      initBasemapSelect();
      updateCounts();
    });

    map.on("error", (e) => {
      const message = e && e.error && e.error.message ? e.error.message : "";
      if (activeBasemapId !== "carto-light" && message.includes("api.maptiler.com")) {
        activeBasemapId = "carto-light";
        basemapSelect.value = "carto-light";
        map.setStyle(cartoStyle.style);
      }
    });

    const cityChips = document.getElementById("cityChips");
    const searchInput = document.getElementById("searchInput");
    const searchButton = document.getElementById("searchButton");
    const cityPresets = [
      { label: "Wellington", coords: [174.7762, -41.2865], zoom: 10 },
      { label: "LA", coords: [-118.2437, 34.0522], zoom: 9 },
      { label: "NYC", coords: [-74.006, 40.7128], zoom: 9 },
      { label: "London", coords: [-0.1276, 51.5072], zoom: 9 },
      { label: "Jerusalem", coords: [35.2137, 31.7683], zoom: 11 },
      { label: "Singapore", coords: [103.8198, 1.3521], zoom: 11 }
    ];

    function flyTo(coords, zoom) {
      map.flyTo({ center: coords, zoom: zoom || 10, speed: 1.2, curve: 1.4 });
    }

    cityPresets.forEach((city) => {
      const chip = document.createElement("button");
      chip.className = "dock-chip";
      chip.textContent = city.label;
      chip.addEventListener("click", () => flyTo(city.coords, city.zoom));
      cityChips.appendChild(chip);
    });


    async function geocode(query) {
      const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`;
      const response = await fetch(url, { headers: { "Accept": "application/json" } });
      if (!response.ok) throw new Error("Geocoding failed");
      const results = await response.json();
      return results && results.length ? results[0] : null;
    }

    async function runSearch() {
      const query = searchInput.value.trim();
      if (!query) return;
      try {
        const result = await geocode(query);
        if (!result) {
          return;
        }
        const lon = parseFloat(result.lon);
        const lat = parseFloat(result.lat);
        flyTo([lon, lat], 13);
      } catch (error) {
      }
    }

    searchButton.addEventListener("click", runSearch);
    searchInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        runSearch();
      }
    });

    const countsPanel = document.getElementById("counts");
    const countsList = document.getElementById("countsList");
    const countsTotal = document.getElementById("countsTotal");
    const countLabels = [
      { key: "christian", label: "Christian", color: "#e11d48" },
      { key: "muslim", label: "Muslim", color: "#16a34a" },
      { key: "hindu", label: "Hindu", color: "#f97316" },
      { key: "buddhist", label: "Buddhist", color: "#facc15" },
      { key: "jewish", label: "Jewish", color: "#2563eb" },
      { key: "sikh", label: "Sikh", color: "#7c3aed" },
      { key: "shinto", label: "Shinto", color: "#ec4899" },
      { key: "taoist", label: "Taoist", color: "#06b6d4" },
      { key: "unknown", label: "Unknown", color: "#9ca3af" }
    ];
    let countsScheduled = false;

    function updateCounts() {
      if (!map.isStyleLoaded()) return;
      if (countsScheduled) return;
      countsScheduled = true;
      requestAnimationFrame(() => {
        countsScheduled = false;
        const zoom = map.getZoom();
        if (zoom < 4) {
          countsPanel.style.display = "none";
          return;
        }
        countsPanel.style.display = "block";
        const layerId = zoom < 9 ? LAYERS.overview : LAYERS.places;
        if (!map.getLayer(layerId)) return;
        const features = map.queryRenderedFeatures({ layers: [layerId] });
        const counts = {
          christian: 0,
          muslim: 0,
          hindu: 0,
          buddhist: 0,
          jewish: 0,
          sikh: 0,
          shinto: 0,
          taoist: 0,
          unknown: 0
        };
        features.forEach((feature) => {
          const key = feature.properties?.religion || "unknown";
          if (counts[key] === undefined) {
            counts.unknown += 1;
          } else {
            counts[key] += 1;
          }
        });
        countsList.innerHTML = "";
        let total = 0;
        countLabels.forEach(({ key, label, color }) => {
          const value = counts[key] || 0;
          total += value;
          const item = document.createElement("li");
          item.innerHTML =
            `<span class="legend"><span class="dot" style="background:${color}"></span>${label}</span>` +
            `<span>${value.toLocaleString()}</span>`;
          countsList.appendChild(item);
        });
        countsTotal.textContent = `Total: ${total.toLocaleString()}`;
      });
    }

    map.on("moveend", () => {
      updateCounts();
      ensureCustomLayers();
    });
    map.on("zoomend", () => {
      updateCounts();
      ensureCustomLayers();
    });



  </script>
</body>
</html>
