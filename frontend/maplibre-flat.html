<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Places of Worship | MapLibre Flat Prototype</title>
  <link href="https://unpkg.com/maplibre-gl@3.6.1/dist/maplibre-gl.css" rel="stylesheet">
  <style>
    :root {
      --bg: #f8fafc;
      --panel: rgba(13, 16, 23, 0.82);
      --text: #e8edf2;
      --accent: #cbd5f5;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; }
    body, html { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: "Work Sans", -apple-system, "Segoe UI", sans-serif; }
    #map { position: fixed; inset: 0; }
    #hud {
      position: fixed; top: 12px; left: 12px; right: 12px; max-width: 520px;
      padding: 14px 16px; background: var(--panel); border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px; backdrop-filter: blur(12px); box-shadow: 0 8px 30px rgba(0,0,0,0.25); z-index: 10;
    }
    #hud h1 { margin: 0 0 4px; font-weight: 600; letter-spacing: -0.02em; font-size: 18px; }
    #hud p { margin: 0 0 10px; color: var(--muted); font-size: 13px; line-height: 1.4; }
    #hud .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    #hud button {
      background: var(--accent); color: #0b0c10; border: none; border-radius: 10px; padding: 9px 12px;
      font-weight: 700; cursor: pointer; transition: transform 120ms ease, box-shadow 120ms ease; font-size: 13px;
    }
    #hud button.secondary { background: rgba(255,255,255,0.08); color: var(--text); }
    #hud button:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(0,0,0,0.25); }
    #legend { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; }
    .chip {
      display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted);
      background: rgba(255,255,255,0.05); padding: 6px 10px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.06);
    }
    .chip i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; }
    #dock {
      position: fixed; left: 12px; right: auto; bottom: 6px;
      display: flex; flex-direction: column; gap: 6px; z-index: 11;
      width: min(94vw, 560px);
      max-width: 94vw;
    }
    .dock-panel {
      background: rgba(15, 23, 42, 0.62); border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px; padding: 6px 8px; backdrop-filter: blur(10px);
      box-shadow: 0 8px 18px rgba(0,0,0,0.24);
      width: 100%;
      opacity: 0.95;
    }
    .dock-row { display: flex; gap: 6px; flex-wrap: nowrap; align-items: center; min-height: 24px; width: 100%; }
    .dock-row input {
      flex: 1 1 auto; min-width: 0; background: rgba(255,255,255,0.08); border: 1px solid transparent;
      color: var(--text); padding: 6px 8px; border-radius: 8px; font-size: clamp(9px, 2vw, 11px);
    }
    .dock-row select {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--text);
      padding: 2px 6px;
      border-radius: 8px;
      font-size: clamp(8px, 1.8vw, 9px);
      min-width: 104px;
      flex-shrink: 0;
    }
    .dock-row input::placeholder { color: rgba(226,232,240,0.6); }
    .dock-row button {
      background: rgba(226, 232, 240, 0.16); color: #e2e8f0; border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px; padding: 3px 7px; font-weight: 700; cursor: pointer;
      transition: transform 120ms ease, box-shadow 120ms ease; font-size: clamp(9px, 2vw, 10px);
    }
    .dock-row button.secondary { background: rgba(255,255,255,0.12); color: var(--text); }
    .dock-row button:hover { transform: translateY(-1px); box-shadow: 0 8px 16px rgba(0,0,0,0.3); }
    .dock-cities-row { align-items: center; }
    .dock-cities {
      display: flex;
      gap: 6px;
      flex-wrap: nowrap;
      width: 100%;
      overflow-x: auto;
      padding-bottom: 2px;
      flex: 1;
      scrollbar-width: none;
      scrollbar-color: transparent transparent;
    }
    .dock-cities::-webkit-scrollbar {
      display: none;
      height: 0;
      background: transparent;
    }
    }
    .dock-chip {
      background: rgba(148,163,184,0.14); color: var(--text); border: 1px solid rgba(255,255,255,0.05);
      padding: 2px 6px; border-radius: 999px; font-size: clamp(7px, 1.8vw, 8.5px); cursor: pointer;
      transition: transform 120ms ease, background 120ms ease;
    }
    .dock-chip:hover { transform: translateY(-1px); background: rgba(148,163,184,0.28); }
    .dock-row + .dock-row { margin-top: 4px; }
    .streetview {
      width: min(380px, 70vw);
      height: min(240px, 32vh);
      min-width: 260px;
      min-height: 160px;
      max-width: 90vw;
      max-height: 72vh;
      border-radius: 10px;
      overflow: hidden;
      background: rgba(15, 23, 42, 0.8);
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      margin-top: 8px;
      resize: both;
      position: relative;
      cursor: default;
      touch-action: none;
    }
    .streetview.expanded {
      width: min(640px, 86vw);
      height: min(420px, 60vh);
    }
    .maplibregl-popup-content {
      max-width: min(720px, 88vw);
    }
    .streetview-toolbar {
      display: flex;
      justify-content: space-between;
      margin-top: 6px;
      gap: 8px;
    }
    .streetview-toolbar button {
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(15, 23, 42, 0.35);
      color: #0b0c10;
      border-radius: 8px;
      padding: 5px 8px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }
    .popup-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .popup-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 6px;
      cursor: grab;
      user-select: none;
    }
    .popup-header.dragging { cursor: grabbing; }
    .popup-title {
      font-weight: 600;
      color: #111;
      font-size: 14px;
    }
    .popup-actions a,
    .popup-actions button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 5px 8px;
      border-radius: 8px;
      border: 1px solid rgba(0,0,0,0.1);
      background: rgba(15, 23, 42, 0.08);
      color: #111;
      font-size: 11px;
      text-decoration: none;
      cursor: pointer;
    }
    .sv-resize-handle {
      position: absolute;
      right: 6px;
      bottom: 6px;
      width: 18px;
      height: 18px;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(255,255,255,0.55);
      border-radius: 5px;
      cursor: nwse-resize;
      z-index: 3;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
      display: grid;
      place-items: center;
      color: #e2e8f0;
      font-size: 11px;
      line-height: 1;
      font-weight: 700;
      user-select: none;
      pointer-events: auto;
    }
    #corner-link {
      position: fixed;
      right: 12px;
      bottom: 6px;
      z-index: 11;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255,255,255,0.06);
      color: #e2e8f0;
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 9px;
      text-decoration: none;
      opacity: 0.85;
    }
    #corner-reset {
      position: fixed;
      left: 50%;
      bottom: 6px;
      transform: translateX(-50%);
      z-index: 11;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255,255,255,0.06);
      color: #e2e8f0;
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 9px;
      text-decoration: none;
      opacity: 0.85;
      cursor: pointer;
    }
    #tile-status {
      position: fixed;
      left: 50%;
      top: 10px;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.72);
      border: 1px solid rgba(255,255,255,0.08);
      color: #e2e8f0;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 9px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 200ms ease;
      z-index: 11;
    }
    #tile-status.visible { opacity: 0.9; }
    #corner-link {
      position: fixed;
      right: 12px;
      bottom: 10px;
      z-index: 11;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255,255,255,0.08);
      color: #e2e8f0;
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 10px;
      text-decoration: none;
      opacity: 0.9;
    }
    #dock-toggle {
      position: fixed;
      left: 12px;
      top: 12px;
      z-index: 12;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(15,23,42,0.7);
      color: #e2e8f0;
      font-size: 10px;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(0,0,0,0.25);
    }
    #mobile-search-toggle {
      position: fixed;
      left: 12px;
      bottom: 12px;
      z-index: 12;
      padding: 6px 8px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(15,23,42,0.7);
      color: #e2e8f0;
      font-size: 10px;
      cursor: pointer;
      display: none;
      box-shadow: 0 8px 16px rgba(0,0,0,0.28);
    }
    #counts {
      position: fixed;
      right: 12px;
      top: 12px;
      z-index: 11;
      background: rgba(15, 23, 42, 0.62);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px;
      padding: 6px 8px;
      font-size: 10px;
      color: #e2e8f0;
      min-width: 118px;
    }
    #counts h3 {
      margin: 0 0 6px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.01em;
    }
    #counts ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 3px;
    }
    #counts li {
      display: flex;
      justify-content: space-between;
      gap: 6px;
      color: #cbd5f5;
      align-items: center;
    }
    #counts .legend {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    #counts .dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.25);
    }
    #counts .count-total {
      margin-top: 6px;
      font-weight: 600;
      color: #f1f5f9;
    }
    .maplibregl-ctrl-bottom-right { bottom: 56px; }
    .compass-btn {
      position: fixed;
      right: 12px;
      top: 12px;
      z-index: 12;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(15,23,42,0.7);
      color: #e2e8f0;
      font-size: 11px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 14px rgba(0,0,0,0.25);
    }
    .compass-btn.hidden { display: none !important; }
    @media (max-width: 640px) {
      #hud { max-width: 94vw; }
      #dock { display: none !important; }
      #corner-link { right: 12px; bottom: 10px; }
      .maplibregl-ctrl-bottom-right { bottom: 80px; }
      #counts { display: none !important; }
      #basemapSelect { display: none; }
      #cityChips { display: none; }
      .dock-row { gap: 4px; }
      .dock-row input { padding: 4px 6px; font-size: clamp(7px, 2vw, 8px); }
      .dock-row button { padding: 3px 6px; font-size: clamp(7px, 2vw, 8px); }
      .dock-cities { gap: 4px; }
      .dock-chip { font-size: clamp(6px, 1.4vw, 7px); padding: 2px 4px; }
      #mobile-search-toggle { display: none; }
      #corner-link { display: none; }
      #dock-toggle { display: none; }
      .maplibregl-ctrl { transform: scale(0.85); transform-origin: bottom right; }
      #corner-reset { display: block; }
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="tile-status">Loading tiles…</div>
  <a id="corner-link" href="https://go-bayes.github.io/places-of-worship/enhanced-places.html">Data Link (NZ)</a>
  <button id="corner-reset" type="button">Reset North</button>
  <button id="compassBtn" class="compass-btn" title="Reset bearing">N</button>
  <button id="dock-toggle" type="button">Search / Places</button>
  <button id="mobile-search-toggle" type="button">Search</button>
  <div id="counts">
    <h3>Visible Places</h3>
    <ul id="countsList"></ul>
    <div class="count-total" id="countsTotal">Total: 0</div>
  </div>
    <div id="dock">
      <div class="dock-panel">
        <div class="dock-row">
          <input id="searchInput" type="text" placeholder="Search an address or place (prototype)">
          <button id="searchButton">Search</button>
        </div>
        <div class="dock-row dock-cities-row">
          <div class="dock-cities" id="cityChips"></div>
          <select id="basemapSelect"></select>
        </div>
    </div>
  </div>

  <script src="config.public.js"></script>
  <script src="config.js"></script>
  <script src="https://unpkg.com/maplibre-gl@3.6.1/dist/maplibre-gl.js"></script>
  <script>
    if (!window.maplibregl) {
      throw new Error("MapLibre missing");
    }
    const showStatus = () => {};

    const CONFIG = {
      center: [174.7762, -41.2865],
      initialZoom: 4.5,
      streetViewMinZoom: 14,
      streetViewFailDelayMs: 1200,
      mobileMinZoom: 3.0,
      tiles: {
        overview: "https://tiles.placemap.org/places-overview/{z}/{x}/{y}",
        places: "https://tiles.placemap.org/places/{z}/{x}/{y}",
        polygons: "https://tiles.placemap.org/nz-polygons/{z}/{x}/{y}",
        buildings: "https://tiles.placemap.org/buildings/{z}/{x}/{y}"
      },
      layerDefaults: {
        overview: "places_overview",
        places: "places",
        polygons: "nz-polygons",
        buildings: "buildings"
      }
    };

    const urlParams = new URLSearchParams(window.location.search);
    const OVERVIEW_LAYER = urlParams.get("overviewLayer") || CONFIG.layerDefaults.overview;
    const OVERVIEW_ENABLED = urlParams.get("overview") !== "0";
    const PLACES_LAYER = urlParams.get("placesLayer") || CONFIG.layerDefaults.places;
    const POLYGONS_LAYER = urlParams.get("polygonsLayer") || CONFIG.layerDefaults.polygons;
    const BUILDINGS_LAYER = urlParams.get("buildingsLayer") || CONFIG.layerDefaults.buildings;
    const GOOGLE_MAPS_KEY = window.GOOGLE_MAPS_API_KEY || "";
    const MAPTILER_API_KEY = window.MAPTILER_API_KEY || "";
    let googleMapsReady = false;
    const IS_MOBILE = window.matchMedia && window.matchMedia("(max-width: 640px)").matches;

    function prewarmStreetView() {
      if (!GOOGLE_MAPS_KEY) return;
      loadGoogleMaps()
        .then(() => {
          if (!window.google?.maps) return;
          const sv = new google.maps.StreetViewService();
          sv.getPanorama(
            { location: { lat: CONFIG.center[1], lng: CONFIG.center[0] }, radius: 400, source: google.maps.StreetViewSource.OUTDOOR },
            () => {}
          );
        })
        .catch(() => {});
    }

    const religionColors = [
      "match",
      ["get", "religion"],
      "christian", "#e11d48",
      "muslim", "#16a34a",
      "hindu", "#f97316",
      "buddhist", "#facc15",
      "jewish", "#2563eb",
      "sikh", "#7c3aed",
      "shinto", "#ec4899",
      "taoist", "#06b6d4",
      "#9ca3af"
    ];

    const basemapSelect = document.getElementById("basemapSelect");
    const hasMaptilerKey = Boolean(MAPTILER_API_KEY && !MAPTILER_API_KEY.includes("REPLACE_WITH_MAPTILER_KEY"));
    const cartoStyle = {
      id: "carto-light",
      label: "CARTO Light",
      style: {
        version: 8,
        name: "CARTO Light",
        sources: {
          "carto-light": {
            type: "raster",
            tiles: [
              "https://a.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png",
              "https://b.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png",
              "https://c.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png",
              "https://d.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png"
            ],
            tileSize: 256,
            attribution: "© OpenStreetMap contributors, © CARTO"
          }
        },
        layers: [{ id: "carto-light", type: "raster", source: "carto-light" }]
      }
    };
    const maptilerStyles = hasMaptilerKey
      ? [
          {
            id: "backdrop",
            label: "Backdrop",
            url: `https://api.maptiler.com/maps/backdrop/style.json?key=${encodeURIComponent(MAPTILER_API_KEY)}`
          },
          {
      id: "streets",
      label: "Streets",
      url: `https://api.maptiler.com/maps/streets/style.json?key=${encodeURIComponent(MAPTILER_API_KEY)}`
    },
          {
            id: "aquarelle",
            label: "Aquarelle",
            url: `https://api.maptiler.com/maps/aquarelle/style.json?key=${encodeURIComponent(MAPTILER_API_KEY)}`
          },
          {
            id: "dataviz",
            label: "Dataviz",
            url: `https://api.maptiler.com/maps/dataviz/style.json?key=${encodeURIComponent(MAPTILER_API_KEY)}`
          },
          {
            id: "satellite",
            label: "Satellite",
            url: `https://api.maptiler.com/maps/satellite/style.json?key=${encodeURIComponent(MAPTILER_API_KEY)}`
          },
          {
            id: "toner",
            label: "Toner",
            url: `https://api.maptiler.com/maps/toner/style.json?key=${encodeURIComponent(MAPTILER_API_KEY)}`
          },
          {
            id: "topo",
            label: "Topo",
            url: `https://api.maptiler.com/maps/topo/style.json?key=${encodeURIComponent(MAPTILER_API_KEY)}`
          },
          {
      id: "winter",
      label: "Winter",
      url: `https://api.maptiler.com/maps/winter/style.json?key=${encodeURIComponent(MAPTILER_API_KEY)}`
    }
  ]
: [];
    const basemapOptions = [cartoStyle, ...maptilerStyles];
    const defaultBasemapId = hasMaptilerKey ? "backdrop" : cartoStyle.id;
    let activeBasemapId = defaultBasemapId;

    const initialBasemap = basemapOptions.find((s) => s.id === defaultBasemapId) || cartoStyle;
    const initialStyle = initialBasemap.style || initialBasemap.url || cartoStyle.style;

    function nudgeMap() {
      if (!map || !map.isStyleLoaded()) return;
      const center = map.getCenter();
      const zoom = map.getZoom();
      map.jumpTo({ center, zoom: zoom + 0.00001 });
      map.jumpTo({ center, zoom });
      map.triggerRepaint();
    }

    function refreshMapLayers() {
      ensureCustomLayers();
      updateCounts();
      nudgeMap();
      map.triggerRepaint();
      setTimeout(() => {
        ensureCustomLayers();
        map.triggerRepaint();
      }, 280);
    }

    const map = new maplibregl.Map({
      container: "map",
      style: initialStyle,
      center: CONFIG.center,
      zoom: CONFIG.initialZoom,
      pitch: 0,
      bearing: 0,
      projection: "mercator",
      hash: true,
      maxZoom: 18,
      minZoom: IS_MOBILE ? CONFIG.mobileMinZoom : 0
    });

    if (!IS_MOBILE) {
      map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), "bottom-right");
      map.addControl(new maplibregl.FullscreenControl(), "bottom-right");
    }

    let pinnedLabel = null;
    let pinnedTimer = null;
    function showPinnedLabel(name, coords) {
      if (!pinnedLabel) {
        pinnedLabel = new maplibregl.Popup({
          closeButton: false,
          closeOnClick: false,
          maxWidth: "260px",
          className: "pinned-label"
        });
      }
      pinnedLabel
        .setLngLat(coords)
        .setHTML(`<div style="font-weight:600;color:#111;">${name}</div>`)
        .addTo(map);
      if (pinnedTimer) clearTimeout(pinnedTimer);
      pinnedTimer = setTimeout(() => pinnedLabel.remove(), 2200);
    }

    function initBasemapSelect() {
      basemapSelect.innerHTML = "";
      basemapOptions.forEach((style) => {
        const option = document.createElement("option");
        option.value = style.id;
        option.textContent = style.label;
        basemapSelect.appendChild(option);
      });
      basemapSelect.value = defaultBasemapId;
      // No need to setStyle here; initial style is already chosen above.
      basemapSelect.addEventListener("change", (event) => {
        const selected = basemapOptions.find((style) => style.id === event.target.value);
        if (selected) {
          activeBasemapId = selected.id;
          map.setStyle(selected.style || selected.url);
          map.once("style.load", () => {
            addCustomLayers();
            updateCounts();
            map.triggerRepaint();
            map.once("idle", () => {
              ensureCustomLayers();
              const center = map.getCenter();
              const zoom = map.getZoom();
              map.jumpTo({ center, zoom: zoom + 0.00001 });
              map.jumpTo({ center, zoom });
              refreshMapLayers();
            });
          });
          setTimeout(() => {
            ensureCustomLayers();
            map.triggerRepaint();
            nudgeMap();
            refreshMapLayers();
          }, 900);
        }
      });
      basemapSelect.disabled = basemapOptions.length <= 1;
    }

    function loadGoogleMaps() {
      if (googleMapsReady) return Promise.resolve();
      if (!GOOGLE_MAPS_KEY) return Promise.reject(new Error("Missing Google Maps key"));
      if (window.google && window.google.maps) {
        googleMapsReady = true;
        return Promise.resolve();
      }
      return new Promise((resolve, reject) => {
        const script = document.createElement("script");

          resolve();
        };
        script.onerror = () => reject(new Error("Failed to load Google Maps"));
        document.head.appendChild(script);
      });
    }

        if (currentZoom < CONFIG.streetViewMinZoom) {

            .setLngLat(coords)
            .setHTML(
              `<div class="popup-header"><span class="popup-title">${name}</span></div>` +

        if (IS_MOBILE) {
          new maplibregl.Popup({ maxWidth: "340px", closeOnClick: true })
            .setLngLat(coords)
            .setHTML(
              `<div class="popup-header"><span class="popup-title">${name}</span></div>` +
              `<div class="popup-actions" style="margin-top:6px;">` +
              `<a href="https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${latFixed},${lngFixed}" target="_blank" rel="noopener">Open Street View</a>` +
              `<a href="https://www.openstreetmap.org/?mlat=${latFixed}&mlon=${lngFixed}#map=18/${latFixed}/${lngFixed}" target="_blank" rel="noopener">Open OSM</a>` +
              `<button type="button" data-copy="${latFixed},${lngFixed}">Copy coords</button>` +
              `</div>`
            )
            .addTo(map);
          return;
        }
        const popup = new maplibregl.Popup({ maxWidth: "720px", closeOnClick: true })
          .setLngLat(coords)
          .setHTML(
            `<div class="popup-header" data-drag-handle="true">` +
            `<span class="popup-title">${name}</span>` +
            `<span style="font-size:11px;color:#64748b;">Drag</span>` +
            `</div>` +
            `<div class="streetview" id="${panoId}">Loading Street View…</div>` +
            `<div class="streetview-toolbar">` +
            `<button type="button" data-mode="interior" data-pano="${panoId}">Interior</button>` +
            `<button type="button" data-mode="expand" data-pano="${panoId}">Expand</button>` +
            `</div>` +
            `<div class="popup-actions">` +
            `<a href="https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${latFixed},${lngFixed}" target="_blank" rel="noopener">Open Street View</a>` +
            `<a href="https://www.openstreetmap.org/?mlat=${latFixed}&mlon=${lngFixed}#map=18/${latFixed}/${lngFixed}" target="_blank" rel="noopener">Open OSM</a>` +

        const panoContainer = () => document.getElementById(panoId);
        const popupContent = popup.getElement();
        const dragHandle = popupContent.querySelector("[data-drag-handle]");
        if (dragHandle) {
          const mapCanvas = map.getCanvas();
          let dragging = false;
          let startX = 0;
          let startY = 0;

          dragHandle.addEventListener("mousedown", (event) => {
            dragging = true;
            dragHandle.classList.add("dragging");
            startX = event.clientX;
            startY = event.clientY;
            mapCanvas.style.cursor = "grabbing";
            if (map.dragPan) map.dragPan.disable();
            document.body.style.userSelect = "none";
            event.stopPropagation();
            event.preventDefault();
          });

          window.addEventListener("mousemove", (event) => {
            if (!dragging) return;
            const dx = event.clientX - startX;
            const dy = event.clientY - startY;
            startX = event.clientX;
            startY = event.clientY;
            const current = map.project(popup.getLngLat());
            const next = { x: current.x + dx, y: current.y + dy };
            const nextLngLat = map.unproject(next);
            popup.setLngLat(nextLngLat);
          });

          window.addEventListener("mouseup", () => {
            if (!dragging) return;
            dragging = false;
            dragHandle.classList.remove("dragging");
            mapCanvas.style.cursor = "";
            if (map.dragPan) map.dragPan.enable();
            document.body.style.userSelect = "";
          });
        }
        if (!GOOGLE_MAPS_KEY) {
          const node = panoContainer();
          if (node) node.textContent = "Street View unavailable.";
          return;
        }
        try {
          await loadGoogleMaps();
          const node = panoContainer();
          if (!node) return;
          const sv = new google.maps.StreetViewService();
          let panoInstance = null;
          let currentSource = "OUTDOOR";
          const popupEl = popup.getElement();
          const expandButton = popupEl.querySelector(`[data-mode="expand"][data-pano="${panoId}"]`);
          const interiorButton = popupEl.querySelector(`[data-mode="interior"][data-pano="${panoId}"]`);
          const interiorAltButton = popupEl.querySelector(`[data-mode="interior-alt"][data-pano="${panoId}"]`);
          let panoLoading = false;
          let lastPanoRequest = 0;
          let resizeObserver = null;
          let pendingFailTimer = null;

          if (currentZoom < CONFIG.streetViewMinZoom) {
            node.textContent = `Zoom closer (zoom ${CONFIG.streetViewMinZoom}+) to load Street View.`;
            return;
          }

          function attachResizeHandle(target) {
            if (!target || target.querySelector(".sv-resize-handle")) return;
            const handle = document.createElement("div");
            handle.className = "sv-resize-handle";
            handle.textContent = "↘";
            target.appendChild(handle);
            const MIN_W = 260;
            const MIN_H = 160;
            handle.addEventListener("mousedown", (event) => {
              event.preventDefault();
              event.stopPropagation();
              handle.style.cursor = "nwse-resize";
              const startX = event.clientX;
              const startY = event.clientY;
              const rect = target.getBoundingClientRect();
              const startW = rect.width;
              const startH = rect.height;

              function onMove(e) {
                const deltaX = e.clientX - startX;
                const deltaY = e.clientY - startY;
                const nextW = Math.min(window.innerWidth * 0.9, Math.max(MIN_W, startW + deltaX));
                const nextH = Math.min(window.innerHeight * 0.72, Math.max(MIN_H, startH + deltaY));
                target.style.width = `${nextW}px`;
                target.style.height = `${nextH}px`;
                resizePanorama();
              }
              function onUp() {
                window.removeEventListener("mousemove", onMove);
                window.removeEventListener("mouseup", onUp);
                handle.style.cursor = "nwse-resize";
              }
              window.addEventListener("mousemove", onMove);
              window.addEventListener("mouseup", onUp);
            });
          }

          function resizePanorama() {
            if (panoInstance && window.google?.maps?.event) {
              window.google.maps.event.trigger(panoInstance, "resize");
            }
          }

          function watchResize() {
            const target = panoContainer();
            if (!target || typeof ResizeObserver === "undefined") return;
            if (resizeObserver) resizeObserver.disconnect();
            resizeObserver = new ResizeObserver(() => resizePanorama());
            resizeObserver.observe(target);
          }

          function setMessage(message) {
            const target = panoContainer();
            if (target) target.textContent = message;
          }

          function loadPanorama(source, attempt = 0) {
            const target = panoContainer();
            if (!target) return;
            if (pendingFailTimer) {
              clearTimeout(pendingFailTimer);
              pendingFailTimer = null;
            }
            const now = Date.now();
            lastPanoRequest = now;
            target.textContent = "Loading Street View…";
            const radius = attempt === 0 ? 400 : 800;
            const request = {
              location: { lat: coords[1], lng: coords[0] },
              radius,
              source: google.maps.StreetViewSource[source] || google.maps.StreetViewSource.DEFAULT
            };
            sv.getPanorama(request, (data, status) => {
              if (pendingFailTimer) {
                clearTimeout(pendingFailTimer);
                pendingFailTimer = null;
              }
              if (status === "OK") {
                currentSource = source;
                if (interiorAltButton) {
                  interiorAltButton.textContent = source === "OUTDOOR" ? "Try Interior" : "Try Exterior";
                }
                panoInstance = new google.maps.StreetViewPanorama(target, {
                  position: { lat: coords[1], lng: coords[0] },
                  pov: { heading: 0, pitch: 0 },
                  zoom: 1,
                  addressControl: false,
                  fullscreenControl: false,
                  motionTracking: false,
                  showRoadLabels: false
                });
                resizePanorama();
              } else {
                if (attempt === 0) {
                  // Fallback: broaden search and switch source if we started outdoors.
                  const nextSource = source === "OUTDOOR" ? "DEFAULT" : "OUTDOOR";
                  loadPanorama(nextSource, attempt + 1);
                  return;
                }
                pendingFailTimer = setTimeout(() => {
                  if (source === "OUTDOOR") {
                    setMessage("No outdoor Street View. Use “Try Interior”.");
                  } else {
                    setMessage("No Street View for this location.");
                  }
                }, CONFIG.streetViewFailDelayMs);
              }
            });
          }

          if (expandButton) {
            expandButton.addEventListener("click", () => {
              const target = panoContainer();
              if (!target) return;
              const expanded = target.classList.toggle("expanded");
              expandButton.textContent = expanded ? "Collapse" : "Expand";
              resizePanorama();
            });
          }

          if (interiorButton) {
            interiorButton.addEventListener("click", () => {
              const next = currentSource === "OUTDOOR" ? "DEFAULT" : "OUTDOOR";
              interiorButton.textContent = next === "DEFAULT" ? "Exterior" : "Interior";
              loadPanorama(next);
            });
          }
          if (interiorAltButton) {
            interiorAltButton.addEventListener("click", () => {
              const next = currentSource === "OUTDOOR" ? "DEFAULT" : "OUTDOOR";
              loadPanorama(next);
            });
          }
          const copyButton = popupEl.querySelector(`[data-copy]`);
          if (copyButton) {
            copyButton.addEventListener("click", async () => {
              const value = copyButton.getAttribute("data-copy");
              try {
                await navigator.clipboard.writeText(value || "");
                copyButton.textContent = "Copied";
                setTimeout(() => {
                  copyButton.textContent = "Copy coords";
                }, 1200);
              } catch (error) {
                copyButton.textContent = "Copy failed";
                setTimeout(() => {
                  copyButton.textContent = "Copy coords";
                }, 1200);
              }
            });
          }

          loadPanorama("OUTDOOR");
          attachResizeHandle(panoContainer());
          watchResize();
          popup.on("close", () => {
            if (resizeObserver) resizeObserver.disconnect();
            resizeObserver = null;
            if (pendingFailTimer) clearTimeout(pendingFailTimer);
          });
        } catch (error) {
          const node = panoContainer();
          if (node) node.textContent = "Street View failed to load.";
        }
      });
    }

    async function geocode(query) {
      const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`;
      const response = await fetch(url, { headers: { "Accept": "application/json" } });
      if (!response.ok) throw new Error("Geocoding failed");
      const results = await response.json();
      return results && results.length ? results[0] : null;
    }

    async function runSearch() {
      const query = searchInput.value.trim();
      if (!query) return;
      try {
        const result = await geocode(query);
        if (!result) {
          return;
        }
        const lon = parseFloat(result.lon);
        const lat = parseFloat(result.lat);
        flyTo([lon, lat], 13);
      } catch (error) {
      }
    }

    searchButton.addEventListener("click", runSearch);

    ];
    let countsScheduled = false;

    function updateCounts() {
      if (!map.isStyleLoaded()) return;
      if (countsScheduled) return;
      countsScheduled = true;
      requestAnimationFrame(() => {
        countsScheduled = false;
        const zoom = map.getZoom();
        if (zoom < 4) {
          countsPanel.style.display = "none";
          return;
        }
        countsPanel.style.display = "block";
        const layerId = zoom < 9 ? LAYERS.overview : LAYERS.places;
        if (!map.getLayer(layerId)) return;
        const features = map.queryRenderedFeatures({ layers: [layerId] });
        const counts = {
          christian: 0,
          muslim: 0,
          hindu: 0,
          buddhist: 0,
          jewish: 0,
          sikh: 0,
          shinto: 0,
          taoist: 0,
          unknown: 0
        };
        features.forEach((feature) => {
          const key = feature.properties?.religion || "unknown";
          if (counts[key] === undefined) {
            counts.unknown += 1;
          } else {
            counts[key] += 1;
          }
        });
        countsList.innerHTML = "";
        let total = 0;
        countLabels.forEach(({ key, label, color }) => {
          const value = counts[key] || 0;
          total += value;
          const item = document.createElement("li");
          item.innerHTML =
            `<span class="legend"><span class="dot" style="background:${color}"></span>${label}</span>` +
            `<span>${value.toLocaleString()}</span>`;
          countsList.appendChild(item);
        });
        countsTotal.textContent = `Total: ${total.toLocaleString()}`;
      });
    }

    let tileTimer = null;
    function showTileStatus() {
      tileStatus.classList.add("visible");
      if (tileTimer) clearTimeout(tileTimer);
      tileTimer = setTimeout(() => tileStatus.classList.remove("visible"), 2200);
    }

    map.on("movestart", showTileStatus);
    map.on("moveend", () => {
      updateCounts();
      ensureCustomLayers();
    });
    map.on("zoomstart", showTileStatus);
    map.on("zoomend", () => {
      updateCounts();
      ensureCustomLayers();
    });
    map.on("styledata", showTileStatus);



  </script>
</body>
</html>
